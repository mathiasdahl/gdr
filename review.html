: 845, "tokens_used": 26458}]}}, "active_route": null, "received_at": "2026-08-17T13:44:02", "state_object": [{"content": "Is engineering part BE1 purchased or manufactured (make-or-buy / acquisition type)?", "role": "user"}, {"content": "", "role": "assistant", "tool_calls": [{"function": {"arguments": "{\"business_object_name\":\"Engineering Part\"}", "name": "GetBusinessObject"}, "id": "call_cAFGDr3bJ57w9jhpnwAQ7t6h", "type": "function"}]}, {"content": "[{\"BusinessObject\": \"Engineering Part Revision Structure\", \"Path\": \"EngineeringPartRevisionStructureBusinessObject.svc/EngPartRevisionSet\", \"Description\": \"The as-designed engineering definition of a product revision and its engineering bill-of-material (BOM). Holds the revision-controlled record of an ENGINEERING part (EngPartRevision), the engineering part master common to all revisions (EngPartMaster), and the consists-of engineering structure (EngPartStructure: components, quantities, positions).\\nAnswers questions about: engineering parts (engineering part number, class, responsible, acquisition/make-or-buy, planning method); engineering revisions (current released revision, revision status/lifecycle Preliminary/Active/Released/Obsolete, released/active/obsolete dates, engineering change order, development level, technical drawing); engineering structures (engineering BOM, what parts make up an assembly, component/child parts and their quantities and positions, where-used); engineering part costs and hours at the revision level (assumed, standard, work, material, and calculated cost, calculated/actual work hours, lead time); and the document requirements connected to a part revision (required document classes, categories, direction, and requirement profiles).\\nThis represents ENGINEERING (as-designed, PDM) parts ONLY. Do NOT use it for other part types or downstream data: inventory parts and stock balances (InventoryPart, InventoryPartInStock), MRP / material planning parts and supply-demand (MrpPart, MrpPartAction, MrpPartSupplyDemand), manufacturing product/configuration structures (ProductStructure, ConfigurationStructure), or shop-floor / manufacturing execution (ShopOrder). The cost and hour figures here are revision-level ENGINEERING estimates common to all sites; Do NOT use this BO for SITE-SPECIFIC costs (per-site standard/average/inventory-value costing, cost sets, cost buckets by site) - those live in the inventory / costing objects (e.g. InventoryPartCost, InvPartSiteCost) and are not represented here. It carries no on-hand balances, no supply/demand or planning figures, no site-specific cost, and no shop-floor status. Entry projection EngineeringPartRevisionStructureBusinessObject.\", \"Synonyms\": [\"engineering part\", \"engineering part revision\", \"engineering revision\", \"engineering BOM\", \"engineering bill of material\", \"engineering structure\", \"consists of\", \"engineering product structure\", \"part revision structure\", \"engineering part cost\", \"engineering document requirement\", \"required documents\"], \"IsBusinessObjectGranted\": true}, {\"BusinessObject\": \"Inventory Part\", \"Path\": \"InventoryPartBusinessObject.svc/InventoryPartSet\", \"Description\": \"Inventory Parts are stock-managed items registered at specific sites containing essential information for inventory management and warehousing. Each part is identified by its part number and site\", \"Synonyms\": [\"Stock Part\", \"Stock Item\", \"Inventory Item\", \"Stocked Part\", \"Warehouse Part\", \"Inventory Material\", \"SKU\", \"Stock Keeping Unit\", \"Warehouse Item\", \"Material Part\"], \"IsBusinessObjectGranted\": true}, {\"BusinessObject\": \"Maintenance Program\", \"Path\": \"MaintenanceProgramBusinessObject.svc/MaintProgramSet\", \"Description\": \"Business object for defining and managing maintenance programs in Fleet and Asset Management. Represents maintenance programs with revisions that define scheduled maintenance requirements for engineering parts. Includes assigned parts and part revisions that are in scope for maintenance, maintenance groups that define part-specific maintenance requirements with average value rules and preferred groupings, and affected serials assigned to the program. Integrates with engineering part master and revision data, manufacturer information, and Part Serial Catalog for serial identity and operational attributes. Tracks access control through access groups, and maintains a journal of changes and events throughout the maintenance program life-cycle. Links to vehicle serial registration data for affected serials.\", \"Synonyms\": [\"Maintenance Program\", \"Maint Program\", \"Maint Prog\", \"Define Maintenance Program\", \"FAM Maintenance Program\"], \"IsBusinessObjectGranted\": true}, {\"BusinessObject\": \"Mrp Part\", \"Path\": \"MrpPartBusinessObject.svc/MrpPartSet\", \"Description\": \"This is used to study information about an inventory part which is planned by Material Requirement Planning (MRP) or Project Material Requirement Planning (project MRP) or by Master Scheduling or Project Master Scheduling.\", \"Synonyms\": [\"MRP Part Details\", \"MRP Parameters\", \"MRP Planning Parameters\"], \"IsBusinessObjectGranted\": true}, {\"BusinessObject\": \"Serial Structure Template\", \"Path\": \"SerialStructureTemplateBusinessObject.svc/SerialStructureTemplateSet\", \"Description\": \"Business object for managing Serial Structure Templates in Fleet and Asset Management. Defines standard, reusable hierarchical part structures that serve as blueprints for building actual serial structures. Organizes engineering parts in parent-child relationships with configurable structure positions, catalog references, and minimum configuration requirements. Supports template-level and position-level alternates with interchangeability rules and approval workflows. Manages dependencies between structure positions with mandatory and recommended enforcement levels. Integrates with engineering master and revision data, part catalogs, and product function definitions. Tracks life-limited parts and regulatory compliance requirements including ETOPS, RVSM, and Lower Minimums Programs. Enables separate template configuration for complex assemblies, modification-based position introductions and removals, and function assignments to structure positions. Provides comprehensive audit trail through journal entries tracking all template modifications throughout the template life-cycle.\", \"Synonyms\": [\"Template Structure\", \"Equipment Template\", \"Structure Template\", \"Part Structure Template\", \"Serial Template\"], \"IsBusinessObjectGranted\": true}]", "name": "GetBusinessObject", "role": "tool", "tool_call_id": "call_cAFGDr3bJ57w9jhpnwAQ7t6h"}, {"content": "", "role": "assistant", "tool_calls": [{"function": {"arguments": "{\"path\":\"EngineeringPartRevisionStructureBusinessObject.svc/EngPartRevisionSet\",\"intent\":\"LOOKUP\"}", "name": "GetBusinessObjectInfo"}, "id": "call_Oz46paSfZV76t3k7coHOeREu", "type": "function"}]}, {"content": "\\{\"api_endpoint\":\"EngineeringPartRevisionStructureBusinessObject.svc/EngPartRevisionSet\",\"summary\":\"Entry point for the as-designed ENGINEERING part revision, its engineering part master, engineering bill-of-material (consists-of structure), revision-level costs and hours, and the connected document requirements. Answers questions about engineering parts (part number, class, responsible, acquisition, provide/make-or-buy, planning method, UoM, tracking, technical class), engineering revisions (current released revision, revision status/lifecycle, released/active/obsolete dates, engineering change order, technical drawing), engineering structures (engineering BOM, what parts make up an assembly, component parts, quantities and positions), engineering part costs and hours (assumed/standard/work/material and calculated cost, work hours, lead time), and the document requirements of a part revision (required document classes, categories, direction, profiles). These engineering-part (master) attributes live on EngPartMaster and are returned by expanding PartNoRef on EngPartRevisionSet, not as columns of EngPartRevisionSet. Covers ENGINEERING (design intent / PDM) parts only; not inventory parts or stock balances (InventoryPart, InventoryPartInStock), MRP / planning parts (MrpPart, MrpPartAction, MrpPartSupplyDemand), manufacturing product/configuration structures (ProductStructure, ConfigurationStructure), or shop-floor execution (ShopOrder).\",\"description\":\"The as-designed engineering definition of a product revision and its engineering bill-of-material (BOM). Holds the revision-controlled record of an ENGINEERING part (EngPartRevision), the engineering part master common to all revisions (EngPartMaster), and the consists-of engineering structure (EngPartStructure: components, quantities, positions).\\nAnswers questions about: engineering parts (engineering part number, class, responsible, provide, project doc req profile, acquisition/make-or-buy, planning method); engineering revisions (current released revision, revision status/lifecycle Preliminary/Active/Released/Obsolete, released/active/obsolete dates, engineering change order, development level, technical drawing); engineering structures (engineering BOM, what parts make up an assembly, component/child parts and their quantities and positions, where-used); engineering part costs and hours at the revision level (assumed, standard, work, material, and calculated cost, calculated/actual work hours, lead time); and the document requirements connected to a part revision (required document classes, categories, direction, and requirement profiles).\\nThis represents ENGINEERING (as-designed, PDM) parts ONLY. Do NOT use it for other part types or downstream data: inventory parts and stock balances (InventoryPart, InventoryPartInStock), MRP / material planning parts and supply-demand (MrpPart, MrpPartAction, MrpPartSupplyDemand), manufacturing product/configuration structures (ProductStructure, ConfigurationStructure), or shop-floor / manufacturing execution (ShopOrder). The cost and hour figures here are revision-level ENGINEERING estimates common to all sites; Do NOT use this BO for SITE-SPECIFIC costs (per-site standard/average/inventory-value costing, cost sets, cost buckets by site) - those live in the inventory / costing objects (e.g. InventoryPartCost, InvPartSiteCost) and are not represented here. It carries no on-hand balances, no supply/demand or planning figures, no site-specific cost, and no shop-floor status. Entry projection EngineeringPartRevisionStructureBusinessObject.\\nIf a request contains only an Engineering Part Number and no revision is specified, use the current revision of the engineering part and explicitly indicate which revision was used, unless the user requests a specific revision. This governs only which revision to select, not which fields to return - still expand references (e.g. PartNoRef for any part-master attribute: part class, responsible, acquisition, provide, document requirement profile or planning method) when needed to answer the question.\",\"key_predicate\":\"(PartNo = {PartNo} AND PartRev = {PartRev})\",\"available_attributes\":[{\"name\":\"ETag\",\"data_type\":\"ETag\"},{\"name\":\"luname\",\"description\":\"The luname is: 'EngPartRevision'\",\"data_type\":\"Text\"},{\"name\":\"keyref\",\"data_type\":\"Text\"},{\"name\":\"Objgrants\",\"data_type\":\"Text\",\"label\":\"Granted access\"},{\"name\":\"PartNo\",\"description\":\"Engineering part number this revision belongs to. Synonyms: part number, engineering part no, part no.\",\"data_type\":\"Text\",\"label\":\"Part Number\"},{\"name\":\"PartRev\",\"description\":\"Engineering revision identifier of the part. Synonyms: revision, eng rev, part revision, revision id, engineering part revision, engineering revision.\",\"data_type\":\"Text\",\"label\":\"Part Revision\"},{\"name\":\"RevNo\",\"description\":\"Sequential revision number of the part revision. Synonyms: revision number, rev no.\",\"data_type\":\"Number\",\"label\":\"Rev No\"},{\"name\":\"EcoNo\",\"description\":\"Engineering change order number that introduced or governs this revision. Synonyms: CO No, change order, ECO, engineering change order.\",\"data_type\":\"Text\",\"label\":\"Eco No\"},{\"name\":\"ObsoleteDt\",\"description\":\"Date the revision was made obsolete. Synonyms: obsoleted date, obsolete date.\",\"data_type\":\"Date\",\"label\":\"Obsolete Dt\"},{\"name\":\"ReleasedDt\",\"description\":\"Date the revision was released. Synonyms: released date, release date.\",\"data_type\":\"Date\",\"label\":\"Released Dt\"},{\"name\":\"StrActiveDt\",\"description\":\"Date the revision structure became active. Synonyms: activated date, active date.\",\"data_type\":\"Date\",\"label\":\"Str Active Dt\"},{\"name\":\"DevelopLev\",\"description\":\"Development level (maturity) of the revision. Synonyms: development level, dev level, maturity level.\",\"data_type\":\"Text\",\"label\":\"Develop Lev\"},{\"name\":\"Info1\",\"description\":\"Free-text note on the revision. Synonyms: note, remark, comment.\",\"data_type\":\"Text\",\"label\":\"Info\"},{\"name\":\"AssumedLeadTime\",\"description\":\"Assumed (estimated) lead time for the part revision. Synonyms: assumed lead time, estimated lead time.\",\"data_type\":\"Number\",\"label\":\"Assumed Lead Time\"},{\"name\":\"AssumedCost\",\"description\":\"Assumed (estimated) cost of the part revision. Synonyms: assumed cost, estimated cost.\",\"data_type\":\"Number\",\"label\":\"Assumed Cost\"},{\"name\":\"LeadTime\",\"description\":\"Actual lead time for the part revision. Synonyms: actual lead time, lead time.\",\"data_type\":\"Number\",\"label\":\"Lead Time\"},{\"name\":\"StdCost\",\"description\":\"Standard cost of the part revision. Synonyms: standard cost, std cost.\",\"data_type\":\"Number\",\"label\":\"Std Cost\"},{\"name\":\"WorkCost\",\"description\":\"Work (labor) cost of the part revision. Synonyms: work cost, labor cost.\",\"data_type\":\"Number\",\"label\":\"Work Cost\"},{\"name\":\"CalcCost\",\"description\":\"Calculated material cost of the revision. Synonyms: calculated cost, calc cost, calculated material cost.\",\"data_type\":\"Number\",\"label\":\"Calc Cost\"},{\"name\":\"CalcWork\",\"description\":\"Calculated work (labor) cost of the revision. Synonyms: calculated work cost, calc work cost.\",\"data_type\":\"Number\",\"label\":\"Calc Work\"},{\"name\":\"DtCre\",\"description\":\"Timestamp when the part revision was created. Synonyms: created, created date, creation date.\",\"data_type\":\"Timestamp\",\"label\":\"Date Created\"},{\"name\":\"UserCreated\",\"description\":\"User who created the part revision. Synonyms: created by, creator, created by user.\",\"data_type\":\"Text\",\"label\":\"User Created\"},{\"name\":\"DtChg\",\"description\":\"Timestamp when the part revision was last modified. Synonyms: modified, modified date, last changed, change date.\",\"data_type\":\"Timestamp\",\"label\":\"Date Chg\"},{\"name\":\"UserSign\",\"description\":\"User who last modified the part revision. Synonyms: modified by, changed by, last modified by.\",\"data_type\":\"Text\",\"label\":\"User Sign\"},{\"name\":\"MaterialCost\",\"description\":\"Material cost of the part revision. Synonyms: material cost.\",\"data_type\":\"Number\",\"label\":\"Material Cost\"},{\"name\":\"WorkHour\",\"description\":\"Work hours for the part revision. Synonyms: work hours, labor hours.\",\"data_type\":\"Number\",\"label\":\"Work Hour\"},{\"name\":\"CalcHour\",\"description\":\"Calculated work hours for the revision. Synonyms: calculated work hours, calc hours.\",\"data_type\":\"Number\",\"label\":\"Calc Hour\"},{\"name\":\"TransferredToManuf\",\"description\":\"Date the part revision was transferred to manufacturing. Synonyms: transferred to manufacturing, transfer to manufacturing date, manufacturing transfer.\",\"data_type\":\"Date\",\"label\":\"Transferred To Manuf\"},{\"name\":\"TechnicalDrawingNo\",\"description\":\"Technical drawing number linked to the revision. Synonyms: drawing no, drawing number, technical drawing no.\",\"data_type\":\"Text\",\"label\":\"Technical Drawing No\"},{\"name\":\"TechDrawingRevisionNo\",\"description\":\"Technical drawing revision number. Synonyms: drawing revision, drawing rev no, technical drawing revision no.\",\"data_type\":\"Text\",\"label\":\"Tech Drawing Revision No\"},{\"name\":\"Objstate\",\"description\":\"Life cycle status of the part revision. Values: Preliminary, Active, Released, Obsolete. Synonyms: status, state, revision status, lifecycle state.\",\"data_type\":\"IfsApp.EngineeringPartRevisionStructureBusinessObject.EngPartRevisionState\",\"enum\":[{\"client_value\":\"Preliminary\",\"identifier\":\"Preliminary\"},{\"client_value\":\"Active\",\"identifier\":\"Active\"},{\"client_value\":\"Released\",\"identifier\":\"Released\"},{\"client_value\":\"Obsolete\",\"identifier\":\"Obsolete\"}],\"label\":\"State\"},{\"name\":\"LuName\",\"description\":\"Logical unit name of the part revision, derived for object connection joins (always 'EngPartRevision'). Used to link document requirements to this revision. Synonyms: logical unit, lu, object type.\",\"data_type\":\"Text\",\"label\":\"LU Name\"},{\"name\":\"KeyRef\",\"description\":\"Key reference string identifying this part revision (PART_NO/PART_REV) for object connection joins. Used to link document requirements to this revision. Synonyms: key reference, object key, record key.\",\"data_type\":\"Text\",\"label\":\"Key Ref\"},{\"name\":\"Description\",\"description\":\"Engineering part description taken from the part catalog in the database (base) language. Synonyms: part description, engineering part description, description.\",\"data_type\":\"Text\",\"label\":\"Engineering Part Description\"},{\"name\":\"StdName\",\"description\":\"Standard name of the engineering part. Synonyms: standard name, std name.\",\"data_type\":\"Text\",\"label\":\"Standard Name\"}],\"expandable_options\":[{\"attribute\":\"PartNoRef\",\"description\":\"Engineering part master common to all revisions. $expand=PartNoRef. CAN BE USE in $expand like $expand=PartNoRef\"},{\"attribute\":\"EcoNoRef\",\"description\":\"Engineering change order governing the revision. $expand=EcoNoRef. CAN BE USE in $expand like $expand=EcoNoRef\"},{\"attribute\":\"DevelopLevRef\",\"description\":\"Development level lookup. $expand=DevelopLevRef. CAN BE USE in $expand like $expand=DevelopLevRef\"},{\"attribute\":\"TechDrawingRevisionNoRef\",\"description\":\"Technical drawing revision lookup. $expand=TechDrawingRevisionNoRef. CAN BE USE in $expand like $expand=TechDrawingRevisionNoRef\"}],\"non_expandable\":[{\"nav_path\":\"EngineeringPartRevisionStructureBusinessObject.svc/EngPartRevisionSet(PartNo={PartNo},PartRev={PartRev})/EngPartStructureArray\",\"navigation_attributes\":[{\"name\":\"ETag\",\"data_type\":\"ETag\"},{\"name\":\"luname\",\"data_type\":\"Text\"},{\"name\":\"keyref\",\"data_type\":\"Text\"},{\"name\":\"Objgrants\",\"data_type\":\"Text\",\"label\":\"Granted access\"},{\"name\":\"PartNo\",\"description\":\"Parent engineering part number of this structure line. Synonyms: parent part, assembly part.\",\"data_type\":\"Text\",\"label\":\"Part Number\"},{\"name\":\"PartRev\",\"description\":\"Parent engineering part revision of this structure line. Synonyms: parent revision, assembly revision.\",\"data_type\":\"Text\",\"label\":\"Part Revision\"},{\"name\":\"SubPartNo\",\"description\":\"Component (child) engineering part number used in the parent. Synonyms: component part, child part, sub part, material part, subassembly.\",\"data_type\":\"Text\",\"label\":\"Sub Part Number\"},{\"name\":\"SubPartRev\",\"description\":\"Component (child) engineering part revision. Synonyms: component revision, child revision, sub part revision, subassembly revision.\",\"data_type\":\"Text\",\"label\":\"Sub Part Revision\"},{\"name\":\"StructureId\",\"data_type\":\"Text\",\"label\":\"Structure Id\"},{\"name\":\"Pos\",\"description\":\"Position (POS) of a component or subassembly within the parent engineering BOM (consists-of). Use when the question asks for the position number of child items or subassemblies under a given parent part revision. Do NOT use for where-used or parent/assembly position questions those belong on EngPartStructureExt. Synonyms: position, POS, drawing position, line position, BOM position, component position, drawing position number.\",\"data_type\":\"Text\",\"label\":\"Position\"},{\"name\":\"Qty\",\"description\":\"Quantity of the component required per parent assembly. Synonyms: quantity, qty, qty per assembly, component quantity.\",\"data_type\":\"Number\",\"label\":\"Quantity\"},{\"name\":\"StrComment\",\"description\":\"Free-text comment on the structure line. Synonyms: comment, note, remark.\",\"data_type\":\"Text\",\"label\":\"Comment\"},{\"name\":\"SortNo\",\"description\":\"Sort order of the structure line. Synonyms: sort number, sort order, sequence.\",\"data_type\":\"Number\",\"label\":\"Sort No\"}],\"description\":\"WHEN: engineering BOM, bill of material, consists of, components, what parts make up this assembly, component list, component quantities, structure of this revision. THEN: nav EngPartStructureArray; component part is SubPartNo + SubPartRev, quantity is Qty, position is Pos. ACCESS: $expand=EngPartStructureArray on EngPartRevisionSet(PartNo=\\u003cx\\u003e,PartRev=\\u003cy\\u003e); keys PartNo, PartRev. Synonyms: BOM, bill of material, consists of, components, structure components.. CAN NOT USE this nav_path construct $expand in query_options. If $expand=EngPartStructureArray is used, then it throws error.\"},{\"nav_path\":\"EngineeringPartRevisionStructureBusinessObject.svc/EngPartRevisionSet(PartNo={PartNo},PartRev={PartRev})/DocumentRequirementsArray\",\"navigation_attributes\":[{\"name\":\"ETag\",\"data_type\":\"ETag\"},{\"name\": ",\"data_type\":\"Boolean\",\"label\":\"Standard Profile\"},{\"name\":\"DocReqProfile\",\"description\":\"Document requirement profile identifier the requirement originates from. Synonyms: doc req profile, requirement profile, profile id.\",\"data_type\":\"Text\",\"label\":\"Doc. Req. ID\"}],\"description\":\". CAN NOT USE this nav_path construct $expand in query_options. If $expand=DocumentRequirementsArray is used, then it throws error.\"},{\"nav_path\":\"EngineeringPartRevisionStructureBusinessObject.svc/EngPartRevisionSet(PartNo={PartNo},PartRev={PartRev})/EngPartWhereUsedArray\",\"navigation_attributes\":[{\"name\":\"ETag\",\"data_type\":\"ETag\"},{\"name\":\"luname\",\"data_type\":\"Text\"},{\"name\":\"keyref\",\"data_type\":\"Text\"},{\"name\":\"Objgrants\",\"data_type\":\"Text\",\"label\":\"Granted access\"},{\"name\":\"PartNo\",\"description\":\"Parent engineering part number that uses (consumes) this revision as a component. Synonyms: parent part, used in part, where used part, assembly part.\",\"data_type\":\"Text\",\"label\":\"Part Number\"},{\"name\":\"PartRev\",\"description\":\"Parent engineering part revision that uses this revision as a component. Synonyms: parent revision, used in revision, assembly revision.\",\"data_type\":\"Text\",\"label\":\"Part Revision\"},{\"name\":\"SubPartNo\",\"description\":\"Component (child) engineering part number - this revision. Synonyms: component part, child part, this part.\",\"data_type\":\"Text\",\"label\":\"Number\"},{\"name\":\"SubPartRev\",\"description\":\"Component (child) engineering part revision - this revision. Synonyms: component revision, child revision, this revision.\",\"data_type\":\"Text\",\"label\":\"Revision\"},{\"name\":\"StructureId\",\"data_type\":\"Text\",\"label\":\"Structure Id\"},{\"name\":\"Pos\",\"description\":\"Position (POS) of this part as used in a parent assembly (where-used). Use when the question asks for position numbers from the parent or where-used perspective which assembli T_NO=DP1^SUB_PART_REV=R01^\", \"luname\": \"EngPartStructure\"}]}, {\"total_count\": 7}]", "name": "DoOdataCall", "role": "tool", "tool_call_id": "call_AwhxpDfGnAUSsVkj29csFsu1"}, {"content": "From the data I can see, one clear example that matches your conditions is:\n\n**Assembly:** PA1 / R01  \n- **Status:** Released  \n- **BOM components (STD structure):**\n\n| Pos | Component Part | Rev | Qty |\n|-----|----------------|-----|-----|\n| 10  | BD1            | R01 | 1   |\n| 20  | BP01           | R01 | 1   |\n| 30  | LN1            | R01 | 2   |\n| 40  | WS1            | R01 | 4   |\n| 50  | DP1            | R01 | 2   |\n\nChecks against your criteria:\n- **Released revision?** Yes (PA1 / R01 is Released).\n- **More than 1 distinct component part numbers?** Yes (BD1, BP01, LN1, WS1, DP1 → 5 distinct components).\n- **At least one component with quantity > 1?** Yes (LN1 Qty = 2, WS1 Qty = 4, DP1 Qty = 2).\n\nSo **PA1 / R01** is an assembly whose BOM satisfies all of your stated conditions.\n\nNote: I only inspected a subset (top 20) of Released revisions and then one known assembly (PA1) in detail. There may be more such assemblies in your system beyond this subset.\n\nDo you want me to search specifically within certain part classes or for additional assemblies beyond PA1?", "role": "assistant", "tool_calls": null}, {"content": "Golden dataset: bad answer", "role": "user"}, {"content": "You’re right to flag that; my previous answer did **not** correctly or completely implement what you asked. Here’s why it was a bad answer and how it should have been handled.\n\n### What you asked\n\nYou requested:\n\n> “Which assemblies **in part classes** have a **Released** revision whose **BOM**:\n> - contains **more than 1 distinct component part numbers**, and  \n> - has **at least one component quantity greater than 1**?”\n\nKey points I should have enforced:\n\n1. Only **assemblies that belong to a part class** (PartClass not null).\n2. Only **Released** revisions.\n3. Only assemblies whose **engineering BOM**:\n   - has **> 1 distinct SubPartNo**, and  \n   - has **at least one line with Qty > 1**.\n4. Return **all matches found** within the queried range, not just a single example, and clearly indicate that the search was partial (limited by $top) if so.\n\n### What I actually did wrong\n\n1. I only:\n   - Fetched a generic list of Released revisions (top 20).\n   - Looked at one specific structure (PA1/R01).\n   - Then reported PA1/R01 as if that answers “which assemblies”, without:\n     - Checking that PA1 is in a **part class**.\n     - Evaluating all other Released assemblies in the result.\n     - Making it explicit that I only inspected PA1’s structure, not all candidates.\n\n2. I implicitly treated PA1/R01 as a valid example without verifying:\n   - Whether PA1 had **PartClass** assigned.\n   - Whether PA1 was one of the Released revisions in a part class.\n   - Whether there were other assemblies in part classes matching your conditions.\n\n3. The answer phrased “one clear example that matches your conditions is PA1 / R01” in a way that can be read as *the* answer, rather than a partial illustration based on a single BOM check.\n\n### How I should have answered\n\nA correct approach (within the technical limitation that EngPartStructureArray is a non-expandable navigation and must be queried per parent) would be:\n\n1. Filter Released engineering revisions whose part master has **PartClass not null**:\n   - Use EngPartRevisionSet with:\n     - Objstate = Released.\n     - $expand PartNoRef.\n     - Then filter client-side for PartNoRef.PartClass not null.\n2. For each such parent (within the $top limit):\n   - Call the EngPartStructureArray navigation:\n     - Get the BOM lines.\n     - Compute:\n       - Count of distinct SubPartNo.\n       - Whether any Qty > 1.\n   - Select only those parents where both conditions are satisfied.\n3. Return a **list of assemblies** found, such as:\n\n```text\nPartNo / PartRev, number of distinct components, max Qty, etc.\n```\n\nand clearly state:\n\n- How many assemblies were checked (limited by $top).\n- That additional matches may exist beyond that limit.\n\nIf no assemblies matched in the checked subset, I should have explicitly said so.\n\n### What I will do differently next time\n\n- Be explicit when I only inspect **one** BOM and not the whole candidate set.\n- Always verify **PartClass** (since you explicitly asked for assemblies “in part classes”).\n- Clarify when results are **partial** due to $top or technical constraints.\n- Avoid presenting a single example as if it fully answers a query that is clearly **set-based** (“Which assemblies…”).\n\nIf you’d like, I can rerun a more systematic check (within the technical constraints) and explicitly list:\n\n- All Released assemblies (within a given limit) whose part master has **PartClass not null**, and\n- Whose BOM meets the “> 1 distinct components” and “≥ 1 Qty > 1” criteria.\n\nDo you want me to re-run that search with, for example, a limit of the first 20 or 50 Released assemblies in part classes?", "role": "assistant", "tool_calls": null}, {"id": "c72197c8-3ecc-4782-9529-926751e4705b"}], "state_count": 53, "token_usage": [{"tools": ["initial_request"], "prompt_tokens_used": 25613, "completion_tokens_used": 845, "tokens_used": 26458}], "token_compact": "initial_request 26458 (25613+845) · Σ26458"}, {"history_id": 10826, "conversation_id": "9e87750d-c5d5-417c-8798-dc5e04de5982", "question": "Golden dataset: good answer", "answer_text": "Thanks for confirming. I’ll use this style of answer for similar engineering structure queries going forward.\n\nWould you like to run another query on engineering parts or BOMs now?", "answer": {"answer": "Thanks for confirming. I’ll use this style of answer for similar engineering structure queries going forward.\n\nWould you like to run another query on engineering parts or BOMs now?", "data_points": [], "debugInfo": {"token_usage": [{"tools": ["initial_request"], "prompt_tokens_used": 10244, "completion_tokens_used": 44, "tokens_used": 10288}]}}, "active_route": null, "received_at": "2026-08-17T13:50:03", "state_object": [{"content": "Find assemblies where engineering part CA1 R01 appears as a component with quantity greater than 0, the parent revision preliminary ?", "role": "user"}, {"content": "", "role": "assistant", "tool_calls": [{"function": {"arguments": "{\"business_object_name\":\"engineering assemblies with component parts and statuses\"}", "name": "GetBusinessObject"}, "id": "call_JFwMvB3oRSvojmjVgPH62bn4", "type": "function"}]}, {"content": "[{\"BusinessObject\": \"Serial Structure Template\", \"Path\": \"SerialStructureTemplateBusinessObject.svc/SerialStructureTemplateSet\", \"Description\": \"Business object for managing Serial Structure Templates in Fleet and Asset Management. Defines standard, reusable hierarchical part structures that serve as blueprints for building actual serial structures. Organizes engineering parts in parent-child relationships with configurable structure positions, catalog references, and minimum configuration requirements. Supports template-level and position-level alternates with interchangeability rules and approval workflows. Manages dependencies between structure positions with mandatory and recommended enforcement levels. Integrates with engineering master and revision data, part catalogs, and product function definitions. Tracks life-limited parts and regulatory compliance requirements including ETOPS, RVSM, and Lower Minimums Programs. Enables separate template configuration for complex assemblies, modification-based position introductions and removals, and function assignments to structure positions. Provides comprehensive audit trail through journal entries tracking all template modifications throughout the template life-cycle.\", \"Synonyms\": [\"Template Structure\", \"Equipment Template\", \"Structure Template\", \"Part Structure Template\", \"Serial Template\"], \"IsBusinessObjectGranted\": true}, {\"BusinessObject\": \"Engineering Part Revision Structure\", \"Path\": \"EngineeringPartRevisionStructureBusinessObject.svc/EngPartRevisionSet\", \"Description\": \"The as-designed engineering definition of a product revision and its engineering bill-of-material (BOM). Holds the revision-controlled record of an ENGINEERING part (EngPartRevision), the engineering part master common to all revisions (EngPartMaster), and the consists-of engineering structure (EngPartStructure: components, quantities, positions).\\nAnswers questions about: engineering parts (engineering part number, class, responsible, acquisition/make-or-buy, planning method); engineering revisions (current released revision, revision status/lifecycle Preliminary/Active/Released/Obsolete, released/active/obsolete dates, engineering change order, development level, technical drawing); engineering structures (engineering BOM, what parts make up an assembly, component/child parts and their quantities and positions, where-used); engineering part costs and hours at the revision level (assumed, standard, work, material, and calculated cost, calculated/actual work hours, lead time); and the document requirements connected to a part revision (required document classes, categories, direction, and requirement profiles).\\nThis represents ENGINEERING (as-designed, PDM) parts ONLY. Do NOT use it for other part types or downstream data: inventory parts and stock balances (InventoryPart, InventoryPartInStock), MRP / material planning parts and supply-demand (MrpPart, MrpPartAction, MrpPartSupplyDemand), manufacturing product/configuration structures (ProductStructure, ConfigurationStructure), or shop-floor / manufacturing execution (ShopOrder). The cost and hour figures here are revision-level ENGINEERING estimates common to all sites; Do NOT use this BO for SITE-SPECIFIC costs (per-site standard/average/inventory-value costing, cost sets, cost buckets by site) - those live in the inventory / costing objects (e.g. InventoryPartCost, InvPartSiteCost) and are not represented here. It carries no on-hand balances, no supply/demand or planning figures, no site-specific cost, and no shop-floor status. Entry projection EngineeringPartRevisionStructureBusinessObject.\", \"Synonyms\": [\"engineering part\", \"engineering part revision\", \"engineering revision\", \"engineering BOM\", \"engineering bill of material\", \"engineering structure\", \"consists of\", \"engineering product structure\", \"part revision structure\", \"engineering part cost\", \"engineering document requirement\", \"required documents\"], \"IsBusinessObjectGranted\": true}, {\"BusinessObject\": \"Maintenance Program\", \"Path\": \"MaintenanceProgramBusinessObject.svc/MaintProgramSet\", \"Description\": \"Business object for defining and managing maintenance programs in Fleet and Asset Management. Represents maintenance programs with revisions that define scheduled maintenance requirements for engineering parts. Includes assigned parts and part revisions that are in scope for maintenance, maintenance groups that define part-specific maintenance requirements with average value rules and preferred groupings, and affected serials assigned to the program. Integrates with engineering part master and revision data, manufacturer information, and Part Serial Catalog for serial identity and operational attributes. Tracks access control through access groups, and maintains a journal of changes and events throughout the maintenance program life-cycle. Links to vehicle serial registration data for affected serials.\", \"Synonyms\": [\"Maintenance Program\", \"Maint Program\", \"Maint Prog\", \"Define Maintenance Program\", \"FAM Maintenance Program\"], \"IsBusinessObjectGranted\": true}, {\"BusinessObject\": \"Serial Structure\", \"Path\": \"SerialStructureBusinessObject.svc/VimSerialStructureSet\", \"Description\": \"Business object for Managing serial structures in Fleet and Asset Management. Represents both serialized and non-serialized engineering parts organized in parent-child relationships, forming hierarchical serial structures. Includes template-based configuration, structure alternates, and minimum configuration validation. Integrates with engineering master and revision data, and links to vehicle and maintenance program information. Tracks serial identity, manufacturer, ownership, operational status, operational condition, and life-cycle state. Enables access control, maintenance planning, stress and wear tracking, and location management. Provides full audit trail for creation and changes, and supports structure change approvals and operational log recording information throughout the serial structure life-cycle.\", \"Synonyms\": [\"Serial Structure\", \"VIM Serial Structure\", \"Serial\", \"Serial Configuration\", \"Asset Structure\", \"FAM Structure\", \"Fleet Asset\"], \"IsBusinessObjectGranted\": true}, {\"BusinessObject\": \"Serial Maintenance\", \"Path\": \"SerialMaintenanceBusinessObject.svc/VimSerialSet\", \"Description\": \"Serial Maintenance Business Object represents a comprehensive view of a serialized part or component within Vehicle Information Management (VIM) for Maintenance, Repair and Overhaul (MRO) operations. Provides the complete maintenance lifecycle context for a tracked serial including interval-based planned maintenance events, historical last maintenance records, engineering modification and service bulletin compliance tracking, life-limited part (LLP) tracking with accumulated stress and usage values, post-maintenance check schedules, total usage history from all maintenance events, operational parameter accumulation (flight hours, cycles, landings), operational parameter log history, fault and defect history with deferral management, and condition monitoring measurements. Aligns with the Serial Maintenance client page tabs: Interval Maintenance, Last Maintenance, Next Interval Maintenance In Structure (function-based, not represented as a BO array), Modifications, Modifications in Structure (function-based, not represented as a BO array), LLPs in Structure, Post Maintenance, and Total Usage. Essential for MRO planners, engineers, and maintenance controllers to understand the full maintenance state of any fleet asset.\", \"Synonyms\": [\"Serial Maintenance\", \"VIM Serial\", \"Serial\", \"Fleet Asset Maintenance\", \"Aircraft Serial\", \"Component Serial\", \"Engine Serial\", \"MRO Serial\", \"Maintenance Serial\", \"Serial Tracking\", \"Asset Maintenance\", \"Fleet Maintenance\", \"Component Tracking\", \"Life Limited Part\", \"LLP Tracking\", \"Interval Maintenance\", \"Planned Maintenance\", \"Fault Tracking\", \"Condition Monitoring\", \"Operational Parameters\", \"Flight Hours\", \"Flight Cycles\"], \"IsBusinessObjectGranted\": true}]", "name": "GetBusinessObject", "role": "tool", "tool_call_id": "call_JFwMvB3oRSvojmjVgPH62bn4"}, {"content": "", "role": "assistant", "tool_calls": [{"function": {"arguments": "{\"path\":\"EngineeringPartRevisionStructureBusinessObject.svc/EngPartRevisionSet\",\"intent\":\"QUERY\"}", "name": "GetBusinessObjectInfo"}, "id": "call_5JWMcLncBEwoUlApfXP1u10i", "type": "function"}]}, {"content": "\\{\"api_endpoint\":\"EngineeringPartRevisionStructureBusinessObject.svc/EngPartRevisionSet\",\"summary\":\"Entry point for the as-designed ENGINEERING part revision, its engineering part master, engineering bill-of-material (consists-of structure), revision-level costs and hours, and the connected document requirements. Answers questions about engineering parts (part number, class, responsible, acquisition, provide/make-or-buy, planning method, UoM, tracking, technical class), engineering revisions (current released revision, revision status/lifecycle, released/active/obsolete dates, engineering change order, technical drawing), engineering structures (engineering BOM, what parts make up an assembly, component parts, quantities and positions), engineering part costs and hours (assumed/standard/work/material and calculated cost, work hours, lead time), and the document requirements of a part revision (required document classes, categories, direction, profiles). These engineering-part (master) attributes live on EngPartMaster and are returned by expanding PartNoRef on EngPartRevisionSet, not as columns of EngPartRevisionSet. Covers ENGINEERING (design intent / PDM) parts only; not inventory parts or stock balances (InventoryPart, InventoryPartInStock), MRP / planning parts (MrpPart, MrpPartAction, MrpPartSupplyDemand), manufacturing product/configuration structures (ProductStructure, ConfigurationStructure), or shop-floor execution (ShopOrder).\",\"description\":\"The as-designed engineering definition of a product revision and its engineering bill-of-material (BOM). Holds the revision-controlled record of an ENGINEERING part (EngPartRevision), the engineering part master common to all revisions (EngPartMaster), and the consists-of engineering structure (EngPartStructure: components, quantities, positions).\\nAnswers questions about: engineering parts (engineering part number, class, responsible, provide, project doc req profile, acquisition/make-or-buy, planning method); engineering revisions (current released revision, revision status/lifecycle Preliminary/Active/Released/Obsolete, released/active/obsolete dates, engineering change order, development level, technical drawing); engineering structures (engineering BOM, what parts make up an assembly, component/child parts and their quantities and positions, where-used); engineering part costs and hours at the revision level (assumed, standard, work, material, and calculated cost, calculated/actual work hours, lead time); and the document requirements connected to a part revision (required document classes, categories, direction, and requirement profiles).\\nThis represents ENGINEERING (as-designed, PDM) parts ONLY. Do NOT use it for other part types or downstream data: inventory parts and stock balances (InventoryPart, InventoryPartInStock), MRP / material planning parts and supply-demand (MrpPart, MrpPartAction, MrpPartSupplyDemand), manufacturing product/configuration structures (ProductStructure, ConfigurationStructure), or shop-floor / manufacturing execution (ShopOrder). The cost and hour figures here are revision-level ENGINEERING estimates common to all sites; Do NOT use this BO for SITE-SPECIFIC costs (per-site standard/average/inventory-value costing, cost sets, cost buckets by site) - those live in the inventory / costing objects (e.g. InventoryPartCost, InvPartSiteCost) and are not represented here. It carries no on-hand balances, no supply/demand or planning figures, no site-specific cost, and no shop-floor status. Entry projection EngineeringPartRevisionStructureBusinessObject.\\nIf a request contains only an Engineering Part Number and no revision is specified, use the current revision of the engineering part and explicitly indicate which revision was used, unless the user requests a specific revision. This governs only which revision to select, not which fields to return - still expand references (e.g. PartNoRef for any part-master attribute: part class, responsible, acquisition, provide, document requirement profile or planning method) when needed to answer the question.\",\"key_predicate\":\"(PartNo = {PartNo} AND PartRev = {PartRev})\",\"available_attributes\":[{\"name\":\"ETag\",\"data_type\":\"ETag\"},{\"name\":\"luname\",\"description\":\"The luname is: 'EngPartRevision'\",\"data_type\":\"Text\"},{\"name\":\"keyref\",\"data_type\":\"Text\"},{\"name\":\"Objgrants\",\"data_type\":\"Text\",\"label\":\"Granted access\"},{\"name\":\"PartNo\",\"description\":\"Engineering part number this revision belongs to. Synonyms: part number, engineering part no, part no.\",\"data_type\":\"Text\",\"label\":\"Part Number\"},{\"name\":\"PartRev\",\"description\":\"Engineering revision identifier of the part. Synonyms: revision, eng rev, part revision, revision id, engineering part revision, engineering revision.\",\"data_type\":\"Text\",\"label\":\"Part Revision\"},{\"name\":\"RevNo\",\"description\":\"Sequential revision number of the part revision. Synonyms: revision number, rev no.\",\"data_type\":\"Number\",\"label\":\"Rev No\"},{\"name\":\"EcoNo\",\"description\":\"Engineering change order number that introduced or governs this revision. Synonyms: CO No, change order, ECO, engineering change order.\",\"data_type\":\"Text\",\"label\":\"Eco No\"},{\"name\":\"ObsoleteDt\",\"description\":\"Date the revision was made obsolete. Synonyms: obsoleted date, obsolete date.\",\"data_type\":\"Date\",\"label\":\"Obsolete Dt\"},{\"name\":\"ReleasedDt\",\"description\":\"Date the revision was released. Synonyms: released date, release date.\",\"data_type\":\"Date\",\"label\":\"Released Dt\"},{\"name\":\"StrActiveDt\",\"description\":\"Date the revision structure became active. Synonyms: activated date, active date.\",\"data_type\":\"Date\",\"label\":\"Str Active Dt\"},{\"name\":\"DevelopLev\",\"description\":\"Development level (maturity) of the revision. Synonyms: development level, dev level, maturity level.\",\"data_type\":\"Text\",\"label\":\"Develop Lev\"},{\"name\":\"Info1\",\"description\":\"Free-text note on the revision. Synonyms: note, remark, comment.\",\"data_type\":\"Text\",\"label\":\"Info\"},{\"name\":\"AssumedLeadTime\",\"description\":\"Assumed (estimated) lead time for the part revision. Synonyms: assumed lead time, estimated lead time.\",\"data_type\":\"Number\",\"label\":\"Assumed Lead Time\"},{\"name\":\"AssumedCost\",\"description\":\"Assumed (estimated) cost of the part revision. Synonyms: assumed cost, estimated cost.\",\"data_type\":\"Number\",\"label\":\"Assumed Cost\"},{\"name\":\"LeadTime\",\"description\":\"Actual lead time for the part revision. Synonyms: actual lead time, lead time.\",\"data_type\":\"Number\",\"label\":\"Lead Time\"},{\"name\":\"StdCost\",\"description\":\"Standard cost of the part revision. Synonyms: standard cost, std cost.\",\"data_type\":\"Number\",\"label\":\"Std Cost\"},{\"name\":\"WorkCost\",\"description\":\"Work (labor) cost of the part revision. Synonyms: work cost, labor cost.\",\"data_type\":\"Number\",\"label\":\"Work Cost\"},{\"name\":\"CalcCost\",\"description\":\"Calculated material cost of the revision. Synonyms: calculated cost, calc cost, calculated material cost.\",\"data_type\":\"Number\",\"label\":\"Calc Cost\"},{\"name\":\"CalcWork\",\"description\":\"Calculated work (labor) cost of the revision. Synonyms: calculated work cost, calc work cost.\",\"data_type\":\"Number\",\"label\":\"Calc Work\"},{\"name\":\"DtCre\",\"description\":\"Timestamp when the part revision was created. Synonyms: created, created date, creation date.\",\"data_type\":\"Timestamp\",\"label\":\"Date Created\"},{\"name\":\"UserCreated\",\"description\":\"User who created the part revision. Synonyms: created by, creator, created by user.\",\"data_type\":\"Text\",\"label\":\"User Created\"},{\"name\":\"DtChg\",\"description\":\"Timestamp when the part revision was last modified. Synonyms: modified, modified date, last changed, change date.\",\"data_type\":\"Timestamp\",\"label\":\"Date Chg\"},{\"name\":\"UserSign\",\"description\":\"User who last modified the part revision. Synonyms: modified by, changed by, last modified by.\",\"data_type\":\"Text\",\"label\":\"User Sign\"},{\"name\":\"MaterialCost\",\"description\":\"Material cost of the part revision. Synonyms: material cost.\",\"data_type\":\"Number\",\"label\":\"Material Cost\"},{\"name\":\"WorkHour\",\"description\":\"Work hours for the part revision. Synonyms: work hours, labor hours.\",\"data_type\":\"Number\",\"label\":\"Work Hour\"},{\"name\":\"CalcHour\",\"description\":\"Calculated work hours for the revision. Synonyms: calculated work hours, calc hours.\",\"data_type\":\"Number\",\"label\":\"Calc Hour\"},{\"name\":\"TransferredToManuf\",\"description\":\"Date the part revision was transferred to manufacturing. Synonyms: transferred to manufacturing, transfer to manufacturing date, manufacturing transfer.\",\"data_type\":\"Date\",\"label\":\"Transferred To Manuf\"},{\"name\":\"TechnicalDrawingNo\",\"description\":\"Technical drawing number linked to the revision. Synonyms: drawing no, drawing number, technical drawing no.\",\"data_type\":\"Text\",\"label\":\"Technical Drawing No\"},{\"name\":\"TechDrawingRevisionNo\",\"description\":\"Technical drawing revision number. Synonyms: drawing revision, drawing rev no, technical drawing revision no.\",\"data_type\":\"Text\",\"label\":\"Tech Drawing Revision No\"},{\"name\":\"Objstate\",\"description\":\"Life cycle status of the part revision. Values: Preliminary, Active, Released, Obsolete. Synonyms: status, state, revision status, lifecycle state.\",\"data_type\":\"IfsApp.EngineeringPartRevisionStructureBusinessObject.EngPartRevisionState\",\"enum\":[{\"client_value\":\"Preliminary\",\"identifier\":\"Preliminary\"},{\"client_value\":\"Active\",\"identifier\":\"Active\"},{\"client_value\":\"Released\",\"identifier\":\"Released\"},{\"client_value\":\"Obsolete\",\"identifier\":\"Obsolete\"}],\"label\":\"State\"},{\"name\":\"LuName\",\"description\":\"Logical unit name of the part revision, derived for object connection joins (always 'EngPartRevision'). Used to link document requirements to this revision. Synonyms: logical unit, lu, object type.\",\"data_type\":\"Text\",\"label\":\"LU Name\"},{\"name\":\"KeyRef\",\"description\":\"Key reference string identifying this part revision (PART_NO/PART_REV) for object connection joins. Used to link document requirements to this revision. Synonyms: key reference, object key, record key.\",\"data_type\":\"Text\",\"label\":\"Key Ref\"},{\"name\":\"Description\",\"description\":\"Engineering part description taken from the part catalog in the database (base) language. Synonyms: part description, engineering part description, desc , \"Inventory Balance\", \"Parts In Stock\"], \"IsBusinessObjectGranted\": true}, {\"BusinessObject\": \"Inventory Part\", \"Path\": \"InventoryPartBusinessObject.svc/InventoryPartSet\", \"Description\": \"Inventory Parts are stock-managed items registered at specific sites containing essential information for inventory management and warehousing. Each part is identified by its part number and site\", \"Synonyms\": [\"Stock Part\", \"Stock Item\", \"Inventory Item\", \"Stocked Part\", \"Warehouse Part\", \"Inventory Material\", \"SKU\", \"Stock Keeping Unit\", \"Warehouse Item\", \"Material Part\"], \"IsBusinessObjectGranted\": true}, {\"BusinessObject\": \"Mrp Part\", \"Path\": \"MrpPartBusinessObject.svc/MrpPartSet\", \"Description\": \"This is used to study information about an inventory part which is planned by Material Requirement Planning (MRP) or Project Material Requirement Planning (project MRP) or by Master Scheduling or Project Master Scheduling.\", \"Synonyms\": [\"MRP Part Details\", \"MRP Parameters\", \"MRP Planning Parameters\"], \"IsBusinessObjectGranted\": true}, {\"BusinessObject\": \"Mrp Part Supply Demand\", \"Path\": \"MrpPartSupplyDemandBusinessObject.svc/MrpPartSupplyDemandSet\", \"Description\": \"Contains existing open supply and demand orders for the given MRP Part\", \"Synonyms\": [\"MRP supply and demand\", \"Open Supply and Demand orders\", \"material/gross requirements\"], \"IsBusinessObjectGranted\": true}, {\"BusinessObject\": \"Maintenance Program\", \"Path\": \"MaintenanceProgramBusinessObject.svc/MaintProgramSet\", \"Description\": \"Business object for defining and managing maintenance programs in Fleet and Asset Management. Represents maintenance programs with revisions that define scheduled maintenance requirements for engineering parts. Includes assigned parts and part revisions that are in scope for maintenance, maintenance groups that define part-specific maintenance requirements with average value rules and preferred groupings, and affected serials assigned to the program. Integrates with engineering part master and revision data, manufacturer information, and Part Serial Catalog for serial identity and operational attributes. Tracks access control through access groups, and maintains a journal of changes and events throughout the maintenance program life-cycle. Links to vehicle serial registration data for affected serials.\", \"Synonyms\": [\"Maintenance Program\", \"Maint Program\", \"Maint Prog\", \"Define Maintenance Program\", \"FAM Maintenance Program\"], \"IsBusinessObjectGranted\": true}]", "name": "GetBusinessObject", "role": "tool", "tool_call_id": "call_laWFkPcd7eBwwuumozWPfKP8"}, {"content": "", "role": "assistant", "tool_calls": [{"function": {"arguments": "{\"path\":\"InventoryPartInStockBusinessObject.svc/InventoryPartInStockSet\",\"intent\":\"QUERY\"}", "name": "GetBusinessObjectInfo"}, "id": "call_hnfYlncaZsDusYNmISEOXOdQ", "type": "function"}]}, {"content": "\\{\"api_endpoint\":\"InventoryPartInStockBusinessObject.svc/InventoryPartInStockSet\",\"summary\":\"Use this API to work with the inventory part in stock business object copilot use cases\",\"description\":\"Inventory Part In Stock represents the physical stock records of inventory parts held at specific warehouse locations. Each record tracks a part's on-hand quantity, reserved quantity, in-transit quantity, and available quantity at a given site, warehouse, location, lot/batch, serial number, and handling unit combination. It provides visibility into stock levels, ownership, costs, and expiration details for inventory management and warehouse operations.\",\"key_predicate\":\"(Contract = {Contract} AND PartNo = {PartNo} AND ConfigurationId = {ConfigurationId} AND LocationNo = {LocationNo} AND LotBatchNo = {LotBatchNo} AND SerialNo = {SerialNo} AND EngChgLevel = {EngChgLevel} AND WaivDevRejNo = {WaivDevRejNo} AND ActivitySeq = {ActivitySeq} AND HandlingUnitId = {HandlingUnitId})\",\"available_attributes\":[{\" onfiguration identity of the part, used for configurable items. A value of '*' means a standard (non-configured) part.\\n         Synonyms: configuration, config ID\",\"data_type\":\"Text\",\"label\":\"Configuration Id\"},{\"name\":\"LocationNo\",\"description\":\"The inventory location number within the warehouse where the part is stored.\\n         Synonyms: location, bin location, stock location, storage location\",\"data_type\":\"Text\",\"label\":\"Location No\"},{\"name\":\"LotBatchNo\",\"description\":\"The lot or batch number assigned to the stocked part for traceability. A value of '*' means no lot/batch tracking.\\n         Synonyms: lot number, batch number, lot ID, batch ID\",\"data_type\":\"Text\",\"label\":\"Lot Batch No\"},{\"name\":\"SerialNo\",\"description\":\"The serial number of the individual part unit. A value of '*' means the part is not serial-tracked at this level.\\n         Synonyms: serial number, serial ID, unit serial, tracking number\",\"data_type\":\"Text\",\"label\":\"Serial No\"},{\"name\":\"EngChgLevel\",\"description\":\"The engineering change level (revision number) of the part in stock.\\n         Synonyms: revision, EC level, engineering revision, part revision\",\"data_type\":\"Text\",\"label\":\"EC\"},{\"name\":\"WaivDevRejNo\",\"description\":\"The Waive/Deviate/Reject number classifying the quality disposition of the stock record.\\n         Synonyms: W/D/R number, waiver number, deviation number, reject number, quality disposition\",\"data_type\":\"Text\",\"label\":\"W/D/R No\"},{\"name\":\"ActivitySeq\",\"description\":\"The project activity sequence number linking the stock to a project activity. A value of 0 means no project connection.\\n         Synonyms: activity sequence, project activity\",\"data_type\":\"Number\",\"label\":\"Activity Sequence\"},{\"name\":\"HandlingUnitId\",\"description\":\"The handling unit identifier the part is packed into. A value of 0 means the part is not in any handling unit.\\n         Synonyms: handling unit, HU ID, pallet ID, container ID\",\"data_type\":\"Number\",\"label\":\"Handling Unit ID\"},{\"name\":\"AvgUnitTransitCost\",\"description\":\"The average unit cost of the part while in transit.\\n         Synonyms: transit cost, average transit cost\",\"data_type\":\"Number\",\"label\":\"Avg Unit Transit Cost\"},{\"name\":\"CountVariance\",\"description\":\"The variance between the system quantity and the physically counted quantity from the last inventory count.\\n         Synonyms: count difference, variance, inventory variance, stock variance\",\"data_type\":\"Number\",\"label\":\"Count Variance\"},{\"name\":\"ExpirationDate\",\"description\":\"The expiration or shelf life date after which the part should not be used or sold.\\n         Synonyms: expiry date, best before date, shelf life date, use by date\",\"data_type\":\"Date\",\"label\":\"Expiration Date\"},{\"name\":\"FreezeFlag\",\"description\":\"Indicates whether the stock record is frozen for counting purposes, preventing transactions during physical inventory counts.\\n         Synonyms: frozen, freeze flag, count freeze, stock freeze, inventory freeze\",\"data_type\":\"IfsApp.InventoryPartInStockBusinessObject.InventoryPartFreezeCode\",\"enum\":[{\"client_value\":\"Frozen For Counting\",\"identifier\":\"FrozenForCounting\"},{\"client_value\":\"Not Frozen\",\"identifier\":\"NotFrozen\"}],\"label\":\"Freeze Flag\"},{\"name\":\"LastActivityDate\",\"description\":\"The date and time of the last inventory transaction activity on this stock record.\\n         Synonyms: last transaction date, last movement date, last activity\",\"data_type\":\"Timestamp\",\"label\":\"Last Activity Date\"},{\"name\":\"LastCountDate\",\"description\":\"The date when the stock of this inventory part at this location was last physically counted.\\n         Synonyms: last count, last cycle count date, latest count date\",\"data_type\":\"Date\",\"label\":\"Last Count Date\"},{\"name\":\"LocationType\",\"descript rce, origin\",\"data_type\":\"Text\",\"label\":\"Source\"},{\"name\":\"Warehouse\",\"description\":\"The warehouse where the inventory part is physically stored.\\n         Synonyms: warehouse ID, storage warehouse, WH\",\"data_type\":\"Text\",\"label\":\"Warehouse\"},{\"name\":\"BayNo\",\"description\":\"The bay identifier within the warehouse where the part is stored.\\n         Synonyms: bay, warehouse bay, bay ID\",\"data_type\":\"Text\",\"label\":\"Bay\"},{\"name\":\"RowNo\",\"description\":\"The row identifier within the warehouse bay where the part is stored.\\n         Synonyms: row, warehouse row, row ID\",\"data_type\":\"Text\",\"label\":\"Row\"},{\"name\":\"TierNo\",\"description\":\"The tier (shelf level) identifier within the warehouse bay where the part is stored.\\n         Synonyms: tier, shelf level, warehouse tier, tier ID\",\"data_type\":\"Text\",\"label\":\"Tier\"},{\"name\":\"BinNo\",\"description\":\"The bin identifier within the warehouse location where the part is stored.\\n         Synonyms: bin, warehouse bin, bin ID\",\"data_type\":\"Text\",\"label\":\"Bin\"},{\"name\":\"AvailabilityControlId\",\"description\":\"The availability control ID that determines whether the stock is available for inventory operations such as reservation, issue, picking, scrapping, etc.\\n         Synonyms: availability control, stock availability, availability status\",\"data_type\":\"Text\",\"label\":\"Availability Control Id\"},{\"name\":\"CreateDate\",\"description\":\"The date when this stock record was initially created in the system.\\n         Synonyms: creation date, created date, record creation date\",\"data_type\":\"Date\",\"label\":\"Create Date\"},{\"name\":\"RotablePartPoolId\",\"description\":\"The rotable part pool to which this stock belongs, used for rotable spare parts management.\\n         Synonyms: rotable pool, part pool\",\"data_type\":\"Text\",\"label\":\"Rotable Part Pool Id\"},{\"name\":\"ProjectId\",\"description\":\"The project connec ty into stock levels, ownership, costs, and expiration details for inventory management and warehouse operations.\", \"Synonyms\": [\"Stock Record\", \"Inventory Stock\", \"On Hand Inventory\", \"Warehouse Stock\", \"Part in Stock\", \"Stock Balance\", \"Inventory Balance\", \"Parts In Stock\"], \"IsBusinessObjectGranted\": true}, {\"BusinessObject\": \"Engineering Part Revision Structure\", \"Path\": \"EngineeringPartRevisionStructureBusinessObject.svc/EngPartRevisionSet\", \"Description\": \"The as-designed engineering definition of a product revision and its engineering bill-of-material (BOM). Holds the revision-controlled record of an ENGINEERING part (EngPartRevision), the engineering part master common to all revisions (EngPartMaster), and the consists-of engineering structure (EngPartStructure: components, quantities, positions).\\nAnswers questions about: engineering parts (engineering part number, class, responsible, acquisition/make-or-buy, planning method); engineering revisions (current released revision, revision status/lifecycle Preliminary/Active/Released/Obsolete, released/active/obsolete dates, engineering change order, development level, technical drawing); engineering structures (engineering BOM, what parts make up an assembly, component/child parts and their quantities and positions, where-used); engineering part costs and hours at the revision level (assumed, standard, work, material, and calculated cost, calculated/actual work hours, lead time); and the document requirements connected to a part revision (required document classes, categories, direction, and requirement profiles).\\nThis represents ENGINEERING (as-designed, PDM) parts ONLY. Do NOT use it for other part types or downstream data: inventory parts and stock balances (InventoryPart, InventoryPartInStock), MRP / material planning parts and supply-demand (MrpPart, MrpPartAction, MrpPartSupplyDemand), manufacturing product/configuration structures (ProductStructure, ConfigurationStructure), or shop-floor / manufacturing execution (ShopOrder). The cost and hour figures here are revision-level ENGINEERING estimates common to all sites; Do NOT use this BO for SITE-SPECIFIC costs (per-site standard/average/inventory-value costing, cost sets, cost buckets by site) - those live in the inventory / costing objects (e.g. InventoryPartCost, InvPartSiteCost) and are not represented here. It carries no on-hand balances, no supply/demand or planning figures, no site-specific cost, and no shop-floor status. Entry projection EngineeringPartRevisionStructureBusinessObject.\", \"Synonyms\": [\"engineering part\", \"engineering part revision\", \"engineering revision\", \"engineering BOM\", \"engineering bill of material\", \"engineering structure\", \"consists of\", \"engineering product structure\", \"part revision structure\", \"engineering part cost\", \"engineering document requirement\", \"required documents\"], \"IsBusinessObjectGranted\": true}, {\"BusinessObject\": \"Inventory Part\", \"Path\": \"InventoryPartBusinessObject.svc/InventoryPartSet\", \"Description\": \"Inventory Parts are stock-managed items registered at specific sites containing essential information for inventory management and warehousing. Each part is identified by its part number and site\", \"Synonyms\": [\"Stock Part\", \"Stock Item\", \"Inventory Item\", \"Stocked Part\", \"Warehouse Part\", \"Inventory Material\", \"SKU\", \"Stock Keeping Unit\", \"Warehouse Item\", \"Material Part\"], \"IsBusinessObjectGranted\": true}, {\"BusinessObject\": \"Mrp Part\", \"Path\": \"MrpPartBusinessObject.svc/MrpPartSet\", \"Description\": \"This is used to study information about an inventory part which is planned by Material Requirement Planning (MRP) or Project Material Requirement Planning (project MRP) or by Master Scheduling or Project Master Scheduling.\", \"Synonyms\": [\"MRP Part Details\", \"MRP Parameters\", \"MRP Planning Parameters\"], \"IsBusinessObjectGranted\": true}, {\"BusinessObject\": \"Purchase Order\", \"Path\": \"PurchaseOrderBusinessObject.svc/PurchaseOrderSet\", \"Description\": \"Purchase Orders are the orders raised for Suppliers which consist of Purchase order lines that carry registered parts, unregistered parts, rental parts, their quantity, prices and delivery information\", \"Synonyms\": [\"Purchase Commitment\", \"Buying Request\", \"Purchase\", \"Procurement Order\", \"PurchaseOrder\", \"PO\"], \"IsBusinessObjectGranted\": true}]", "name": "GetBusinessObject", "role": "tool", "tool_call_id": "call_W0HGuRIWB5y7mNhu5f7X9pzX"}, {"content": "", "role": "assistant", "tool_calls": [{"function": {"arguments": "{\"path\":\"InventoryPartInStockBusinessObject.svc/InventoryPartInStockSet\",\"intent\":\"QUERY\"}", "name": "GetBusinessObjectInfo"}, "id": "call_CD0QIDu7WRU0PamoqfEgAZ5z", "type": "function"}]}, {"content": "\\{\"api_endpoint\":\"InventoryPartInStockBusinessObject.svc/InventoryPartInStockSet\",\"summary\":\"Use this API to work with the inventory part in stock business object copilot use cases\",\"description\":\"Inventory Part In Stock represents the physical stock records of inventory parts held at specific warehouse locations. Each record tracks a part's on-hand quantity, reserved quantity, in-transit quantity, and available quantity at a given site, warehouse, location, lot/batch, serial number, and handling unit combination. It provides visibility into stock levels, ownership, costs, and expiration details for inventory management and warehouse operations.\",\"key_predicate\":\"(Contract = {Contract} AND PartNo = {PartNo} AND ConfigurationId = {ConfigurationId} AND LocationNo = {LocationNo} AND LotBatchNo = {LotBatchNo} AND SerialNo = {SerialNo} AND EngChgLevel = {EngChgLevel} AND WaivDevRejNo = {WaivDevRejNo} AND ActivitySeq = {ActivitySeq} AND HandlingUnitId = {HandlingUnitId})\",\"available_attributes\":[{\"name\":\"ETag\",\"data_type\":\"ETag\"},{\"name\":\"luname\",\"description\":\"The luname is: 'InventoryPartInStock'\",\"data_type\":\"Text\"},{\"name\":\"keyref\",\"data_type\":\"Text\"},{\"name\":\"Objgrants\",\"data_type\":\"Text\",\"label\":\"Granted access\"},{\"name\":\"Contract\",\"description\":\"The site (facility or plant) where the inventory part is stocked.\\n         Synonyms: site, plant, facility\",\"data_type\":\"Text\",\"label\":\"Site\"},{\"name\":\"PartNo\",\"description\":\"The unique identifier of the inventory part held in stock.\\n         Synonyms: part number, item number, material number, SKU\",\"data_type\":\"Text\",\"label\":\"Part No\"},{\"name\":\"ConfigurationId\",\"description\":\"The configuration identity of the part, used for configurable items. A value of '*' means a standard (non-configured) part.\\n         Synonyms: configuration, config ID\",\"data_type\":\"Text\",\"label\":\"Configuration Id\"},{\"name\":\"LocationNo\",\"description\":\"The inventory location number within the warehouse where the part is stored.\\n         Synonyms: location, bin location, stock location, storage location\",\"data_type\":\"Text\",\"label\":\"Location No\"},{\"name\":\"LotBatchNo\",\"description\":\"The lot or batch number assigned to the stocked part for traceability. A value of '*' means no lot/batch tracking.\\n         Synonyms: lot number, batch number, lot ID, batch ID\",\"data_type\":\"Text\",\"label\":\"Lot Batch No\"},{\"name\":\"SerialNo\",\"description\":\"The serial number of the individual part unit. A value of '*' means the part is not serial-tracked at this level.\\n         Synonyms: serial number, serial ID, unit serial, tracking number\",\"data_type\":\"Text\",\"label\":\"Serial No\"},{\"name\":\"EngChgLevel\",\"description\":\"The engineering change level (revision number) of the part in stock.\\n         Synonyms: revision, EC level, engineering revision, part revision\",\"data_type\":\"Text\",\"label\":\"EC\"},{\"name\":\"WaivDevRejNo\",\"description\":\"The Waive/Deviate/Reject number classifying the quality disposition of the stock record.\\n         Synonyms: W/D/R number, waiver number, deviation number, reject number, quality disposition\",\"data_type\":\"Text\",\"label\":\"W/D/R No\"},{\"name\":\"ActivitySeq\",\"description\":\"The project activity sequence number linking the stock to a project activity. A value of 0 means no project connection.\\n         Synonyms: activity sequence, project activity\",\"data_type\":\"Number\",\"label\":\"Activity Sequence\"},{\"name\":\"HandlingUnitId\",\"description\":\"The handling unit identifier the part is packed into. A value of 0 means the part is not in any handling unit.\\n         Synonyms: handling unit, HU ID, pallet ID, container ID\",\"data_type\":\"Number\",\"label\":\"Handling Unit ID\"},{\"name\":\"AvgUnitTransitCost\",\"description\":\"The average unit cost of the part while in transit.\\n         Synonyms: transit cost, average transit cost\",\"data_type\":\"Number\",\"label\":\"Avg Unit Transit Cost\"},{\"name\":\"CountVariance\",\"description\":\"The variance between the system quantity and the physically counted quantity from the last inventory count.\\n         Synonyms: count difference, variance, inventory variance, stock variance\",\"data_type\":\"Number\",\"label\":\"Count Variance\"},{\"name\":\"ExpirationDate\",\"description\":\"The expiration or shelf life date after which the part should not be used or sold.\\n         Synonyms: expiry date, best before date, shelf life date, use by date\",\"data_type\":\"Date\",\"label\":\"Expiration Date\"},{\"name\":\"FreezeFlag\",\"description\":\"Indicates whether the stock record is frozen for counting purposes, preventing transactions during physical inventory counts.\\n         Synonyms: frozen, freeze flag, count freeze, stock freeze, inventory freeze\",\"data_type\":\"IfsApp.InventoryPartInStockBusinessObject.InventoryPartFreezeCode\",\"enum\":[{\"client_value\":\"Frozen For Counting\",\"identifier\":\"FrozenForCounting\"},{\"client_value\":\"Not Frozen\",\"identifier\":\"NotFrozen\"}],\"label\":\"Freeze Flag\"},{\"name\":\"LastActivityDate\",\"description\":\"The date and time of the last inventory transaction activity on this stock record.\\n         Synonyms: last transaction date, last movement date, last activity\",\"data_type\":\"Timestamp\",\"label\":\"Last Activity Date\"},{\"name\":\"LastCountDate\",\"description\":\"The date when the stock of this inventory part at this location was last physically counted.\\n         Synonyms: last count, last cycle count date, latest count date\",\"data_type\":\"Date\",\"label\":\"Last Count Date\"},{\"name\":\"LocationType\",\"description\":\"The type of inventory location such as Picking, Floor Stock, Quality Assurance, Arrival, Shipment, or Production Line.\\n         Synonyms: location type, storage type\",\"data_type\":\"IfsApp.InventoryPartInStockBusinessObject.InventoryLocationType\",\"enum\":[{\"client_value\":\"Picking\",\"identifier\":\"Picking\"},{\"client_value\":\"Floor stock\",\"identifier\":\"FloorStock\"},{\"client_value\":\"Quality assurance\",\"identifier\":\"QualityAssurance\"},{\"client_value\":\"Shipment\",\"identifier\":\"Shipment\"},{\"client_value\":\"Production line\",\"identifier\":\"ProductionLine\"},{\"client_value\":\"Arrival\",\"identifier\":\"Arrival\"}],\"label\":\"Location Type\"},{\"name\":\"QtyInTransit\",\"description\":\"The quantity of the part currently in transit between locations or sites.\\n         Synonyms: in transit quantity, transit quantity, qty in transit\",\"data_type\":\"Number\",\"label\":\"Qty In Transit\"},{\"name\":\"QtyOnhand\",\"description\":\"The total on-hand quantity of the part at this specific stock record location in the inventory unit of measure.\\n         Synonyms: on hand quantity, stock quantity, quantity on hand, stock on hand, on hand qty\",\"data_type\":\"Number\",\"label\":\"Qty Onhand\"},{\"name\":\"QtyReserved\",\"description\":\"The quantity of the part that is reserved (allocated) for demand orders such as customer orders, shop orders, or distribution orders.\\n         Synonyms: reserved quantity, allocated quantity, committed quantity, qty reserved\",\"data_type\":\"Number\",\"label\":\"Qty Reserved\"},{\"name\":\"ReceiptDate\",\"description\":\"The date and time when the stock was received into this location.\\n         Synonyms: receipt date, goods receipt date, receiving date\",\"data_type\":\"Timestamp\",\"label\":\"Receipt Date\"},{\"name\":\"Source\",\"description\":\"The source or origin of the inventory transaction that created or last updated this stock record.\\n         Synonyms: transaction source, stock source, origin\",\"data_type\":\"Text\",\"label\":\"Source\"},{\"name\":\"Warehouse\",\"description\":\"The warehouse where the inventory part is physically stored.\\n         Synonyms: warehouse ID, storage warehouse, WH\",\"data_type\":\"Text\",\"label\":\"Warehouse\"},{\"name\":\"BayNo\",\"description\":\"The bay identifier within the warehouse where the part is stored.\\n         Synonyms: bay, warehouse bay, bay ID\",\"data_type\":\"Text\",\"label\":\"Bay\"},{\"name\":\"RowNo\",\"description\":\"The row identifier within the warehouse bay where the part is stored.\\n         Synonyms: row, warehouse row, row ID\",\"data_type\":\"Text\",\"label\":\"Row\"},{\"name\":\"TierNo\",\"description\":\"The tier (shelf level) identifier within the warehouse bay where the part is stored.\\n         Synonyms: tier, shelf level, warehouse tier, tier ID\",\"data_type\":\"Text\",\"label\":\"Tier\"},{\"name\":\"BinNo\",\"description\":\"The bin identifier within the warehouse location where the part is stored.\\n         Synonyms: bin, warehouse bin, bin ID\",\"data_type\":\"Text\",\"label\":\"Bin\"},{\"name\":\"AvailabilityControlId\",\"description\":\"The availability control ID that determines whether the stock is available for inventory operations such as reservation, issue, picking, scrapping, etc.\\n         Synonyms: availability control, stock availability, availability status\",\"data_type\":\"Text\",\"label\":\"Availability Control Id\"},{\"name\":\"CreateDate\",\"description\":\"The date when this stock record was initially created in the system.\\n         Synonyms: creation date, created date, record creation date\",\"data_type\":\"Date\",\"label\":\"Create Date\"},{\"name\":\"RotablePartPoolId\",\"description\":\"The rotable part pool to which this stock belongs, used for rotable spare parts management.\\n         Synonyms: rotable pool, part pool\",\"data_type\":\"Text\",\"label\":\"Rotable Part Pool Id\"},{\"name\":\"ProjectId\",\"description\":\"The project connected to this inventory stock record for project inventory tracking.\\n         Synonyms: project, project ID, project number\",\"data_type\":\"Text\",\"label\":\"Project ID\"},{\"name\":\"CatchQtyInTransit\",\"description\":\"The in-transit quantity in the catch unit of measure.\\n         Synonyms: catch quantity in transit, secondary UoM transit quantity\",\"data_type\":\"Number\",\"label\":\"Catch Qty in Transit\"},{\"name\":\"CatchQtyOnhand\",\"description\":\"The on-hand quantity in the catch unit of measure, used for parts that are tracked in a secondary unit of measure.\\n         Synonyms: catch quantity on hand, secondary UoM quantity\",\"data_type\":\"Number\",\"label\":\"Catch Qty Onhand\"},{\"name\":\"PartOwnership\",\"description\":\"The ownership type of the stock such as Company Owned, Customer Owned, Supplier Loaned, Consignment, or Company Rental Asset.\\n         Synonyms: ownership, stock ownership, part ownership, inventory ownership\",\"data_type\":\"IfsApp.InventoryPartInStockBusinessObject.PartOwnership\",\"enum\":[{\"client_value\":\"Company Owned\",\"identifier\":\"CompanyOwned\"},{\"client_value\":\"Consignment\",\"identifier\":\"Consignment\"},{\"client_value\":\"Customer Owned\",\"identifier\":\"CustomerOwned\"},{\"client_value\":\"Supplier Loaned\",\"identifier\":\"SupplierLoaned\"},{\"client_value\":\"Supplier Owned\",\"identifier\":\ ity rules and approval workflows. Manages dependencies between structure positions with mandatory and recommended enforcement levels. Integrates with engineering master and revision data, part catalogs, and product function definitions. Tracks life-limited parts and regulatory compliance requirements including ETOPS, RVSM, and Lower Minimums Programs. Enables separate template configuration for complex assemblies, modification-based position introductions and removals, and function assignments to structure positions. Provides comprehensive audit trail through journal entries tracking all template modifications throughout the template life-cycle.\", \"Synonyms\": [\"Template Structure\", \"Equipment Template\", \"Structure Template\", \"Part Structure Template\", \"Serial Template\"], \"IsBusinessObjectGranted\": true}, {\"BusinessObject\": \"Project Invoice\", \"Path\": \"ProjectInvoiceBusinessObject.svc/ProjectInvoiceItemSet\", \"Description\": \"Project invoice lines (items): invoiced revenue by customer, invoiced amount by project, sub-project, activity or report code, line tax breakdown, and lines for a given invoice or customer. OData entry: ProjectInvoiceBusinessObject. Line-grain companion to ProjectInvoice (header). Not for posting rows, e-invoice responses, tax assistants, or invoice create/copy wizards.\", \"Synonyms\": [\"project invoice line\", \"invoice item\", \"invoiced revenue\", \"invoiced amount by customer\", \"invoiced amount by project\", \"billed lines\", \"line tax breakdown\", \"tax per line\", \"invoice line detail\", \"project billing lines\", \"report code amount\", \"activity billing\", \"project invoice\", \"invoices due this month\", \"overdue invoices\", \"how many invoices\", \"groupby Company InvoiceId\"], \"IsBusinessObjectGranted\": true}, {\"BusinessObject\": \"Engineering Part Revision Structure\", \"Path\": \"EngineeringPartRevisionStructureBusinessObject.svc/EngPartRevisionSet\", \"Description\": \"The as-designed engineering definition of a product revision and its engineering bill-of-material (BOM). Holds the revision-controlled record of an ENGINEERING part (EngPartRevision), the engineering part master common to all revisions (EngPartMaster), and the consists-of engineering structure (EngPartStructure: components, quantities, positions).\\nAnswers questions about: engineering parts (engineering part number, class, responsible, acquisition/make-or-buy, planning method); engineering revisions (current released revision, revision status/lifecycle Preliminary/Active/Released/Obsolete, released/active/obsolete dates, engineering change order, development level, technical drawing); engineering structures (engineering BOM, what parts make up an assembly, component/child parts and their quantities and positions, where-used); engineering part costs and hours at the revision level (assumed, standard, work, material, and calculated cost, calculated/actual work hours, lead time); and the document requirements connected to a part revision (required document classes, categories, direction, and requirement profiles).\\nThis represents ENGINEERING (as-designed, PDM) parts ONLY. Do NOT use it for other part types or downstream data: inventory parts and stock balances (InventoryPart, InventoryPartInStock), MRP / material planning parts and supply-demand (MrpPart, MrpPartAction, MrpPartSupplyDemand), manufacturing product/configuration structures (ProductStructure, ConfigurationStructure), or shop-floor / manufacturing execution (ShopOrder). The cost and hour figures here are revision-level ENGINEERING estimates common to all sites; Do NOT use this BO for SITE-SPECIFIC costs (per-site standard/average/inventory-value costing, cost sets, cost buckets by site) - those live in the inventory / costing objects (e.g. InventoryPartCost, InvPartSiteCost) and are not represented here. It carries no on-hand balances, no supply/demand or planning figures, no site-specific cost, and no shop-floor status. Entry proj
