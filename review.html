,\"PartRev\",\"AssumedCost\"],\"$top\":1},\"$top\":1}", "name": "DoOdataCall"}, "id": "call_mEAO6atrqjuGpEtYnikgZ1SF", "type": "function"}]}, {"content": "[{\"value\": [{\"@odata.etag\": \"W/\\\"Vy8iQUFBUmJWQUNPQUFJMWdoQUFqOjIwMjYwNzE0MjA0MTAxIg==\\\"\", \"AssumedCost\": 150, \"PartNo\": \"IKS1\", \"PartRev\": \"SD\", \"keyref\": \"PART_NO=IKS1^PART_REV=SD^\"}]}, {\"total_count\": 1}]", "name": "DoOdataCall", "role": "tool", "tool_call_id": "call_mEAO6atrqjuGpEtYnikgZ1SF"}, {"content": "The assumed cost of engineering part IKS1, revision SD, is 150.\n\nDo you also want the other cost elements for this revision (standard, material, work, or calculated costs)?", "role": "assistant", "tool_calls": null}, {"content": "Golden dataset: good answer", "role": "user"}, {"content": "Got it, I’ll treat that as a good reference example.\n\nWould you like to continue with more cost-related questions for engineering parts, or switch to inventory/site-specific costs?", "role": "assistant", "tool_calls": null}, {"id": "e18dfb9d-b91b-4121-80af-047148ce1ab5"}], "state_count": 17, "token_usage": [{"tools": ["initial_request"], "prompt_tokens_used": 9659, "completion_tokens_used": 45, "tokens_used": 9704}], "token_compact": "initial_request 9704 (9659+45) · Σ9704"}, {"history_id": 10794, "conversation_id": "816f6cd7-7b04-44d0-a449-4cb2aa42de2b", "question": "Golden dataset: good answer", "answer_text": "Understood, thanks for letting me know.  \n\nIs there another engineering part or revision you’d like to check for connected technical documents?", "answer": {"answer": "Understood, thanks for letting me know.  \n\nIs there another engineering part or revision you’d like to check for connected technical documents?", "data_points": [], "debugInfo": {"token_usage": [{"tools": ["initial_request"], "prompt_tokens_used": 9978, "completion_tokens_used": 37, "tokens_used": 10015}]}}, "active_route": null, "received_at": "2026-08-17T13:19:35", "state_object": [{"content": "Are there technical documents connected to engineering part IKS1 ? What are they ?", "role": "user"}, {"content": "", "role": "assistant", "tool_calls": [{"function": {"arguments": "{\"business_object_name\":\"engineering part documents\"}", "name": "GetBusinessObject"}, "id": "call_eptnSmq2aGq7D0HG7JzfGd2X", "type": "function"}]}, {"content": "[{\"BusinessObject\": \"Engineering Part Revision Structure\", \"Path\": \"EngineeringPartRevisionStructureBusinessObject.svc/EngPartRevisionSet\", \"Description\": \"The as-designed engineering definition of a product revision and its engineering bill-of-material (BOM). Holds the revision-controlled record of an ENGINEERING part (EngPartRevision), the engineering part master common to all revisions (EngPartMaster), and the consists-of engineering structure (EngPartStructure: components, quantities, positions).\\nAnswers questions about: engineering parts (engineering part number, class, responsible, acquisition/make-or-buy, planning method); engineering revisions (current released revision, revision status/lifecycle Preliminary/Active/Released/Obsolete, released/active/obsolete dates, engineering change order, development level, technical drawing); engineering structures (engineering BOM, what parts make up an assembly, component/child parts and their quantities and positions, where-used); engineering part costs and hours at the revision level (assumed, standard, work, material, and calculated cost, calculated/actual work hours, lead time); and the document requirements connected to a part revision (required document classes, categories, direction, and requirement profiles).\\nThis represents ENGINEERING (as-designed, PDM) parts ONLY. Do NOT use it for other part types or downstream data: inventory parts and stock balances (InventoryPart, InventoryPartInStock), MRP / material planning parts and supply-demand (MrpPart, MrpPartAction, MrpPartSupplyDemand), manufacturing product/configuration structures (ProductStructure, ConfigurationStructure), or shop-floor / manufacturing execution (ShopOrder). The cost and hour figures here are revision-level ENGINEERING estimates common to all sites; Do NOT use this BO for SITE-SPECIFIC costs (per-site standard/average/inventory-value costing, cost sets, cost buckets by site) - those live in the inventory / costing objects (e.g. InventoryPartCost, InvPartSiteCost) and are not represented here. It carries no on-hand balances, no supply/demand or planning figures, no site-specific cost, and no shop-floor status. Entry projection EngineeringPartRevisionStructureBusinessObject.\", \"Synonyms\": [\"engineering part\", \"engineering part revision\", \"engineering revision\", \"engineering BOM\", \"engineering bill of material\", \"engineering structure\", \"consists of\", \"engineering product structure\", \"part revision structure\", \"engineering part cost\", \"engineering document requirement\", \"required documents\"], \"IsBusinessObjectGranted\": true}, {\"BusinessObject\": \"Maintenance Program\", \"Path\": \"MaintenanceProgramBusinessObject.svc/MaintProgramSet\", \"Description\": \"Business object for defining and managing maintenance programs in Fleet and Asset Management. Represents maintenance programs with revisions that define scheduled maintenance requirements for engineering parts. Includes assigned parts and part revisions that are in scope for maintenance, maintenance groups that define part-specific maintenance requirements with average value rules and preferred groupings, and affected serials assigned to the program. Integrates with engineering part master and revision data, manufacturer information, and Part Serial Catalog for serial identity and operational attributes. Tracks access control through access groups, and maintains a journal of changes and events throughout the maintenance program life-cycle. Links to vehicle serial registration data for affected serials.\", \"Synonyms\": [\"Maintenance Program\", \"Maint Program\", \"Maint Prog\", \"Define Maintenance Program\", \"FAM Maintenance Program\"], \"IsBusinessObjectGranted\": true}, {\"BusinessObject\": \"Mrp Part\", \"Path\": \"MrpPartBusinessObject.svc/MrpPartSet\", \"Description\": \"This is used to study information about an inventory part which is planned by Material Requirement Planning (MRP) or Project Material Requirement Planning (project MRP) or by Master Scheduling or Project Master Scheduling.\", \"Synonyms\": [\"MRP Part Details\", \"MRP Parameters\", \"MRP Planning Parameters\"], \"IsBusinessObjectGranted\": true}, {\"BusinessObject\": \"Inventory Part\", \"Path\": \"InventoryPartBusinessObject.svc/InventoryPartSet\", \"Description\": \"Inventory Parts are stock-managed items registered at specific sites containing essential information for inventory management and warehousing. Each part is identified by its part number and site\", \"Synonyms\": [\"Stock Part\", \"Stock Item\", \"Inventory Item\", \"Stocked Part\", \"Warehouse Part\", \"Inventory Material\", \"SKU\", \"Stock Keeping Unit\", \"Warehouse Item\", \"Material Part\"], \"IsBusinessObjectGranted\": true}, {\"BusinessObject\": \"Serial Structure Template\", \"Path\": \"SerialStructureTemplateBusinessObject.svc/SerialStructureTemplateSet\", \"Description\": \"Business object for managing Serial Structure Templates in Fleet and Asset Management. Defines standard, reusable hierarchical part structures that serve as blueprints for building actual serial structures. Organizes engineering parts in parent-child relationships with configurable structure positions, catalog references, and minimum configuration requirements. Supports template-level and position-level alternates with interchangeability rules and approval workflows. Manages dependencies between structure positions with mandatory and recommended enforcement levels. Integrates with engineering master and revision data, part catalogs, and product function definitions. Tracks life-limited parts and regulatory compliance requirements including ETOPS, RVSM, and Lower Minimums Programs. Enables separate template configuration for complex assemblies, modification-based position introductions and removals, and function assignments to structure positions. Provides comprehensive audit trail through journal entries tracking all template modifications throughout the template life-cycle.\", \"Synonyms\": [\"Template Structure\", \"Equipment Template\", \"Structure Template\", \"Part Structure Template\", \"Serial Template\"], \"IsBusinessObjectGranted\": true}]", "name": "GetBusinessObject", "role": "tool", "tool_call_id": "call_eptnSmq2aGq7D0HG7JzfGd2X"}, {"content": "", "role": "assistant", "tool_calls": [{"function": {"arguments": "{\"path\":\"EngineeringPartRevisionStructureBusinessObject.svc/EngPartRevisionSet\",\"intent\":\"LOOKUP\"}", "name": "GetBusinessObjectInfo"}, "id": "call_A8RMiDsCbSy1KrDv57QE24hz", "type": "function"}]}, {"content": "\\{\"api_endpoint\":\"EngineeringPartRevisionStructureBusinessObject.svc/EngPartRevisionSet\",\"summary\":\"Entry point for the as-designed ENGINEERING part revision, its engineering part master, engineering bill-of-material (consists-of structure), revision-level costs and hours, and the connected document requirements. Answers questions about engineering parts (part number, class, responsible, acquisition, provide/make-or-buy, planning method, UoM, tracking, technical class), engineering revisions (current released revision, revision status/lifecycle, released/active/obsolete dates, engineering change order, technical drawing), engineering structures (engineering BOM, what parts make up an assembly, component parts, quantities and positions), engineering part costs and hours (assumed/standard/work/material and calculated cost, work hours, lead time), and the document requirements of a part revision (required document classes, categories, direction, profiles). These engineering-part (master) attributes live on EngPartMaster and are returned by expanding PartNoRef on EngPartRevisionSet, not as columns of EngPartRevisionSet. Covers ENGINEERING (design intent / PDM) parts only; not inventory parts or stock balances (InventoryPart, InventoryPartInStock), MRP / planning parts (MrpPart, MrpPartAction, MrpPartSupplyDemand), manufacturing product/configuration structures (ProductStructure, ConfigurationStructure), or shop-floor execution (ShopOrder).\",\"description\":\"The as-designed engineering definition of a product revision and its engineering bill-of-material (BOM). Holds the revision-controlled record of an ENGINEERING part (EngPartRevision), the engineering part master common to all revisions (EngPartMaster), and the consists-of engineering structure (EngPartStructure: components, quantities, positions).\\nAnswers questions about: engineering parts (engineering part number, class, responsible, provide, project doc req profile, acquisition/make-or-buy, planning method); engineering revisions (current released revision, revision status/lifecycle Preliminary/Active/Released/Obsolete, released/active/obsolete dates, engineering change order, development level, technical drawing); engineering structures (engineering BOM, what parts make up an assembly, component/child parts and their quantities and positions, where-used); engineering part costs and hours at the revision level (assumed, standard, work, material, and calculated cost, calculated/actual work hours, lead time); and the document requirements connected to a part revision (required document classes, categories, direction, and requirement profiles).\\nThis represents ENGINEERING (as-designed, PDM) parts ONLY. Do NOT use it for other part types or downstream data: inventory parts and stock balances (InventoryPart, InventoryPartInStock), MRP / material planning parts and supply-demand (MrpPart, MrpPartAction, MrpPartSupplyDemand), manufacturing product/configuration structures (ProductStructure, ConfigurationStructure), or shop-floor / manufacturing execution (ShopOrder). The cost and hour figures here are revision-level ENGINEERING estimates common to all sites; Do NOT use this BO for SITE-SPECIFIC costs (per-site standard/average/inventory-value costing, cost sets, cost buckets by site) - those live in the inventory / costing objects (e.g. InventoryPartCost, InvPartSiteCost) and are not represented here. It carries no on-hand balances, no supply/demand or planning figures, no site-specific cost, and no shop-floor status. Entry projection EngineeringPartRevisionStructureBusinessObject.\\nIf a request contains only an Engineering Part Number and no revision is specified, use the current revision of the engineering part and explicitly indicate which revision was used, unless the user requests a specific revision. This governs only which revision to select, not which fields to return - still expand references (e.g. PartNoRef for any part-master attribute: part class, responsible, acquisition, provide, document requirement profile or planning method) when needed to answer the question.\",\"key_predicate\":\"(PartNo = {PartNo} AND PartRev = {PartRev})\",\"available_attributes\":[{\"name\":\"ETag\",\"data_type\":\"ETag\"},{\"name\":\"luname\",\"description\":\"The luname is: 'EngPartRevision'\",\"data_type\":\"Text\"},{\"name\":\"keyref\",\"data_type\":\"Text\"},{\"name\":\"Objgrants\",\"data_type\":\"Text\",\"label\":\"Granted access\"},{\"name\":\"PartNo\",\"description\":\"Engineering part number this revision belongs to. Synonyms: part number, engineering part no, part no.\",\"data_type\":\"Text\",\"label\":\"Part Number\"},{\"name\":\"PartRev\",\"description\":\"Engineering revision identifier of the part. Synonyms: revision, eng rev, part revision, revision id, engineering part revision, engineering revision.\",\"data_type\":\"Text\",\"label\":\"Part Revision\"},{\"name\":\"RevNo\",\"description\":\"Sequential revision number of the part revision. Synonyms: revision number, rev no.\",\"data_type\":\"Number\",\"label\":\"Rev No\"},{\"name\":\"EcoNo\",\"description\":\"Engineering change order number that introduced or governs this revision. Synonyms: CO No, change order, ECO, engineering change order.\",\"data_type\":\"Text\",\"label\":\"Eco No\"},{\"name\":\"ObsoleteDt\",\"description\":\"Date the revision was made obsolete. Synonyms: obsoleted date, obsolete date.\",\"data_type\":\"Date\",\"label\":\"Obsolete Dt\"},{\"name\":\"ReleasedDt\",\"description\":\"Date the revision was released. Synonyms: released date, release date.\",\"data_type\":\"Date\",\"label\":\"Released Dt\"},{\"name\":\"StrActiveDt\",\"description\":\"Date the revision structure became active. Synonyms: activated date, active date.\",\"data_type\":\"Date\",\"label\":\"Str Active Dt\"},{\"name\":\"DevelopLev\",\"description\":\"Development level (maturity) of the revision. Synonyms: development level, dev level, maturity level.\",\"data_type\":\"Text\",\"label\":\"Develop Lev\"},{\"name\":\"Info1\",\"description\":\"Free-text note on the revision. Synonyms: note, remark, comment.\",\"data_type\":\"Text\",\"label\":\"Info\"},{\"name\":\"AssumedLeadTime\",\"description\":\"Assumed (estimated) lead time for the part revision. Synonyms: assumed lead time, estimated lead time.\",\"data_type\":\"Number\",\"label\":\"Assumed Lead Time\"},{\"name\":\"AssumedCost\",\"description\":\"Assumed (estimated) cost of the part revision. Synonyms: assumed cost, estimated cost.\",\"data_type\":\"Number\",\"label\":\"Assumed Cost\"},{\"name\":\"LeadTime\",\"description\":\"Actual lead time for the part revision. Synonyms: actual lead time, lead time.\",\"data_type\":\"Number\",\"label\":\"Lead Time\"},{\"name\":\"StdCost\",\"description\":\"Standard cost of the part revision. Synonyms: standard cost, std cost.\",\"data_type\":\"Number\",\"label\":\"Std Cost\"},{\"name\":\"WorkCost\",\"description\":\"Work (labor) cost of the part revision. Synonyms: work cost, labor cost.\",\"data_type\":\"Number\",\"label\":\"Work Cost\"},{\"name\":\"CalcCo JDH68A", "type": "function"}]}, {"content": "[{\"BusinessObject\": \"Engineering Part Revision Structure\", \"Path\": \"EngineeringPartRevisionStructureBusinessObject.svc/EngPartRevisionSet\", \"Description\": \"The as-designed engineering definition of a product revision and its engineering bill-of-material (BOM). Holds the revision-controlled record of an ENGINEERING part (EngPartRevision), the engineering part master common to all revisions (EngPartMaster), and the consists-of engineering structure (EngPartStructure: components, quantities, positions).\\nAnswers questions about: engineering parts (engineering part number, class, responsible, acquisition/make-or-buy, planning method); engineering revisions (current released revision, revision status/lifecycle Preliminary/Active/Released/Obsolete, released/active/obsolete dates, engineering change order, development level, technical drawing); engineering structures (engineering BOM, what parts make up an assembly, component/child parts and their quantities and positions, where-used); engineering part costs and hours at the revision level (assumed, standard, work, material, and calculated cost, calculated/actual work hours, lead time); and the document requirements connected to a part revision (required document classes, categories, direction, and requirement profiles).\\nThis represents ENGINEERING (as-designed, PDM) parts ONLY. Do NOT use it for other part types or downstream data: inventory parts and stock balances (InventoryPart, InventoryPartInStock), MRP / material planning parts and supply-demand (MrpPart, MrpPartAction, MrpPartSupplyDemand), manufacturing product/configuration structures (ProductStructure, ConfigurationStructure), or shop-floor / manufacturing execution (ShopOrder). The cost and hour figures here are revision-level ENGINEERING estimates common to all sites; Do NOT use this BO for SITE-SPECIFIC costs (per-site standard/average/inventory-value costing, cost sets, cost buckets by site) - those live in the inventory / costing objects (e.g. InventoryPartCost, InvPartSiteCost) and are not represented here. It carries no on-hand balances, no supply/demand or planning figures, no site-specific cost, and no shop-floor status. Entry projection EngineeringPartRevisionStructureBusinessObject.\", \"Synonyms\": [\"engineering part\", \"engineering part revision\", \"engineering revision\", \"engineering BOM\", \"engineering bill of material\", \"engineering structure\", \"consists of\", \"engineering product structure\", \"part revision structure\", \"engineering part cost\", \"engineering document requirement\", \"required documents\"], \"IsBusinessObjectGranted\": true}, {\"BusinessObject\": \"Inventory Part\", \"Path\": \"InventoryPartBusinessObject.svc/InventoryPartSet\", \"Description\": \"Inventory Parts are stock-managed items registered at specific sites containing essential information for inventory management and warehousing. Each part is identified by its part number and site\", \"Synonyms\": [\"Stock Part\", \"Stock Item\", \"Inventory Item\", \"Stocked Part\", \"Warehouse Part\", \"Inventory Material\", \"SKU\", \"Stock Keeping Unit\", \"Warehouse Item\", \"Material Part\"], \"IsBusinessObjectGranted\": true}, {\"BusinessObject\": \"Maintenance Program\", \"Path\": \"MaintenanceProgramBusinessObject.svc/MaintProgramSet\", \"Description\": \"Business object for defining and managing maintenance programs in Fleet and Asset Management. Represents maintenance programs with revisions that define scheduled maintenance requirements for engineering parts. Includes assigned parts and part revisions that are in scope for maintenance, maintenance groups that define part-specific maintenance requirements with average value rules and preferred groupings, and affected serials assigned to the program. Integrates with engineering part master and revision data, manufacturer information, and Part Serial Catalog for serial identity and operational attributes. Tracks access control through access groups, and maintains a journal of changes and events throughout the maintenance program life-cycle. Links to vehicle serial registration data for affected serials.\", \"Synonyms\": [\"Maintenance Program\", \"Maint Program\", \"Maint Prog\", \"Define Maintenance Program\", \"FAM Maintenance Program\"], \"IsBusinessObjectGranted\": true}, {\"BusinessObject\": \"Mrp Part\", \"Path\": \"MrpPartBusinessObject.svc/MrpPartSet\", \"Description\": \"This is used to study information about an inventory part which is planned by Material Requirement Planning (MRP) or Project Material Requirement Planning (project MRP) or by Master Scheduling or Project Master Scheduling.\", \"Synonyms\": [\"MRP Part Details\", \"MRP Parameters\", \"MRP Planning Parameters\"], \"IsBusinessObjectGranted\": true}, {\"BusinessObject\": \"Serial Structure Template\", \"Path\": \"SerialStructureTemplateBusinessObject.svc/SerialStructureTemplateSet\", \"Description\": \"Business object for managing Serial Structure Templates in Fleet and Asset Management. Defines standard, reusable hierarchical part structures that serve as blueprints for building actual serial structures. Organizes engineering parts in parent-child relationships with configurable structure positions, catalog references, and minimum configuration requirements. Supports template-level and position-level alternates with interchangeability rules and approval workflows. Manages dependencies between structure positions with mandatory and recommended enforcement levels. Integrates with engineering master and revision data, part catalogs, and product function definitions. Tracks life-limited parts and regulatory compliance requirements including ETOPS, RVSM, and Lower Minimums Programs. Enables separate template configuration for complex assemblies, modification-based position introductions and removals, and function assignments to structure positions. Provides comprehensive audit trail through journal entries tracking all template modifications throughout the template life-cycle.\", \"Synonyms\": [\"Template Structure\", \"Equipment Template\", \"Structure Template\", \"Part Structure Template\", \"Serial Template\"], \"IsBusinessObjectGranted\": true}]", "name": "GetBusinessObject", "role": "tool", "tool_call_id": "call_TVRldgPgwwHjILOzOGJDH68A"}, {"content": "", "role": "assistant", "tool_calls": [{"function": {"arguments": "{\"path\":\"EngineeringPartRevisionStructureBusinessObject.svc/EngPartRevisionSet\",\"intent\":\"LOOKUP\"}", "name": "GetBusinessObjectInfo"}, "id": "call_HtSzU5YXGEXvgcAs9RTNrqTF", "type": "function"}]}, {"content": "\\{\"api_endpoint\":\"EngineeringPartRevisionStructureBusinessObject.svc/EngPartRevisionSet\",\"summary\":\"Entry point for the as-designed ENGINEERING part revision, its engineering part master, engineering bill-of-material (consists-of structure), revision-level costs and hours, and the connected document requirements. Answers questions about engineering parts (part number, class, responsible, acquisition, provide/make-or-buy, planning method, UoM, tracking, technical class), engineering revisions (current released revision, revision status/lifecycle, released/active/obsolete dates, engineering change order, technical drawing), engineering structures (engineering BOM, what parts make up an assembly, component parts, quantities and positions), engineering part costs and hours (assumed/standard/work/material and calculated cost, work hours, lead time), and the document requirements of a part revision (required document classes, categories, direction, profiles). These engineering-part (master) attributes live on EngPartMaster and are returned by expanding PartNoRef on EngPartRevisionSet, not as columns of EngPartRevisionSet. Covers ENGINEERING (design intent / PDM) parts only; not inventory parts or stock balances (InventoryPart, InventoryPartInStock), MRP / planning parts (MrpPart, MrpPartAction, MrpPartSupplyDemand), manufacturing product/configuration structures (ProductStructure, ConfigurationStructure), or shop-floor execution (ShopOrder).\",\"description\":\"The as-designed engineering definition of a product revision and its engineering bill-of-material (BOM). Holds the revision-controlled record of an ENGINEERING part (EngPartRevision), the engineering part master common to all revisions (EngPartMaster), and the consists-of engineering structure (EngPartStructure: components, quantities, positions).\\nAnswers questions about: engineering parts (engineering part number, class, responsible, provide, project doc req profile, acquisition/make-or-buy, planning method); engineering revisions (current released revision, revision status/lifecycle Preliminary/Active/Released/Obsolete, released/active/obsolete dates, engineering change order, development level, technical drawing); engineering structures (engineering BOM, what parts make up an assembly, component/child parts and their quantities and positions, where-used); engineering part costs and hours at the revision level (assumed, standard, work, material, and calculated cost, calculated/actual work hours, lead time); and the document requirements connected to a part revision (required document classes, categories, direction, and requirement profiles).\\nThis represents ENGINEERING (as-designed, PDM) parts ONLY. Do NOT use it for other part types or downstream data: inventory parts and stock balances (InventoryPart, InventoryPartInStock), MRP / material planning parts and supply-demand (MrpPart, MrpPartAction, MrpPartSupplyDemand), manufacturing product/configuration structures (ProductStructure, ConfigurationStructure), or shop-floor / manufacturing execution (ShopOrder). The cost and hour figures here are revision-level ENGINEERING estimates common to all sites; Do NOT use this BO for SITE-SPECIFIC costs (per-site standard/average/inventory-value costing, cost sets, cost buckets by site) - those live in the inventory / costing objects (e.g. InventoryPartCost, InvPartSiteCost) and are not represented here. It carries no on-hand balances, no supply/demand or planning figures, no site-specific cost, and no shop-floor status. Entry projection EngineeringPartRevisionStructureBusinessObject.\\nIf a request contains only an Engineering Part Number and no revision is specified, use the current revision of the engineering part and explicitly indicate which revision was used, unless the user requests a specific revision. This governs only which revision to select, not which fields to return - still expand references (e.g. PartNoRef for any part-master attribute: part class, responsible, acquisition, provide, document requirement profile or planning method) when needed to answer the question.\",\"key_predicate\":\"(PartNo = {PartNo} AND PartRev = {PartRev})\",\"available_attributes\":[{\"name\":\"ETag\",\"data_type\":\"ETag\"},{\"name\":\"luname\",\"description\":\"The luname is: 'EngPartRevision'\",\"data_type\":\"Text\"},{\"name\":\"keyref\",\"data_type\":\"Text\"},{\"name\":\"Objgrants\",\"data_type\":\"Text\",\"label\":\"Granted access\"},{\"name\":\"PartNo\",\"description\":\"Engineering part number this revision belongs to. Synonyms: part number, engineering part no, part no.\",\"data_type\":\"Text\",\"label\":\"Part Number\"},{\"name\":\"PartRev\",\"description\":\"Engineering revision identifier of the part. Synonyms: revision, eng rev, part revision, revision id, engineering part revision, engineering revision.\",\"data_type\":\"Text\",\"label\":\"Part Revision\"},{\"name\":\"RevNo\",\"description\":\"Sequential revision number of the part revision. Synonyms: revision number, rev no.\",\"data_type\":\"Number\",\"label\":\"Rev No\"},{\"name\":\"EcoNo\",\"description\":\"Engineering change order number that introduced or governs this revision. Synonyms: CO No, change order, ECO, engineering change order.\",\"data_type\":\"Text\",\"label\":\"Eco No\"},{\"name\":\"ObsoleteDt\",\"description\":\"Date the revision was made obsolete. Synonyms: obsoleted date, obsolete date.\",\"data_type\":\"Date\",\"label\":\"Obsolete Dt\"},{\"name\":\"ReleasedDt\",\"description\":\"Date the revision was released. Synonyms: released date, release date.\",\"data_type\":\"Date\",\"label\":\"Released Dt\"},{\"name\":\"StrActiveDt\",\"description\":\"Date the revision structure became active. Synonyms: activated date, active date.\",\"data_type\":\"Date\",\"label\":\"Str Active Dt\"},{\"name\":\"DevelopLev\",\"description\":\"Development level (maturity) of the revision. Synonyms: development level, dev level, maturity level.\",\"data_type\":\"Text\",\"label\":\"Develop Lev\"},{\"name\":\"Info1\",\"description\":\"Free-text note on the revision. Synonyms: note, remark, comment.\",\"data_type\":\"Text\",\"label\":\"Info\"},{\"name\":\"AssumedLeadTime\",\"description\":\"Assumed (estimated) lead time for the part revision. Synonyms: assumed lead time, estimated lead time.\",\"data_type\":\"Number\",\"label\":\"Assumed Lead Time\"},{\"name\":\"AssumedCost\",\"description\":\"Assumed (estimated) cost of the part revision. Synonyms: assumed cost, estimated cost.\",\"data_type\":\"Number\",\"label\":\"Assumed Cost\"},{\"name\":\"LeadTime\",\"description\":\"Actual lead time for the part revision. Synonyms: actual lead time, lead time.\",\"data_type\":\"Number\",\"label\":\"Lead Time\"},{\"name\":\"StdCost\",\"description\":\"Standard cost of the part revision. Synonyms: standard cost, std cost.\",\"data_type\":\"Number\",\"label\":\"Std Cost\"},{\"name\":\"WorkCost\",\"description\":\"Work (labor) cost of the part revision. Synonyms: work cost, labor cost.\",\"data_type\":\"Number\",\"label\":\"Work Cost\"},{\"name\":\"CalcCost\",\"description\":\"Calculated material cost of the revision. Synonyms: calculated cost, calc cost, calculated material cost.\",\"data_type\":\"Number\",\"label\":\"Calc Cost\"},{\"name\":\"CalcWork\",\"description\":\"Calculated work (labor) cost of the revision. Synonyms: calculated work cost, calc work cost.\",\"data_type\":\"Number\",\"label\":\"Calc Work\"},{\"name\":\"DtCre\",\"description\":\"Timestamp when the part revision was created. Synonyms: created, created date, creation date.\",\"data_type\":\"Timestamp\",\"label\":\"Date Created\"},{\"name\":\"UserCreated\",\"description\":\"User who created the part revision. Synonyms: created by, creator, created by user.\",\"data_type\":\"Text\",\"label\":\"User Created\"},{\"name\":\"DtChg\",\"description\":\"Timestamp when the part revision was last modified. Synonyms: modified, modified date, last changed, change date.\",\"data_type\":\"Timestamp\",\"label\":\"Date Chg\"},{\"name\":\"UserSign\",\"description\":\"User who last modified the part revision. Synonyms: modified by, changed by, last modified by.\",\"data_type\":\"Text\",\"label\":\"User Sign\"},{\"name\":\"MaterialCost\",\"description\":\"Material cost of the part revision. Synonyms: material cost.\",\"data_type\":\"Number\",\"label\":\"Material Cost\"},{\"name\":\"WorkHour\",\"description\":\"Work hours for the part revision. Synonyms: work hours, labor hours.\",\"data_type\":\"Number\",\"label\":\"Work Hour\"},{\"name\":\"CalcHour\",\"description\":\"Calculated work hours for the revision. Synonyms: calculated work hours, calc hours.\",\"data_type\":\"Number\",\"label\":\"Calc Hour\"},{\"name\":\"TransferredToManuf\",\"description\":\"Date the part revision was transferred to manufacturing. Synonyms: transferred to manufacturing, transfer to manufacturing date, manufacturing transfer.\",\"data_type\":\"Date\",\"label\":\"Transferred To Manuf\"},{\"name\":\"TechnicalDrawingNo\",\"description\":\"Technical drawing number linked to the revision. Synonyms: drawing no, drawing number, technical drawing no.\",\"data_type\":\"Text\",\"label\":\"Technical Drawing No\"},{\"name\":\"TechDrawingRevisionNo\",\"description\":\"Technical drawing revision number. Synonyms: drawing revision, drawing rev no, technical drawing revision no.\",\"data_type\":\"Text\",\"label\":\"Tech Drawing Revision No\"},{\"name\":\"Objstate\",\"description\":\"Life cycle status of the part revision. Values: Preliminary, Active, Released, Obsolete. Synonyms: status, state, revision status, lifecycle state.\",\"data_type\":\"IfsApp.EngineeringPartRevisionStructureBusinessObject.EngPartRevisionState\",\"enum\":[{\"client_value\":\"Preliminary\",\"identifier\":\"Preliminary\"},{\"client_value\":\"Active\",\"identifier\":\"Active\"},{\"client_value\":\"Released\",\"identifier\":\"Released\"},{\"client_value\":\"Obsolete\",\"identifier\":\"Obsolete\"}],\"label\":\"State\"},{\"name\":\"LuName\",\"description\":\"Logical unit name of the part revision, derived for object connection joins (always 'EngPartRevision'). Used to link document requirements to this revision. Synonyms: logical unit, lu, object type.\",\"data_type\":\"Text\",\"label\":\"LU Name\"},{\"name\":\"KeyRef\",\"description\":\"Key reference string identifying this part revision (PART_NO/PART_REV) for object connection joins. Used to link document requirements to this revision. Synonyms: key reference, object key, record key.\",\"data_type\":\"Text\",\"label\":\"Key Ref\"},{\"name\":\"Description\",\"description\":\"Engineering part description taken from the part catalog in the database (base) language. Synonyms: part description, engineering part description, description.\",\"data_type\":\"Text\",\"label\":\"Engineering Part Description\"},{\"name\":\"StdName\",\"description\":\"Standard name of the engineering part. Synonyms: standard name, std name.\",\"data_type\":\"Text\",\"label\":\"Standard Name\"}],\"expandable_options\":[{\"attribute\":\"PartNoRef\",\"description\":\"Engineering part master common to all revisions. $expand=PartNoRef. CAN BE USE in $expand like $expand=PartNoRef\"},{\"attribute\":\"EcoNoRef\",\"description\":\"Engineering change order governing the revision. $expand=EcoNoRef. CAN BE USE in $expand like $expand=EcoNoRef\"},{\"attribute\":\"DevelopLevRef\",\"description\":\"Development level lookup. $expand=DevelopLevRef. CAN BE USE in $expand like $expand=DevelopLevRef\"},{\"attribute\":\"TechDrawingRevisionNoRef\",\"description\":\"Technical drawing revision lookup. $expand=TechDrawingRevisionNoRef. CAN BE USE in $expand like $expand=TechDrawingRevisionNoRef\"}],\"non_expandable\":[{\"nav_path\":\"EngineeringPartRevisionStructureBusinessObject.svc/EngPartRevisionSet(PartNo={PartNo},PartRev={PartRev})/EngPartStructureArray\",\"navigation_attributes\":[{\"name\":\"ETag\",\"data_type\":\"ETag\"},{\"name\":\"luname\",\"data_type\":\"Text\"},{\"name\":\"keyref\",\"data_type\":\"Text\"},{\"name\":\"Objgrants\",\"data_type\":\"Text\",\"label\":\"Granted access\"},{\"name\":\"PartNo\",\"description\":\"Parent engineering part number of this structure line. Synonyms: parent part, assembly part.\",\"data_type\":\"Text\",\"label\":\"Part Number\"},{\"name\":\"PartRev\",\"description\":\"Parent engineering part revision of this structure line. Synonyms: parent revision, assembly revision.\",\"data_type\":\"Text\",\"label\":\"Part Revision\"},{\"name\":\"SubPartNo\",\"description\":\"Component (child) engineering part number used in the parent. Synonyms: component part, child part, sub part, material part, subassembly.\",\"data_type\":\"Text\",\"label\":\"Sub Part Number\"},{\"name\":\"SubPartRev\",\"description\":\"Component (child) engineering part revision. Synonyms: component revision, child revision, sub part revision, subassembly revision.\",\"data_type\":\"Text\",\"label\":\"Sub Part Revision\"},{\"name\":\"StructureId\",\"data_type\":\"Text\",\"label\":\"Structure Id\"},{\"name\":\"Pos\",\"description\":\"Position (POS) of a component or subassembly within the parent engineering BOM (consists-of). Use when the question asks for the position number of child items or subassemblies under a given parent part revision. Do NOT use for where-used or parent/assembly position questions those belong on EngPartStructureExt. Synonyms: position, POS, drawing position, line position, BOM position, component position, drawing position number.\",\"data_type\":\"Text\",\"label\":\"Position\"},{\"name\":\"Qty\",\"description\":\"Quantity of the component required per parent assembly. Synonyms: quantity, qty, qty per assembly, component quantity.\",\"data_type\":\"Number\",\"label\":\"Quantity\"},{\"name\":\"StrComment\",\"description\":\"Free-text comment on the structure line. Synonyms: comment, note, remark.\",\"data_type\":\"Text\",\"label\":\"Comment\"},{\"name\":\"SortNo\",\"description\":\"Sort order of the structure line. Synonyms: sort number, sort order, sequence.\",\"data_type\":\"Number\",\"label\":\"Sort No\"}],\"description\":\"WHEN: engineering BOM, bill of material, consists of, components, what parts make up this assembly, component list, component quantities, structure of this revision. THEN: nav EngPartStructureArray; component part is SubPartNo + SubPartRev, quantity is Qty, position is Pos. ACCESS: $expand=EngPartStructureArray on EngPartRevisionSet(PartNo=\\u003cx\\u003e,PartRev=\\u003cy\\u003e); keys PartNo, PartRev. Synonyms: BOM, bill of material, consists of, components, structure components.. CAN NOT USE this nav_path construct $expand in query_options. If $expand=EngPartStructureArray is used, then it throws error.\"},{\"nav_path\":\"EngineeringPartRevisionStructureBusinessObject.svc/EngPartRevisionSet(PartNo={PartNo},PartRev={PartRev})/DocumentRequirementsArray\",\"navigation_attributes\":[{\"name\":\"ETag\",\"data_type\":\"ETag\"},{\"name\":\"luname\",\"data_type\":\"Text\"},{\"name\":\"keyref\",\"data_type\":\"Text\"},{\"name\":\"Objgrants\",\"data_type\":\"Text\",\"label\":\"Granted access\"},{\"name\":\"LuName\",\"description\":\"Logical unit name of the object the document requirement is connected to. Synonyms: logical unit, lu, object type.\",\"data_type\":\"Text\",\"label\":\"LU Name\"},{\"name\":\"KeyRef\",\"description\":\"Key reference string identifying the object the document requirement is connected to. Synonyms: key reference, object key, record key.\",\"data_type\":\"Text\",\"label\":\"Key Ref\"},{\"name\":\"DocClass\",\"description\":\"Document class defining the type of document required for the part revision. Synonyms: doc class, document type, document category.\",\"data_type\":\"Text\",\"label\":\"Document Class\"},{\"name\":\"Description\",\"description\":\"Free-text description of the document requirement. Synonyms: requirement description, doc description, note.\",\"data_type\":\"Text\",\"label\":\"Requirement Description\"},{\"name\":\"InOutDirection\",\"description\":\"Direction of the document flow, indicating whether the document is incoming or outgoing. Synonyms: document flow, in out direction, direction.\",\"data_type\":\"IfsApp.DocRequirementObject.DocReqInOutDirection\",\"enum\":[{\"client_value\":\"None\",\"identifier\":\"None\"},{\"client_value\":\"Inbound\",\"identifier\":\"Inbound\"},{\"client_value\":\"Outbound\",\"identifier\":\"Outbound\"},{\"client_value\":\"In/Outbound\",\"identifier\":\"InOutbound\"}],\"label\":\"Document Flow\"},{\"name\":\"Category\",\"description\":\"Association category describing how the document relates to the part revision. Synonyms: association category, doc category, reference category.\",\"data_type\":\"Text\",\"label\":\"Association Category\"},{\"name\":\"StandardProfile\",\"description\":\"Indicates whether the requirement comes from a standard document requirement profile. Synonyms: standard profile, from profile, default profile.\",\"data_type\":\"Boolean\",\"label\":\"Standard Profile\"},{\"name\":\"DocReqProfile\",\"description\":\"Document requirement profile identifier the requirement originates from. Synonyms: doc req profile, requirement profile, profile id.\",\"data_type\":\"Text\",\"label\":\"Doc. Req. ID\"}],\"description\":\". CAN NOT USE this nav_path construct $expand in query_options. If $expand=DocumentRequirementsArray is used, then it throws error.\"},{\"nav_path\":\"EngineeringPartRevisionStructureBusinessObject.svc/EngPartRevisionSet(PartNo={PartNo},PartRev={PartRev})/EngPartWhereUsedArray\",\"navigation_attributes\":[{\"name\":\"ETag\",\"data_type\":\"ETag\"},{\"name\":\"luname\",\"data_type\":\"Text\"},{\"name\":\"keyref\",\"data_type\":\"Text\"},{\"name\":\"Objgrants\",\"data_type\":\"Text\",\"label\":\"Granted access\"},{\"name\":\"PartNo\",\"description\":\"Parent engineering part number that uses (consumes) this revision as a component. Synonyms: parent part, used in part, where used part, assembly part.\",\"data_type\":\"Text\",\"label\":\"Part Number\"},{\"name\":\"PartRev\",\"description\":\"Parent engineering part revision that uses this revision as a component. Synonyms: parent revision, used in revision, assembly revision.\",\"data_type\":\"Text\",\"label\":\"Part Revision\"},{\"name\":\"SubPartNo\",\"description\":\"Component (child) engineering part number - this revision. Synonyms: component part, child part, this part.\",\"data_type\":\"Text\",\"label\":\"Number\"},{\"name\":\"SubPartRev\",\"description\":\"Component (child) engineering part revision - this revision. Synonyms: component revision, child revision, this revision.\",\"data_type\":\"Text\",\"label\":\"Revision\"},{\"name\":\"StructureId\",\"data_type\":\"Text\",\"label\":\"Structure Id\"},{\"name\":\"Pos\",\"description\":\"Position (POS) of this part as used in a parent assembly (where-used). Use when the question asks for position numbers from the parent or where-used perspective which assemblies use this part and at which POS. Do NOT use for position numbers of child items or subassemblies under a BOM those belong on EngPartStructure. Synonyms: position, POS, drawing position, where-used position, parent position, drawing position number.\",\"data_type\":\"Text\",\"label\":\"Drawing Position No\"},{\"name\":\"Qty\",\"description\":\"Quantity of this component required per parent assembly. Synonyms: quantity, qty per assembly, quantity per assembly.\",\"data_type\":\"Number\",\"label\":\"Quantity\"},{\"name\":\"StrComment\",\"description\":\"Free-text note on the where-used structure line. Synonyms: note, comment, remark.\",\"data_type\":\"Text\",\"label\":\"Note\"},{\"name\":\"DtCre\",\"data_type\":\"Date\",\"label\":\"Created\"},{\"name\":\"UserCreated\",\"data_type\":\"Text\",\"label\":\"Created By\"},{\"name\":\"DtChg\",\"data_type\":\"Date\",\"label\":\"Modified\"},{\"name\":\"UserSign\",\"data_type\":\"Text\",\"label\":\"Modified By\"},{\"name\":\"Flex1\",\"data_type\":\"Number\",\"label\":\"Flex1\"},{\"name\":\"Flex2\",\"data_type\":\"Text\",\"label\":\"Flex2\"},{\"name\":\"Flex3\",\"data_type\":\"Text\",\"label\":\"Flex3\"},{\"name\":\"SortNo\",\"description\":\"Sort order of the structure line. Synonyms: sort number, sort order, sequence.\",\"data_type\":\"Number\",\"label\":\"Sort No\"},{\"name\":\"PartName\",\"description\":\"Standard name of the parent engineering part. Synonyms: parent part name, part name, standard name.\",\"data_type\":\"Text\",\"label\":\"Part Name\"},{\"name\":\"PartDescription\",\"description\":\"Description of the parent engineering part. Synonyms: parent part description, part description.\",\"data_type\":\"Text\",\"label\":\"Part Description\"},{\"name\":\"UnitCode\",\"description\":\"Unit of measure of the component. Synonyms: UoM, unit of measure, unit code.\",\"data_type\":\"Text\",\"label\":\"Unit Code\"},{\"name\":\"UnitCodeDescription\",\"description\":\"Description of the component unit of measure. Synonyms: UoM description, unit description.\",\"data_type\":\"Text\",\"label\":\"Unit Code Description\"},{\"name\":\"Children\",\"description\":\"Number of child components in the parent structure. Synonyms: number of children, child count.\",\"data_type\":\"Number\",\"label\":\"Children\"},{\"name\":\"State\",\"description\":\"Life cycle status of the parent part revision (Preliminary, Active, Released, Obsolete). Synonym e: components, quantities, positions).\\nAnswers questions about: engineering parts (engineering part number, class, responsible, acquisition/make-or-buy, planning method); engineering revisions (current released revision, revision status/lifecycle Preliminary/Active/Released/Obsolete, released/active/obsolete dates, engineering change order, development level, technical drawing); engineering structures (engineering BOM, what parts make up an assembly, component/child parts and their quantities and positions, where-used); engineering part costs and hours at the revision level (assumed, standard, work, material, and calculated cost, calculated/actual work hours, lead time); and the document requirements connected to a part revision (required document classes, categories, direction, and requirement profiles).\\nThis represents ENGINEERING (as-designed, PDM) parts ONLY. Do NOT use it for other part types or downstream data: inventory parts and stock balances (InventoryPart, InventoryPartInStock), MRP / material planning parts and supply-demand (MrpPart, MrpPartAction, MrpPartSupplyDemand), manufacturing product/configuration structures (ProductStructure, ConfigurationStructure), or shop-floor / manufacturing execution (ShopOrder). The cost and hour figures here are revision-level ENGINEERING estimates common to all sites; Do NOT use this BO for SITE-SPECIFIC costs (per-site standard/average/inventory-value costing, cost sets, cost buckets by site) - those live in the inventory / costing objects (e.g. InventoryPartCost, InvPartSiteCost) and are not represented here. It carries no on-hand balances, no supply/demand or planning figures, no site-specific cost, and no shop-floor status. Entry projection EngineeringPartRevisionStructureBusinessObject.\", \"Synonyms\": [\"engineering part\", \"engineering part revision\", \"engineering revision\", \"engineering BOM\", \"engineering bill of material\", \"engineering structure\", \"consists of\", \"engineering product structure\", \"part revision structure\", \"engineering part cost\", \"engineering document requirement\", \"required documents\"], \"IsBusinessObjectGranted\": true}, {\"BusinessObject\": \"Delimitation\", \"Path\": \"DelimitationBusinessObject.svc/DelimitationSet\", \"Description\": \"Business object representing an isolation template (Delimitation) used for planning and managing isolation/delimitation activities, including revision details, site, responsible persons, and safety conditions.\", \"Synonyms\": [\"delimitation template\", \"isolation template\"], \"IsBusinessObjectGranted\": true}, {\"BusinessObject\": \"Linear Asset\", \"Path\": \"LinearAssetBusinessObject.svc/LinastLinearAssetSet\", \"Description\": \"Represents a revision controlled linear infrastructure asset such as a road, pipeline, or railway. A Linear Asset is characterized by its length and segmented structure and supports lifecycle management, site visibility, operational traceability, and design integration. It consists of sections, segments, and elements, and can be associated with work orders, preventive maintenance actions, isolation objects, parties, and historical records.\", \"Synonyms\": [\"Linear Asset\", \"Linear Infrastructure Asset\"], \"IsBusinessObjectGranted\": true}, {\"BusinessObject\": \"Maintenance Program\", \"Path\": \"MaintenanceProgramBusinessObject.svc/MaintProgramSet\", \"Description\": \"Business object for defining and managing maintenance programs in Fleet and Asset Management. Represents maintenance programs with revisions that define scheduled maintenance requirements for engineering parts. Includes assigned parts and part revisions that are in scope for maintenance, maintenance groups that define part-specific maintenance requirements with average value rules and preferred groupings, and affected serials assigned to the program. Integrates with engineering part master and revision data, manufacturer information, and Part Serial Catalog for serial identity and operational attributes. Tracks access control through access groups, and maintains a journal of changes and events throughout the maintenance program life-cycle. Links to vehicle serial registration data for affected serials.\", \"Synonyms\": [\"Maintenance Program\", \"Maint Program\", \"Maint Prog\", \"Define Maintenance Program\", \"FAM Maintenance Program\"], \"IsBusinessObjectGranted\": true}, {\"BusinessObject\": \"Kb Knowledge Article\", \"Path\": \"KbKnowledgeArticleBusinessObject.svc/KbKnowledgeArticleSet\", \"Description\": \"Knowledge Article represents a single knowledge article in the knowledge base, used to capture, structure, and share solutions, how to guides, troubleshooting steps, and reference information. It holds the core identity, version, authorship, approval data, visibility rules, and content of the article, enabling users and support organizations to create, maintain, and consume reusable knowledge across channels and processes.\", \"Synonyms\": [\"Knowledge Article\", \"KB Article\", \"Help Article\", \"Support Article\", \"Knowledge Base Record\", \"FAQ Article\", \"How-To Article\", \"Troubleshooting Article\"], \"IsBusinessObjectGranted\": true}]", "name": "GetBusinessObject", "role": "tool", "tool_call_id": "call_p8sje6xUNvLRQKt3vksk91gx"}, {"content": "", "role": "assistant", "tool_calls": [{"function": {"arguments": "{\"path\":\"EngineeringPartRevisionStructureBusinessObject.svc/EngPartRevisionSet\",\"intent\":\"QUERY\"}", "name": "GetBusinessObjectInfo"}, "id": "call_54qEf4l7SPuBAxeQLEesPogv", "type": "function"}]}, {"content": "\\{\"api_endpoint\":\"EngineeringPartRevisionStructureBusinessObject.svc/EngPartRevisionSet\",\"summary\":\"Entry point for the as-designed ENGINEERING part revision, its engineering part master, engineering bill-of-material (consists-of structure), revision-level costs and hours, and the connected document requirements. Answers questions about engineering parts (part number, class, responsible, acquisition, provide/make-or-buy, planning method, UoM, tracking, technical class), engineering revisions (current released revision, revision status/lifecycle, released/active/obsolete dates, engineering change order, technical drawing), engineering structures (engineering BOM, what parts make up an assembly, component parts, quantities and positions), engineering part costs and hours (assumed/standard/work/material and calculated cost, work hours, lead time), and the document requirements of a part revision (required document classes, categories, direction, profiles). These engineering-part (master) attributes live on EngPartMaster and are returned by expanding PartNoRef on EngPartRevisionSet, not as columns of EngPartRevisionSet. Covers ENGINEERING (design intent / PDM) parts only; not inventory parts or stock balances (InventoryPart, InventoryPartInStock), MRP / planning parts (MrpPart, MrpPartAction, MrpPartSupplyDemand), manufacturing product/configuration structures (ProductStructure, ConfigurationStructure), or shop-floor execution (ShopOrder).\",\"description\":\"The as-designed engineering definition of a product revision and its engineering bill-of-material (BOM). Holds the revision-controlled record of an ENGINEERING part (EngPartRevision), the engineering part master common to all revisions (EngPartMaster), and the consists-of engineering structure (EngPartStructure: components, quantities, positions).\\nAnswers questions about: engineering parts (engineering part number, class, responsible, provide, project doc req profile, acquisition/make-or-buy, planning method); engineering revisions (current released revision, revision status/lifecycle Preliminary/Active/Released/Obsolete, released/active/obsolete dates, engineering change order, development level, technical drawing); engineering structures (engineering BOM, what parts make up an assembly, component/child parts and their quantities and positions, where-used); engineering part costs and hours at the revision level (assumed, standard, work, material, and calculated cost, calculated/actual work hours, lead time); and the document requirements connected to a part revision (required document classes, categories, direction, and requirement profiles).\\nThis represents ENGINEERING (as-designed, PDM) parts ONLY. Do NOT use it for other part types or downstream data: inventory parts and stock balances (InventoryPart, InventoryPartInStock), MRP / material planning parts and supply-demand (MrpPart, MrpPartAction, MrpPartSupplyDemand), manufacturing product/configuration structures (ProductStructure, ConfigurationStructure), or shop-floor / manufacturing execution (ShopOrder). The cost and hour figures here are revision-level ENGINEERING estimates common to all sites; Do NOT use this BO for SITE-SPECIFIC costs (per-site standard/average/inventory-value costing, cost sets, cost buckets by site) - those live in the inventory / costing objects (e.g. InventoryPartCost, InvPartSiteCost) and are not represented here. It carries no on-hand balances, no supply/demand or planning figures, no site-specific cost, and no shop-floor status. Entry projection EngineeringPartRevisionStructureBusinessObject.\\nIf a request contains only an Engineering Part Number and no revision is specified, use the current revision of the engineering part and explicitly indicate which revision was used, unless the user requests a specific revision. This governs only which revision to select, not which fields to return - still expand references (e.g. PartNoRef for any part-master attribute: part class, responsible, acquisition, provide, document requirement profile or planning method) when needed to answer the question.\",\"key_predicate\":\"(PartNo = {PartNo} AND PartRev = {PartRev})\",\"available_attributes\":[{\"name\":\"ETag\",\"data_type\":\"ETag\"},{\"name\":\"luname\",\"description\":\"The luname is: 'EngPartRevision'\",\"data_type\":\"Text\"},{\"name\":\"keyref\",\"data_type\":\"Text\"},{\"name\":\"Objgrants\",\"data_type\":\"Text\",\"label\":\"Granted access\"},{\"name\":\"PartNo\",\"description\":\"Engineering part number this revision belongs to. Synonyms: part number, engineering part no, part no.\",\"data_type\":\"Text\",\"label\":\"Part Number\"},{\"name\":\"PartRev\",\"description\":\"Engineering revision identifier of the part. Synonyms: revision, eng rev, part revision, revision id, engineering part revision, engineering revision.\",\"data_type\":\"Text\",\"label\":\"Part Revision\"},{\"name\":\"RevNo\",\"description\":\"Sequential revision number of the part revision. Synonyms: revision number, rev no.\",\"data_type\":\"Number\",\"label\":\"Rev No\"},{\"name\":\"EcoNo\",\"description\":\"Engineering change order number that introduced or governs this revision. Synonyms: CO No, change order, ECO, engineering change order.\",\"data_type\":\"Text\",\"label\":\"Eco No\"},{\"name\":\"ObsoleteDt\",\"description\":\"Date the revision was made obsolete. Synonyms: obsoleted date, obsolete date.\",\"data_type\":\"Date\",\"label\":\"Obsolete Dt\"},{\"name\":\"ReleasedDt\",\"description\":\"Date the revision was released. Synonyms: released date, release date.\",\"data_type\":\"Date\",\"label\":\"Released Dt\"},{\"name\":\"StrActiveDt\",\"description\":\"Date the revision structure became active. Synonyms: activated date, active date.\",\"data_type\":\"Date\",\"label\":\"Str Active Dt\"},{\"name\":\"DevelopLev\",\"description\":\"Development level (maturity) of the revision. Synonyms: development level, dev level, maturity level.\",\"data_type\":\"Text\",\"label\":\"Develop Lev\"},{\"name\":\"Info1\",\"description\":\"Free-text note on the revision. Synonyms: note, remark, comment.\",\"data_type\":\"Text\",\"label\":\"Info\"},{\"name\":\"AssumedLeadTime\",\"description\":\"Assumed (estimated) lead time for the part revision. Synonyms: assumed lead time, estimated lead time.\",\"data_type\":\"Number\",\"label\":\"Assumed Lead Time\"},{\"name\":\"AssumedCost\",\"description\":\"Assumed (estimated) cost of the part revision. Synonyms: assumed cost, estimated cost.\",\"data_type\":\"Number\",\"label\":\"Assumed Cost\"},{\"name\":\"LeadTime\",\"description\":\"Actual lead time for the part revision. Synonyms: actual lead time, lead time.\",\"data_type\":\"Number\",\"label\":\"Lead Time\"},{\"name\":\"StdCost\",\"description\":\"Standard cost of the part revision. Synonyms: standard cost, std cost.\",\"data_type\":\"Number\",\"label\":\"Std Cost\"},{\"name\":\"WorkCost\",\"description\":\"Work (labor) cost of the part revision. Synonyms: work cost, labor cost.\",\"data_type\":\"Number\",\"label\":\"Work Cost\"},{\"name\":\"CalcCost\",\"description\":\"Calculated material cost of the revision. Synonyms: calculated cost, calc cost, calculated material cost.\",\"data_type\":\"Number\",\"label\":\"Calc Cost\"},{\"name\":\"CalcWork\",\"description\":\"Calculated work (labor) cost of the revision. Synonyms: calculated work cost, calc work cost.\",\"data_type\":\"Number\",\"label\":\"Calc Work\"},{\"name\":\"DtCre\",\"description\":\"Timestamp when the part revision was created. Synonyms: created, created date, creation date.\",\"data_type\":\"Timestamp\",\"label\":\"Date Created\"},{\"name\":\"UserCreated\",\"description\":\"User who created the part revision. Synonyms: created by, creator, created by user.\",\"data_type\":\"Text\",\"label\":\"User Created\"},{\"name\":\"DtChg\",\"description\":\"Timestamp when the part revision was last modified. Synonyms: modified, modified date, last changed, change date.\",\"data_type\":\"Timestamp\",\"label\":\"Date Chg\"},{\"name\":\"UserSign\",\"description\":\"User who last modified the part revision. Synonyms: modified by, changed by, last modified by.\",\"data_type\":\"Text\",\"label\":\"User Sign\"},{\"name\":\"MaterialCost\",\"description\":\"Material cost of the part revision. Synonyms: material cost.\",\"data_type\":\"Number\",\"label\":\"Material Cost\"},{\"name\":\"WorkHour\",\"description\":\"Work hours for the part revision. Synonyms: work hours, labor hours.\",\"data_type\":\"Number\",\"label\":\"Work Hour\"},{\"name\":\"CalcHour\",\"description\":\"Calculated work hours for the revision. Synonyms: calculated work hours, calc hours.\",\"data_type\":\"Number\",\"label\":\"Calc Hour\"},{\"name\":\"TransferredToManuf\",\"description\":\"Date the part revision was transferred to manufacturing. Synonyms: transferred to manufacturing, transfer to manufacturing date, manufacturing transfer.\",\"data_type\":\"Date\",\"label\":\"Transferred To Manuf\"},{\"name\":\"TechnicalDrawingNo\",\"description\":\"Technical drawing number linked to the revision. Synonyms: drawing no, drawing number, technical drawing no.\",\"data_type\":\"Text\",\"label\":\"Technical Drawing No\"},{\"name\":\"TechDrawingRevisionNo\",\"description\":\"Technical drawing revision number. Synonyms: drawing revision, drawing rev no, technical drawing revision no.\",\"data_type\":\"Text\",\"label\":\"Tech Drawing Revision No\"},{\"name\":\"Objstate\",\"description\":\"Life cycle status of the part revision. Values: Preliminary, Active, Released, Obsolete. Synonyms: status, state, revision status, lifecycle state.\",\"data_type\":\"IfsApp.EngineeringPartRevisionStructureBusinessObject.EngPartRevisionState\",\"enum\":[{\"client_value\":\"Preliminary\",\"identifier\":\"Preliminary\"},{\"client_value\":\"Active\",\"identifier\":\"Active\"},{\"client_value\":\"Released\",\"identifier\":\"Released\"},{\"client_value\":\"Obsolete\",\"identifier\":\"Obsolete\"}],\"label\":\"State\"},{\"name\":\"LuName\",\"description\":\"Logical unit name of the part revision, derived for object connection joins (always 'EngPartRevision'). Used to link document requirements to this revision. Synonyms: logical unit, lu, object type.\",\"data_type\":\"Text\",\"label\":\"LU Name\"},{\"name\":\"KeyRef\",\"description\":\"Key reference string identifying this part revision (PART_NO/PART_REV) for object connection joins. Used to link
