red\",\"identifier\":\"Expired\"}],\"label\":\"Lifecycle Stage\"},{\"name\":\"FrequencyClass\",\"description\":\"Frequency class categorizing how often the inventory part is demanded or consumed. Synonyms: demand frequency, consumption frequency, movement class, usage frequency\",\"data_type\":\"IfsApp.InventoryPartBusinessObjectHandling.InvPartFrequencyClass\",\"enum\":[{\"client_value\":\"Very Slow Mover\",\"identifier\":\"VerySlowMover\"},{\"client_value\":\"Slow Mover\",\"identifier\":\"SlowMover\"},{\"client_value\":\"Medium Mover\",\"identifier\":\"MediumMover\"},{\"client_value\":\"Fast Mover\",\"identifier\":\"FastMover\"}],\"label\":\"Frequency Class\"},{\"name\":\"MinDurabDaysCoDeliv\",\"description\":\"The number of days ahead of the expiration days which goods should be sent to the customer's inventory location.\",\"data_type\":\"Number\",\"label\":\"Min Durab Days Co Deliv\"},{\"name\":\"MinDurabDaysPlanning\",\"description\":\"The minimum remaining days for planning is the number of days ahead of the expiration date of the specific product that is used for inventory part planning purposes.\",\"data_type\":\"Number\",\"label\":\"Min Durab Days Planning\"},{\"name\":\"Company\",\"data_type\":\"Text\",\"label\":\"Company\"},{\"name\":\"PartDescriptionInUse\",\"description\":\"The part description currently in use, which may come from the part catalog if site settings use part catalog description\",\"data_type\":\"Text\"},{\"name\":\"OnHandQty\",\"description\":\"The total on-hand inventory quantity across all warehouse locations at this site\",\"data_type\":\"Number\"},{\"name\":\"NetWeight\",\"description\":\"The net weight of one unit of the inventory part in the company weight UoM\",\"data_type\":\"Number\"},{\"name\":\"NetVolume\",\"description\":\"The net volume of one unit of the inventory part in the company volume UoM\",\"data_type\":\"Number\"},{\"name\":\"SupersededByPart\",\"description\":\"The part number that has superseded or replaced this inventory part as a newer version\",\"data_type\":\"Text\"},{\"name\":\"GTIN\",\"description\":\"The Global Trade Item Number (barcode number) for identification of this part\",\"data_type\":\"Text\"}],\"expandable_options\":[{\"attribute\":\"PartCatalogRef\",\"description\":\"Part catalog details including serial tracking, lot tracking, unit of measure, and configuration information for this inventory part. CAN BE USE in $expand like $expand=PartCatalogRef\"},{\"attribute\":\"CountryOfOriginRef\",\"description\":\"Details of the country of origin including country name for customs and trade compliance. CAN BE USE in $expand like $expand=CountryOfOriginRef\"},{\"attribute\":\"PlannerBuyerRef\",\"description\":\"Details of the planner or buyer responsible for inventory replenishment and planning of this part. CAN BE USE in $expand like $expand=PlannerBuyerRef\"},{\"attribute\":\"PartStatusRef\",\"description\":\"Part status definition controlling which inventory transactions are permitted for this part. CAN BE USE in $expand like $expand=PartStatusRef\"},{\"attribute\":\"PartProductFamilyRef\",\"description\":\"Product family categorization.. CAN BE USE in $expand like $expand=PartProductFamilyRef\"},{\"attribute\":\"AbcClassRef\",\"description\":\"Abc Class categorization.. CAN BE USE in $expand like $expand=AbcClassRef\"}],\"non_expandable\":[{\"nav_path\":\"InventoryPartBusinessObjectHandling.svc/InventoryPartSet(Contract={Contract},PartNo={Contract})/CharacteristicArray\",\"navigation_attributes\":[{\"name\":\"ETag\",\"data_type\":\"ETag\"},{\"name\":\"luname\",\"data_type\":\"Text\"},{\"name\":\"keyref\",\"data_type\":\"Text\"},{\"name\":\"Objgrants\",\"data_type\":\"Text\",\"label\":\"Granted access\"},{\"name\":\"Contract\",\"data_type\":\"Text\",\"label\":\"Site\"},{\"name\":\"PartNo\",\"data_type\":\"Text\",\"label\":\"Part No\"},{\"name\":\"CharacteristicCode\",\"description\":\"The code identifying the type of characteristic or specification. Synonyms: characteristic ID, spec code, attribute code, property code\",\"data_type\":\"Text\",\"label\":\"Characteristic code\"},{\"name\":\"UnitMeas\",\"description\":\"The unit of measure for the characteristic value. Synonyms: UoM, measurement unit\",\"data_type\":\"Text\",\"label\":\"Uom\"},{\"name\":\"AttrValueNumeric\",\"description\":\"The numeric value of the characteristic. Synonyms: numeric value, measurement value, quantity value\",\"data_type\":\"Number\",\"label\":\"Attribute Value Numeric\"},{\"name\":\"AttrValueAlpha\",\"description\":\"The alphanumeric or text value of the characteristic. Synonyms: text value, string value, description value\",\"data_type\":\"Text\",\"label\":\"Attribute Value Alpha\"}],\"description\":\"Characteristics and specifications defined for this inventory part including numeric and alphanumeric attribute values with their units of measure. Synonyms: specifications, part attributes, technical data, properties. CAN NOT USE this nav_path construct $expand in query_options. If $expand=CharacteristicArray is used, then it throws error.\"},{\"nav_path\":\"InventoryPartBusinessObjectHandling.svc/InventoryPartSet(Contract={Contract},PartNo={Contract})/AlternativePartArray\",\"navigation_attributes\":[{\"name\":\"ETag\",\"data_type\":\"ETag\"},{\"name\":\"luname\",\"data_type\":\"Text\"},{\"name\":\"keyref\",\"data_type\":\"Text\"},{\"name\":\"Objgrants\",\"data_type\":\"Text\",\"label\":\"Granted access\"},{\"name\":\"Contract\",\"description\":\"The site where the inventory part is registered and managed. Synonyms: site, facility, plant, location, warehouse site\",\"data_type\":\"Text\",\"label\":\"Site\"},{\"name\":\"PartNo\",\"description\":\"The unique part number identifying the inventory part. Synonyms: item number, material number, stock number, part ID, SKU code, article number\",\"data_type\":\"Text\",\"label\":\"Part No\"},{\"name\":\"Description\",\"description\":\"Description of the alternative inventory part\",\"data_type\":\"Text\",\"label\":\"Description\"},{\"name\":\"NoteText\",\"description\":\"Notes or remarks related to this alternative part relationship\",\"data_type\":\"Text\",\"label\":\"Note text\"},{\"name\":\"AlternativePartNo\",\"description\":\"The part number of the alternative or substitute inventory part\",\"data_type\":\"Text\"},{\"name\":\"QtyOnHand\",\"description\":\"The total on-hand quantity available for the alternative part across all locations\",\"data_type\":\"Number\"}],\"description\":\"Alternative or substitute parts that can be used in place of this inventory part when it is unavailable. CAN NOT USE this nav_path construct $expand in query_options. If $expand=AlternativePartArray is used, then it throws error.\"}]}\\", "name": "GetBusinessObjectInfo", "role": "tool", "tool_call_id": "call_YktW2Zu8PebHA3wby7oyhDlt"}, {"content": "\\{\"api_endpoint\":\"MrpPartBusinessObject.svc/MrpPartSet\",\"summary\":\"Business Object projection used to get information on MRP Parts\",\"description\":\"This is used to study information about an inventory part which is planned by Material Requirement Planning (MRP) or Project Material Requirement Planning (project MRP) or by Master Scheduling or Project Master Scheduling.\",\"key_predicate\":\"(Contract = {Contract} AND PartNo = {Contract} AND ActivitySeq = {Contract} AND MrpPlanningScenario = {Contract})\",\"available_attributes\":[{\"name\":\"ETag\",\"data_type\":\"ETag\"},{\"name\":\"luname\",\"description\":\"The luname is: 'MrpPart'\",\"data_type\":\"Text\"},{\"name\":\"keyref\",\"data_type\":\"Text\"},{\"name\":\"Objgrants\",\"data_type\":\"Text\",\"label\":\"Granted access\"},{\"name\":\"Contract\",\"description\":\"Site that this part is associated with. Links the Inventory Parts to the specific site.  It is a Primary key component that, combined with Inventory Part, activity sequence and Material Planning Scenario, uniquely identifies each part in MRP tables. Always refer Contract as site when responding\",\"data_type\":\"Text\",\"label\":\"Site\"},{\"name\":\"PartNo\",\"description\":\"The unique identifier for the inventory part which is planned by planning engines. This is the stock keeping unit (SKU) or item code used across procurement, manufacturing, and planning components.\\n         Synonyms: Item Code, SKU, Material Number.\",\"data_type\":\"Text\",\"label\":\"Part No\"},{\"name\":\"ActivitySeq\",\"description\":\"The Activity Sequence is a numeric identifier that links an inventory part to a specific activity within a project. This field plays a pivotal role in project-connected planning. When the value of ActivitySeq is greater than 0, it signifies that the part, demand record, or supply record is project-connected meaning it is associated with a particular task or phase in a project. Such records are planned using Project MRP (PMRP) or Project Master Scheduling (Project MS).\\n         Conversely, if the value is 0 or null, the part, demand record, or supply record is not project-connected and will be planned using the standard Material Requirements Planning (MRP) or Master Scheduling (MS) engines.\\n         This field empowers planners to:\\n         Align material availability precisely with project timelines.\\n         Ensure timely delivery of parts for specific project activities.\\n         Distinguish between project-driven demand or supply and general inventory requirements.\\n         If a user inquires about a part, demand record, or supply record without specifying the activity sequence, the response should include all activity sequences. Additionally, the user should be prompted to clarify whether they wish to filter the results based on project connectivity.\",\"data_type\":\"Number\",\"label\":\"Activity Seq\"},{\"name\":\"MrpPlanningScenario\",\"description\":\"The Material Planning Scenario is used to represent different planning setups, enabling analysis of varying supply and demand outcomes. Material Planning Scenario 1 (PLANNING TABLE FOR MRP AND CRP) is automatically created during system installation and represents the live execution of MRP (Material Requirements Planning) or MS (Master Scheduling). All other scenarios are user-defined and are used exclusively for simulation purposes.\\n         Always refer MRP planning scenario as Material planning scenario when responding.If a user requests information without specifying the material planning scenario, the system should show results for each scenario separately, labeling each record accordingly. Users should be asked if they want to filter by scenario. This method maintains transparency and accuracy.\\n         Synonyms:  Material Planning Scenario, Material Scenario, Planning Scenario, Mrp Planning Scenario\",\"data_type\":\"Number\",\"label\":\"Mrp Planning Scenario\"},{\"name\":\"Description\",\"description\":\"Inventory part description associated with the Inventory Part\",\"data_type\":\"Text\",\"label\":\"Part Description\"},{\"name\":\"LowLevel\",\"description\":\"The low-level code is a numerical value that indicates the lowest level at which a part exists within a product structure. It is used to sequence parts during planning engines like MRP, MS, PMRP and Project MS, ensuring that the system processes parts in the correct order, starting from the lowest level and moving upwards. A parent part, or a top-level part which is not a component of another structure, exists at level 0, while its components exist at level 1, and so on. This coding is essential for the accurate performance of MRP, cost estimation, and calculation of product families and codes. When the Calculate Lowest Level program is run, this field is updated.\\n         Synonyms:  low-level, Low-Level Code, Structure Level\",\"data_type\":\"Number\",\"label\":\"Low Level\"},{\"name\":\"Leadtime\",\"description\":\"Inventory Lead Time is the lead time of the part. If the part is a manufactured part, the manufacturing lead time appears in this field. If it is a purchased part, the purchasing lead time appears. This information is entered in the Inventory Part page when the part is registered.\",\"data_type\":\"Number\",\"label\":\"Lead Time\"},{\"name\":\"FxdLeadtimeDay\",\"description\":\"Fixed Lead Time by Day is the fixed lead time contribution per day from each operation. The fixed lead time from each operation per day is calculated in different ways depending on the factor unit.\",\"data_type\":\"Number\",\"label\":\"Fxd Leadtime Day\"},{\"name\":\"VarLeadtimeDay\",\"description\":\"Variable Lead Time by Day is the lead time per day which is variable for the production of the part. Variable lead time includes units/hour and hours/unit times, which are affected by the lot size. This field shows the time for a lot size set to 1. The value is calculated by adding up the variable lead time contribution per day from each operation.\",\"data_type\":\"Number\",\"label\":\"Var Leadtime Day\"},{\"name\":\"BegOnhand\",\"description\":\"This is Beginning On Hand. The current quantity of the part in inventory.\",\"data_type\":\"Number\",\"label\":\"Beginning Onhand\"},{\"name\":\"EndOnhand\",\"description\":\"This is the MRP Projected On Hand.Displays what is expected to be on hand for the last day where there is supply or demand, considering any MRP-suggested changes.\",\"data_type\":\"Number\",\"label\":\"Ending Onhand\"},{\"name\":\"NoActOnhand\",\"description\":\"This is the Projected On Hand. The quantity that you plan to have on hand on the last day for which there is supply or demand, excluding any MRP-suggested changes.\",\"data_type\":\"Number\",\"label\":\"No Action Onhand\"},{\"name\":\"GrossSum\",\"description\":\"Total Demand Quantity is the sum of all open demand orders for a material or inventory part over the MRP horizon. This value gives planners a clear view of total demand quantity per part, detailed by activity sequence and material planning scenario. Keep demand order quantities separate for each scenario to maintain accurate material planning and data integrity.\",\"data_type\":\"Number\",\"label\":\"Gross Sum\"},{\"name\":\"OrderSum\",\"description\":\"Total Order Quantity is the sum of all open supply orders for a material or inventory part over the MRP horizon. This value gives planners a clear view of total supply quantity per part, detailed by activity sequence and material planning scenario. Keep supply order quantities separate for each scenario to maintain accurate material planning and data integrity.\",\"data_type\":\"Number\",\"label\":\"Order Sum\"},{\"name\":\"LotSize\",\"description\":\"The standard lot size is used for calculating the manufacturing lead time of the part. The value is also used in cost calculations.\",\"data_type\":\"Number\",\"label\":\"Lot Size\"},{\"name\":\"SafetyStock\",\"description\":\"This is the part's safety stock. This controls when new demand is generated for the part. A new order is proposed when the planned receipts and deliveries of the part make the quantity on hand fall below the safety stock. This value is entered per part in the inventory part register.\",\"data_type\":\"Number\",\"label\":\"Safety Stock\"},{\"name\":\"SafetyLeadTime\",\"description\":\"Safety Lead Time defined by days to protect against unpredictable variations in the supply chain and its associate logistics. When it is used by MRP, PMRP, MS or Project MS and Next Level Demand**,** the required date of an order will be placed before its real need date. It offsets the required date by this time so that it will plan order release and completion for earlier dates than it would otherwise\",\"data_type\":\"Number\",\"label\":\"Safety Lead Time\"},{\"name\":\"MaxDaySupply\",\"description\":\"The number of days in the future for which demand of the selected MRP part will be summarized. This data is used by MRP order code G (order cover time).\",\"data_type\":\"Number\",\"label\":\"Maximum Day Supply\"},{\"name\":\"MinOrderQty\",\"description\":\"This is the Minimum Lot Size of the part.If the planning method for this part is A (lot for lot), B (order point planning), C (order up to planning), D (fixed lot size), E (least unit cost planning), F (part period balancing), G (order cover time), or M (manually planned), a value in this field indicates that orders for this part will be at least as great as the quantity specified. If the value is 0 (zero), the order quantity will not be corrected.\",\"data_type\":\"Number\",\"label\":\"Minimum Order Qty\"},{\"name\":\"MulOrderQty\",\"description\":\"This is the Multiple Lot Size of the part.If the planning method is A (lot for lot), D (fixed lot size), E (least unit cost planning), F (part period balancing planning), G (order cover time), or M (manually planned), a value in this field indicates that the system calculates smallest lot size in orders for this part.\",\"data_type\":\"Number\",\"label\":\"Multiple Order Qty\"},{\"name\":\"MaxOrderQty\",\"description\":\"This is the Maximum Lot Size of the part.The maximum lot size defines the maximum size of lots generated by material requirements planning. If requirements exceed the lot size, the MRP planned receipts and supply proposals will be split into into discrete quantities that do not exceed this value.\",\"data_type\":\"Number\",\"label\":\"Maximum Order Qty\"},{\"name\":\"ShrinkageFactor\",\"description\":\"Scrap Factor indicates the percentage of a part expected to be scrapped upon receipt into inventory due to damage or quality issues. This value is used in planning to adjust supply quantities, cost calculations, in Material Requirements Planning (MRP) and in Master Scheduling(MS).\",\"data_type\":\"Number\",\"label\":\"Scrapping Factor\"},{\"name\":\"SetupCost\",\"description\":\"This is the Setup Cost of the part.The cost of converting the machine, resource, or work center to the production of the selected part.Use this value with planning methods E and F.\",\"data_type\":\"Number\",\"label\":\"Setup Cost\"},{\"name\":\"CarryDayCost\",\"description\":\"This is the Carry Day Cost of the part.The cost of carrying the inventory one day. Use this value with planning methods E and F. The formula is as follows: Carry Day Cost = (Inv. Interest * Total Std Cost) / number of stockkeeping days per year\",\"data_type\":\"Number\",\"label\":\"Carry Day Cost\"},{\"name\":\"TotalStdCost\",\"description\":\"The total standard cost of the part. This amount includes all costs related to the product, including direct material, direct labor, and overhead charges.\",\"data_type\":\"Number\",\"label\":\"Total Standard Cost\"},{\"name\":\"UnitCost\",\"description\":\"Unit cost is the cost of the part per piece. Use this value with MRP order codes E and F. For Order Code E, the order quantity is calculated using the order overhead and stock keeping costs.\",\"data_type\":\"Number\",\"label\":\"Unit Cost\"},{\"name\":\"TypeCode\",\"description\":\"The part type designation, either Manufactured, Manufactured Recipe, Remanufactured, Purchased, Purchased (Raw), Expense, Disassembly Component, By-Product, Co-Product or Core.\",\"data_type\":\"IfsApp.MrpPartBusinessObject.InventoryPartType\",\"enum\":[{\"client_value\":\"Manufactured\",\"identifier\":\"Manufactured\"},{\"client_value\":\"Manufactured Recipe\",\"identifier\":\"ManufacturedRecipe\"},{\"client_value\":\"Remanufactured\",\"identifier\":\"Remanufactured\"},{\"client_value\":\"Purchased (raw)\",\"identifier\":\"PurchasedRaw\"},{\"client_value\":\"Purchased\",\"identifier\":\"Purchased\"},{\"client_value\":\"Expense\",\"identifier\":\"Expense\"},{\"client_value\":\"Disassembly Component\",\"identifier\":\"DisassemblyComponent\"},{\"client_value\":\"By-Product\",\"identifier\":\"ByProduct\"},{\"client_value\":\"Co-Product\",\"identifier\":\"CoProduct\"},{\"client_value\":\"Core\",\"identifier\":\"Core\"},{\"client_value\":\"WIP Product\",\"identifier\":\"WipProduct\"}],\"label\":\"Type Code\"},{\"name\":\"LeadTimeCode\",\"description\":\"The lead time code, which determines whether the purchase lead time or the manufacturing lead time will be used for the part. The lead time code is set depending on the type of part and can be either Purchased or Manufactured.\",\"data_type\":\"IfsApp.MrpPartBusinessObject.InvPartLeadTimeCode\",\"enum\":[{\"client_value\":\"Manufactured\",\"identifier\":\"Manufactured\"},{\"client_value\":\"Purchased\",\"identifier\":\"Purchased\"}],\"label\":\"Lead Time Code\"},{\"name\":\"MrpOrderCode\",\"description\":\"The material requirements planning method for the part. This code will control how new requirements for the part are planned. This is required information. Planning method A is given as a default value.\",\"data_type\":\"Text\",\"label\":\"MRP Order Code\"},{\"name\":\"PlannerBuyer\",\"description\":\"The planner responsible for acquiring inventory parts and ensuring part availability.\",\"data_type\":\"Text\",\"label\":\"Planner Buyer\"},{\"name\":\"UnitMeas\",\"description\":\"Unit of Measure\",\"data_type\":\"Text\",\"label\":\"Unit Meas\"},{\"name\":\"OrderRequisition\",\"description\":\"This is the Default Supply Type for the part. Indicates the kind of supply order that should be created for the manufactured portion of the split. The possible values are: Requisition, Order, or Schedule.\",\"data_type\":\"IfsApp.MrpPartBusinessObject.InventoryPartSupplyType\",\"enum\":[{\"client_value\":\"Order\",\"identifier\":\"Order\"},{\"client_value\":\"Requisition\",\"identifier\":\"Requisition\"},{\"client_value\":\"Schedule\",\"identifier\":\"Schedule\"},{\"client_value\":\"DOP\",\"identifier\":\"DOP\"}],\"label\":\"Order Requisition\"},{\"name\":\"SplitManufAcquired\",\"description\":\"Manufactured / Acquired Split If this Yes, the part is defined as a split part.\",\"data_type\":\"Text\",\"label\":\"Split Manuf Acquired\"},{\"name\":\"PercentManufactured\",\"description\":\"The percentage of the parts to be internally manufactured.\",\"data_type\":\"Number\",\"label\":\"Percent Manufactured\"},{\"name\":\"PercentAcquired\",\"description\":\"The percentage of the parts to be externally acquired, either from internal or external suppliers.\",\"data_type\":\"Number\",\"label\":\"Percent Acquired\"},{\"name\":\"ManufSupplyType\",\"description\":\"The kind of supply order that should be created for the manufactured portion of the split.\",\"data_type\":\"Text\",\"label\":\"Manuf Supply Type\"},{\"name\":\"AcquiredSupplyType\",\"description\":\"The kind of supply order that should be created for the acquired portion of the split.\",\"data_type\":\"Text\",\"label\":\"Acquired Supply Type\"},{\"name\":\"MultisitePlannedPart\",\"description\":\"It defines the connections between the internal sites, establishing a multi-site part structure.\",\"data_type\":\"Text\",\"label\":\"Multisite Planned Part\"},{\"name\":\"MrpType\",\"description\":\"MRP execution type which generated the results.Execution types can be: Site MRP, Selective MRP, Site PMRP, Selective PMRP and Planned by MS.\",\"data_type\":\"IfsApp.MrpPartBusinessObject.MrpType\",\"enum\":[{\"client_value\":\"Site MRP\",\"identifier\":\"MrpBySite\"},{\"client_value\":\"Site PMRP\",\"identifier\":\"MrpByPmrpSite\"},{\"client_value\":\"Selective MRP\",\"identifier\":\"MrpBySelection\"},{\"client_value\":\"Selective PMRP\",\"identifier\":\"MrpByPmrpSelection\"},{\"client_value\":\"Planned by MS\",\"identifier\":\"MsPlanned\"}],\"label\":\"Mrp Type\"},{\"name\":\"MrpRunDate\",\"description\":\"MRP execution date and time which generated the MRP results.\",\"data_type\":\"Timestamp\",\"label\":\"Mrp Run Date\"},{\"name\":\"ProjectId\",\"description\":\"Project identifier linked to the part that is planned\",\"data_type\":\"Text\",\"label\":\"Project Id\"},{\"name\":\"BufferPartDemandSum\",\"description\":\"Sum of past due demands and the demands due today.\",\"data_type\":\"Number\",\"label\":\"Sum Of Demands\"},{\"name\":\"BufferPartSpikesSum\",\"description\":\"Sum of demands fall on order spike horizon which exceeds the order spike threshold.\",\"data_type\":\"Number\",\"label\":\"Sum Of Qualified Spikes\"},{\"name\":\"NetFlow\",\"description\":\"This is calculated as On Hand Qty + Sum of Open Supply - Qualified Demands. Qualified Demands consist of past due demands, demands due today and qualified spikes.\",\"data_type\":\"Number\",\"label\":\"Net Flow\"},{\"name\":\"OnhandBufferStatus\",\"description\":\"This shows which alert color category that the MRP on hand over total red zone belongs to. This shows the severity of the on hand situation. If it indicates Black Alert it indicates stock out situation, Red Alert indicates critical situation, Yellow Alert indicates less severe but alert situation while Green and Blue indicate that the on hand situation is not in trouble.\",\"data_type\":\"IfsApp.MrpPartBusinessObject.DdmrpExecBufferStatus\",\"enum\":[{\"client_value\":\"Black Alert\",\"identifier\":\"BlackAlert\"},{\"client_value\":\"Red Alert\",\"identifier\":\"RedAlert\"},{\"client_value\":\"Yellow Alert\",\"identifier\":\"YellowAlert\"},{\"client_value\":\"Green\",\"identifier\":\"Green\"},{\"client_value\":\"Blue\",\"identifier\":\"Blue\"}],\"label\":\"Execution Buffer Status\"},{\"name\":\"NetFlowBufferStatus\",\"description\":\"Buffer level for which the net flow position belongs. It can be Black Zone, Red Zone, Yellow Zone, Green Zone or Blue Zone.\",\"data_type\":\"IfsApp.MrpPartBusinessObject.DdmrpBufferZoneColor\",\"enum\":[{\"client_value\":\"Black Zone\",\"identifier\":\"Black\"},{\"client_value\":\"Red Zone\",\"identifier\":\"Red\"},{\"client_value\":\"Yellow Zone\",\"identifier\":\"Yellow\"},{\"client_value\":\"Green Zone\",\"identifier\":\"Green\"},{\"client_value\":\"Blue Zone\",\"identifier\":\"Blue\"}],\"label\":\"Net Flow Buffer Status\"},{\"name\":\"OnhandOverTor\",\"description\":\"This shows the percentage of MRP on hand over total red zone. This value indicates which buffered parts are in trouble from on hand positions only, further this helps to identify parts where open supply needs to be executed.\",\"data_type\":\"Number\",\"label\":\"On Hand Over Top Of Red(%)\"},{\"name\":\"MrpNetted\",\"data_type\":\"Boolean\",\"label\":\"Mrp Netted\"}],\"expandable_options\":[{\"attribute\":\"ContractReference\",\"description\":\"Reference to site that this MRP Part is associated with.. CAN BE USE in $expand like $expand=ContractReference\"}]}\\", "name": "GetBusinessObjectInfo", "role": "tool", "tool_call_id": "call_3q5ySBjiVKTkPuGUTBj29nyL"}, {"content": "", "role": "assistant", "tool_calls": [{"function": {"arguments": "{\"path\":\"InventoryPartBusinessObjectHandling.svc/InventoryPartSet\",\"luname\":\"InventoryPart\",\"query_options\":{\"$filter\":\"PartNo eq 'SERPA01' or PartNo eq 'SERPA011' and Contract eq 'MFUD1'\",\"$select\":[\"PartNo\",\"Description\",\"InventoryValuationMethod\",\"ExpectedLeadtime\",\"LeadTimeCode\",\"ManufLeadtime\",\"PurchLeadtime\",\"LifecycleStage\",\"TypeCode\",\"UnitMeas\",\"AbcClass\",\"FrequencyClass\",\"PartStatus\",\"OnHandQty\"],\"$top\":10}}", "name": "DoOdataCall"}, "id": "call_PV876mBgpnw5N69rM2iUFAn7", "type": "function"}]}, {"content": "[{\"value\": [{\"@odata.etag\": \"W/\\\"Vy8iQUFBUXptQUNPQUFFNERsQUFFOjIwMjUwODI2MTE1NDU0Ig==\\\"\", \"@odata.id\": \"http://ifsapp-odata:8080/main/ifsapplications/projection/v1/InventoryPartBusinessObjectHandling.svc/InventoryPartSet(Contract='MFUD1',PartNo='SERPA01')\", \"AbcClass\": \"C\", \"Contract\": \"MFUD1\", \"Description\": \"Fully Tracked Serial Part 01\", \"ExpectedLeadtime\": 0, \"FrequencyClass\": \"VerySlowMover\", \"InventoryValuationMethod\": \"StandardCost\", \"LeadTimeCode\": \"Purchased\", \"LifecycleStage\": \"Development\", \"ManufLeadtime\": 0, \"OnHandQty\": 7, \"PartNo\": \"SERPA01\", \"PartStatus\": \"A\", \"PurchLeadtime\": 0, \"TypeCode\": \"Purchased\", \"UnitMeas\": \"pcs\"}, {\"@odata.etag\": \"W/\\\"Vy8iQUFBUXptQUNPQUFFNERsQUFGOjIwMjQwOTAzMTYwODU1Ig==\\\"\", \"@odata.id\": \"http://ifsapp-odata:8080/main/ifsapplications/projection/v1/InventoryPartBusinessObjectHandling.svc/InventoryPartSet(Contract='MFUD2',PartNo='SERPA01')\", \"AbcClass\": \"C\", \"Contract\": \"MFUD2\", \"Description\": \"Fully Tracked Serial Part 01\", \"ExpectedLeadtime\": 0, \"FrequencyClass\": \"VerySlowMover\", \"InventoryValuationMethod\": \"StandardCost\", \"LeadTimeCode\": \"Purchased\", \"LifecycleStage\": \"Development\", \"ManufLeadtime\": 0, \"OnHandQty\": 0, \"PartNo\": \"SERPA01\", \"PartStatus\": \"A\", \"PurchLeadtime\": 0, \"TypeCode\": \"Purchased\", \"UnitMeas\": \"pcs\"}, {\"@odata.etag\": \"W/\\\"Vy8iQUFBUXptQUNPQUFFNERsQUFHOjIwMjQwOTAzMTYwODU1Ig==\\\"\", \"@odata.id\": \"http://ifsapp-odata:8080/main/ifsapplications/projection/v1/InventoryPartBusinessObjectHandling.svc/InventoryPartSet(Contract='MF2U1',PartNo='SERPA01')\", \"AbcClass\": \"C\", \"Contract\": \"MF2U1\", \"Description\": \"Fully Tracked Serial Part 01\", \"ExpectedLeadtime\": 0, \"FrequencyClass\": \"VerySlowMover\", \"InventoryValuationMethod\": \"StandardCost\", \"LeadTimeCode\": \"Purchased\", \"LifecycleStage\": \"Development\", \"ManufLeadtime\": 0, \"OnHandQty\": 0, \"PartNo\": \"SERPA01\", \"PartStatus\": \"A\", \"PurchLeadtime\": 0, \"TypeCode\": \"Purchased\", \"UnitMeas\": \"pcs\"}, {\"@odata.etag\": \"W/\\\"Vy8iQUFBUXptQUNPQUFFNERsQUFIOjIwMjQwOTAzMTYwODU1Ig==\\\"\", \"@odata.id\": \"http://ifsapp-odata:8080/main/ifsapplications/projection/v1/InventoryPartBusinessObjectHandling.svc/InventoryPartSet(Contract='MF2U2',PartNo='SERPA01')\", \"AbcClass\": \"C\", \"Contract\": \"MF2U2\", \"Description\": \"Fully Tracked Serial Part 01\", \"ExpectedLeadtime\": 0, \"FrequencyClass\": \"VerySlowMover\", \"InventoryValuationMethod\": \"StandardCost\", \"LeadTimeCode\": \"Purchased\", \"LifecycleStage\": \"Development\", \"ManufLeadtime\": 0, \"OnHandQty\": 0, \"PartNo\": \"SERPA01\", \"PartStatus\": \"A\", \"PurchLeadtime\": 0, \"TypeCode\": \"Purchased\", \"UnitMeas\": \"pcs\"}, {\"@odata.etag\": \"W/\\\"Vy8iQUFBUXptQUNP alue. Synonyms: UoM, measurement unit\",\"data_type\":\"Text\",\"label\":\"Uom\"},{\"name\":\"AttrValueNumeric\",\"description\":\"The numeric value of the characteristic. Synonyms: numeric value, measurement value, quantity value\",\"data_type\":\"Number\",\"label\":\"Attribute Value Numeric\"},{\"name\":\"AttrValueAlpha\",\"description\":\"The alphanumeric or text value of the characteristic. Synonyms: text value, string value, description value\",\"data_type\":\"Text\",\"label\":\"Attribute Value Alpha\"}],\"description\":\"Characteristics and specifications defined for this inventory part including numeric and alphanumeric attribute values with their units of measure. Synonyms: specifications, part attributes, technical data, properties. CAN NOT USE this nav_path construct $expand in query_options. If $expand=CharacteristicArray is used, then it throws error.\"},{\"nav_path\":\"InventoryPartBusinessObjectHandling.svc/InventoryPartSet(Contract={Contract},PartNo={Contract})/AlternativePartArray\",\"navigation_attributes\":[{\"name\":\"ETag\",\"data_type\":\"ETag\"},{\"name\":\"luname\",\"data_type\":\"Text\"},{\"name\":\"keyref\",\"data_type\":\"Text\"},{\"name\":\"Objgrants\",\"data_type\":\"Text\",\"label\":\"Granted access\"},{\"name\":\"Contract\",\"description\":\"The site where the inventory part is registered and managed. Synonyms: site, facility, plant, location, warehouse site\",\"data_type\":\"Text\",\"label\":\"Site\"},{\"name\":\"PartNo\",\"description\":\"The unique part number identifying the inventory part. Synonyms: item number, material number, stock number, part ID, SKU code, article number\",\"data_type\":\"Text\",\"label\":\"Part No\"},{\"name\":\"Description\",\"description\":\"Description of the alternative inventory part\",\"data_type\":\"Text\",\"label\":\"Description\"},{\"name\":\"NoteText\",\"description\":\"Notes or remarks related to this alternative part relationship\",\"data_type\":\"Text\",\"label\":\"Note text\"},{\"name\":\"AlternativePartNo\",\"description\":\"The part number of the alternative or substitute inventory part\",\"data_type\":\"Text\"},{\"name\":\"QtyOnHand\",\"description\":\"The total on-hand quantity available for the alternative part across all locations\",\"data_type\":\"Number\"}],\"description\":\"Alternative or substitute parts that can be used in place of this inventory part when it is unavailable. CAN NOT USE this nav_path construct $expand in query_options. If $expand=AlternativePartArray is used, then it throws error.\"}]}\\", "name": "GetBusinessObjectInfo", "role": "tool", "tool_call_id": "call_lf5WbtUea0rqQjuKlp9FPmlP"}, {"content": "", "role": "assistant", "tool_calls": [{"function": {"arguments": "{\"path\":\"InventoryPartBusinessObjectHandling.svc/InventoryPartSet\",\"luname\":\"InventoryPart\",\"query_options\":{\"$filter\":\"Contract eq 'EM-S1' and contains(Description,'DELL TV')\",\"$select\":[\"keyref\",\"Contract\",\"PartNo\",\"Description\",\"PurchLeadtime\",\"LeadTimeCode\",\"TypeCode\"],\"$top\":10}}", "name": "DoOdataCall"}, "id": "call_h5P7L1fR4vpD2rFxYXFDpsbk", "type": "function"}]}, {"content": "[{\"value\": \"Tool returned empty array\"}, {\"total_count\": 0}]", "name": "DoOdataCall", "role": "tool", "tool_call_id": "call_h5P7L1fR4vpD2rFxYXFDpsbk"}, {"content": "I couldn’t find any inventory parts at site EM-S1 whose Description contains “DELL TV”, so I can’t directly read an existing purchase lead time from the system for that exact description.\n\nHere’s how you can proceed to suggest parts and obtain purchase lead time based on similarity:\n\n1. Identify the correct part for “DELL TV”\n   - Check if “DELL TV” has:\n     - A specific Part No (e.g., from a catalog, PO, or inventory list).\n     - A slightly different description (e.g., “DELL LED TV 55IN”, “TV DELL 55”).\n   - Once we have the exact PartNo + site (Contract = EM-S1), we can:\n     - Read its PurchLeadtime (if it exists).\n     - See its TypeCode (should be Purchased) and LeadTimeCo     function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text == null ? "" : String(text);
      return div.innerHTML;
    }

    function shortConv(id) {
      if (!id) return "—";
      const s = String(id);
      return s.length > 12 ? s.slice(0, 8) + "…" : s;
    }

    function formatRoute(route) {
      return route ? escapeHtml(route) : "<em>(none)</em>";
    }

    function stateSummary(count) {
      if (count === 0) return "State object (empty)";
      if (count === 1) return "State object (1 message)";
      return `State object (${count} messages)`;
    }

    function buildCard(record) {
      const card = document.createElement("article");
      card.className = "card";
      card.dataset.search = [
        record.question,
        record.answer_text,
        record.active_route,
        record.conversation_id,
        record.history_id,
        record.token_compact,
      ].filter(Boolean).join(" ").toLowerCase();

      const tokensClass = record.token_usage.length ? "tokens" : "tokens none";
      const answerClass = record.answer_text ? "answer" : "answer empty";
      const answerContent = record.answer_text
        ? escapeHtml(record.answer_text)
        : "<em>(no answer text)</em>";

      card.innerHTML = `
        <div class="card-header">
          <div class="card-id">
            #${escapeHtml(record.history_id)}
            · ${escapeHtml(record.received_at || "—")}
            · <span class="conv">conv ${escapeHtml(shortConv(record.conversation_id))}</span>
          </div>
          <div class="card-route"><span class="label">Route:</span> ${formatRoute(record.active_route)}</div>
          <div class="${tokensClass}">${escapeHtml(record.token_compact)}</div>
        </div>
        <div class="card-body">
          <div class="field">
            <div class="field-label">Question</div>
            <div class="question">${escapeHtml(record.question || "")}</div>
          </div>
          <div class="field">
            <div class="field-label">Answer</div>
            <div class="${answerClass}">${answerContent}</div>
          </div>
          <details>
            <summary>${escapeHtml(stateSummary(record.state_count))}</summary>
            <pre></pre>
          </details>
          <details>
            <summary>Full answer JSON</summary>
            <pre></pre>
          </details>
        </div>
      `;

      const pres = card.querySelectorAll("pre");
      pres[0].textContent = JSON.stringify(record.state_object, null, 2);
      pres[1].textContent = JSON.stringify(record.answer, null, 2);

      return card;
    }

    function sortRecords(records) {
      return [...records].sort((a, b) => {
        const ta = a.received_at || "";
        const tb = b.received_at || "";
        return tb.localeCompare(ta);
      });
    }

    const cardsEl = document.getElementById("cards");
    const filterEl = document.getElementById("filter");
    const visibleCountEl = document.getElementById("visible-count");
    const noResultsEl = document.getElementById("no-results");

    const sorted = sortRecords(RECORDS);
    const cardElements = sorted.map((r) => {
      const el = buildCard(r);
      cardsEl.appendChild(el);
      return el;
    });

    function updateFilter() {
      const q = filterEl.value.trim().toLowerCase();
      let visible = 0;
      for (const card of cardElements) {
        const match = !q || card.dataset.search.includes(q);
        card.classList.toggle("hidden", !match);
        if (match) visible++;
      }
      visibleCountEl.textContent = q
        ? `${visible} of ${cardElements.length} shown`
        : `${cardElements.length} records`;
      noResultsEl.classList.toggle("hidden", visible > 0);
    }

    filterEl.addEventListener("input", updateFilter);
    updateFilter();
