ccount.\",\"data_type\":\"Text\",\"label\":\"Payment Institute\"}],\"non_expandable\":[{\"nav_path\":\"CashAccountBalanceBusinessObject.svc/CashAccountSet(Company={Company},ShortName={Company})/CashAccountBalanceArray\",\"navigation_attributes\":[{\"name\":\"ETag\",\"data_type\":\"ETag\"},{\"name\":\"luname\",\"data_type\":\"Text\"},{\"name\":\"keyref\",\"data_type\":\"Text\"},{\"name\":\"Objgrants\",\"data_type\":\"Text\",\"label\":\"Granted access\"},{\"name\":\"Company\",\"data_type\":\"Text\",\"label\":\"Company\"},{\"name\":\"ShortName\",\"data_type\":\"Text\",\"label\":\"Short Name\"},{\"name\":\"BalanceDate\",\"description\":\"The date as of which the cash account balance is stated. The reference date for calculating and displaying the cash account balance. Enables historical and point-in-time balance checks.\",\"data_type\":\"Date\",\"label\":\"Balance Date\"},{\"name\":\"BalanceDateBase\",\"description\":\"From which date balance date is based on. PAYDATE means based of payment date. (The cash balances will be presented based on the payment date. Actual date when the payment was executed or funds were transferred.Used for time-based balance analysis.)\\n         VOUDATE means based on voucher date. (The cash balances will be presented based on the voucher date for the payments. Date recorded on the payment voucher, used to determine when the transaction was officially documented. Supports compliance and audit queries.)\\n         Always indicate details without PAYDATE or VOUDATE words\",\"data_type\":\"Text\",\"label\":\"Balance Date Base\"},{\"name\":\"CalculatedBalance\",\"description\":\"Total Balance, The balance of the cash account as of the given date which is the difference between Incoming Cash and Outgoing Cash. If there are no transactions, the balance would be zero. Net balance of the cash account on the specified date, calculated as incoming cash minus outgoing cash. Defaults to zero if no transactions exist.\",\"data_type\":\"Number\",\"label\":\"Total Balance\"},{\"name\":\"CalculatedDebit\",\"description\":\"Incoming Cash, The amount by which the cash account balance is increased. Total inflow of funds into the cash account, representing deposits or receipts. Helps monitor liquidity and cash availability.\",\"data_type\":\"Number\",\"label\":\"Incoming Cash\"},{\"name\":\"CalculatedCredit\",\"description\":\"Outgoing Cash, The amount by which the cash account balance is reduced. Total outflow of funds from the cash account, representing withdrawals or payments. Used for expense tracking and variance analysis.\",\"data_type\":\"Number\",\"label\":\"Outgoing Cash\"}],\"description\":\"Contains Details Cash Account Balance Analysis which is used to view the balances of all the cash accounts of the company as of a given date. Cash Account Balance Analysis shows all company cash account balances for a specific date. It helps monitor liquidity, verify available funds, and support financial decisions by giving a clear snapshot of cash positions across accounts.. CAN NOT USE this nav_path construct $expand in query_options. If $expand=CashAccountBalanceArray is used, then it throws error.\"}]}\\", "name": "GetBusinessObjectInfo", "role": "tool", "tool_call_id": "call_7L4Vgfcze3hoqofeoDY9uNP1"}, {"content": "", "role": "assistant", "tool_calls": [{"function": {"arguments": "{\"path\":\"CashAccountBalanceBusinessObject.svc/CashAccountSet\",\"luname\":\"CashAccount\",\"query_options\":{\"$filter\":\"Company eq 'LK60' and ShortName eq 'BANK'\",\"$select\":[\"keyref\",\"Company\",\"ShortName\",\"AccountIdentity\",\"Currency\",\"InstituteId\"],\"$top\":1}}", "name": "DoOdataCall"}, "id": "call_G66Q3ACDXFQTYQX5B0D0yHda", "type": "function"}]}, {"content": "[{\"value\": [{\"@odata.etag\": \"W/\\\"Vy8iQUFBVFVyQUNPQUFId2lqQUFtOjIi\\\"\", \"AccountIdentity\": \"NL85RABO4781094090\", \"Company\": \"LK60\", \"Currency\": \"USD\", \"InstituteId\": \"BANK\", \"ShortName\": \"BANK\", \"keyref\": \"COMPANY=LK60^SHORT_NAME=BANK  you like me to prepare similar “golden” examples for other common cash-account or voucher queries (e.g., balances by PAYDATE, multi-currency accounts, or specific voucher types)?", "role": "assistant", "tool_calls": null}, {"id": "87954690-5d2d-4ddf-9dbe-02152658c93d"}], "state_count": 13, "token_usage": [{"tools": ["initial_request"], "prompt_tokens_used": 5966, "completion_tokens_used": 57, "tokens_used": 6023}], "token_compact": "initial_request 6023 (5966+57) · Σ6023"}, {"history_id": 1416, "conversation_id": "e609bf84-219f-431d-bcac-d4d7eff6101a", "question": "Golden dataset: good answer", "answer_text": "Thanks for confirming, and glad that answer matched your golden dataset.\n\nWould you like me to set up a reusable query (e.g., by status or site) so you can get similar counts quickly in the future?", "answer": {"answer": "Thanks for confirming, and glad that answer matched your golden dataset.\n\nWould you like me to set up a reusable query (e.g., by status or site) so you can get similar counts quickly in the future?", "data_points": [], "debugInfo": {"token_usage": [{"tools": ["initial_request"], "prompt_tokens_used": 12517, "completion_tokens_used": 53, "tokens_used": 12570}]}}, "active_route": "page/CopilotLog/List", "received_at": "2026-06-02T11:59:24", "state_object": [{"content": "How many shop orders do we have?", "role": "user"}, {"content": "", "role": "assistant", "tool_calls": [{"function": {"arguments": "{\"business_object_name\":\"shop order\"}", "name": "GetBusinessObject"}, "id": "call_AsoFAGnsnPPziRRnBxsf6TAj", "type": "function"}]}, {"content": "[{\"BusinessObject\": \"Shop Order\", \"Path\": \"ShopOrderBusinessObject.svc/ShopOrdSet\", \"Description\": \"Shop Order data for manufacturing, repair, prototype, disassembly, and remanufacturing. Includes: Shop Order details (order type, site, part, lot size, dates, scheduling direction, status), Shop Order Materials (component parts, quantities required/reserved/issued, scrap), Shop Order Operations (work centers, machine/labor time, crew size, operation status), and Produced Parts (main product, by-products, co-products, disassembly components). Use for questions about: shop order, shop order quantities, materials, reservations, operations, produced parts, order status, scheduling, demand pegging. Synonyms: Shop Order, SO, Work Order, Manufacturing Order, Production Order\", \"Synonyms\": [\"Shop Order\", \"SO\", \"S O\", \"Work Order\", \"Manufacturing Order\", \"Production Order\"]}, {\"BusinessObject\": \"Purchase Order\", \"Path\": \"PurchaseOrderBusinessObject.svc/PurchaseOrderSet\", \"Description\": \"Purchase Orders are the orders raised for Suppliers which consist of Purchase order lines that carry registered parts, unregistered parts, rental parts, their quantity, prices and delivery information\", \"Synonyms\": [\"Purchase Commitment\", \"Buying Request\", \"Purchase\", \"Procurement Order\", \"PurchaseOrder\", \"PO\"]}, {\"BusinessObject\": \"Contractor Order\", \"Path\": \"ContractorOrderBusinessObject.svc/ContractorOrderSet\", \"Description\": \"A Contractor Order represents a scope of work that is to be performed by an external contractor, the order can in some cases be under a contractor agreement. It defines the work to be performed, planned payments or fixed prices, not to exceed limits, and related administrative information needed to manage subcontracted tasks\", \"Synonyms\": [\"Contractor Order\", \"Subcontract Order\", \"External Work Order\", \"Contractor Work Order\", \"Subcontracting Order\"]}, {\"BusinessObject\": \"Work Order\", \"Path\": \"WorkOrderBusinessObject.svc/WorkOrderSet\", \"Description\": \"Business object for managing work orders, which are the central entities for maintenance, repair, or service jobs.\", \"Synonyms\": [\"Maintenance Order\", \"Service Order\", \"Job Order\", \"Repair Order\", \"Task Order\", \"Wo\"]}, {\"BusinessObject\": \"Delimitation Order\", \"Path\": \"DelimitationOrderBusinessObject.svc/DelimitationOrderSet\", \"Description\": \"Core business object representing information on isolation orders. It contains isolation planned dates, isolated objects, isolation execution information including establishment and reestablishment instructions, safety conditions, connected permits and work tasks and relevant sign off requirements.\", \"Synonyms\": [\"delimitation\", \"isolation order\"]}]", "name": "GetBusinessObject", "role": "tool", "tool_call_id": "call_AsoFAGnsnPPziRRnBxsf6TAj"}, {"content": "", "role": "assistant", "tool_calls": [{"function": {"arguments": "{\"path\":\"ShopOrderBusinessObject.svc/ShopOrdSet\",\"intent\":\"QUERY\"}", "name": "GetBusinessObjectInfo"}, "id": "call_JEJroCQm6KVXTRZTUy1HEAuB", "type": "function"}]}, {"content": "\\{\"api_endpoint\":\"ShopOrderBusinessObject.svc/ShopOrdSet\",\"summary\":\"This projection uses ShopOrder business object which contains Shop Order data for manufacturing, repair, prototype, disassembly, and remanufacturing. Includes: Shop Order details (order type, site, part, lot size, dates, scheduling direction, status), Shop Order Materials (component parts, quantities required/reserved/issued, scrap), Shop Order Operations (work centers, machine/labor time, crew size, operation status), and Produced Parts (main product, by-products, co-products, disassembly components). Use for questions about: shop order, shop order quantities, materials, reservations, operations, produced parts, order status, scheduling, demand pegging. Synonyms: Shop Order, SO, Work Order, Manufacturing Order, Production Order\",\"description\":\"Shop Order data for manufacturing, repair, prototype, disassembly, and remanufacturing. Includes: Shop Order details (order type, site, part, lot size, dates, scheduling direction, status), Shop Order Materials (component parts, quantities required/reserved/issued, scrap), Shop Order Operations (work centers, machine/labor time, crew size, operation status), and Produced Parts (main product, by-products, co-products, disassembly components). Use for questions about: shop order, shop order quantities, materials, reservations, operations, produced parts, order status, scheduling, demand pegging. Synonyms: Shop Order, SO, Work Order, Manufacturing Order, Production Order\",\"key_predicate\":\"(OrderNo = {OrderNo} AND ReleaseNo = {OrderNo} AND SequenceNo = {OrderNo})\",\"available_attributes\":[{\"name\":\"ETag\",\"data_type\":\"ETag\"},{\"name\":\"luname\",\"description\":\"The luname is: 'ShopOrd'\",\"data_type\":\"Text\"},{\"name\":\"keyref\",\"data_type\":\"Text\"},{\"name\":\"Objgrants\",\"data_type\":\"Text\",\"label\":\"Granted access\"},{\"name\":\"OrderNo\",\"description\":\"Synonyms: Order No, Order Number, Ord. One of key in ShopOrd entity\",\"data_type\":\"Text\",\"label\":\"Order No\"},{\"name\":\"ReleaseNo\",\"description\":\"Synonyms: Release No, Release Number, Rel. One of key in ShopOrd entity\",\"data_type\":\"Text\",\"label\":\"Release No\"},{\"name\":\"SequenceNo\",\"description\":\"Synonyms: Sequence No, Sequence Number, Seq. One of key in ShopOrd entity\",\"data_type\":\"Text\",\"label\":\"Sequence No\"},{\"name\":\"OrderCode\",\"description\":\"Synonyms: Order Code, Order Type. Indicates the type of shop order, possible values:\\n         Manufacturing: An order used to manufacture a product. It may result in by-products and disassembly components in addition to the manufactured product. The materials, produced parts and operations are copied from the selected Manufacturing type structure/routing. It can also be copied from a DOP(Dynamic Order Processing) order or project.\\n         Repair: An order used to repair a part. It may result in by-products, disassembly components and salvage parts in addition to the repaired part. The materials, produced parts and operations are copied from the Repair type structure/routing. The repair part is automatically added as a material line. For multilevel repair orders, the materials are added as a result of the component replacements. If the repair order originates from MRO/CRO, the materials and operations are controlled by these processes.\\n         Prototype: An order used to manufacture a prototype product. It may also result in by-products and disassembly components. The materials, produced parts and operations are copied from the selected Prototype or Manufacturing type structure/routing. A separate prototype revision allows you to keep prototyped items apart from the normal items in stock.\\n         Disassembly: An order used to disassemble a product into its components. It may result in by-products in addition to the disassembled components. The materials, produced parts and operations are copied from the selected Disassembly type structure/routing. The part to disassemble is automatically added as a material line.\\n         Remanufacturing: An order used to remanufacture a product. I.e., restoring it to a like-new condition. It may result in by-products and disassembly components in addition to the remanufactured product. The materials, produced parts and operations are copied from the selected Remanufacturing type structure/routing.\\n         MRO Disassembly: An order used to disassemble a part within the MRO process.\\n         MRO Assembly: An order used to assemble a part within the MRO process.\",\"data_type\":\"IfsApp.ShopOrderBusinessObject.ShopOrdCode\",\"enum\":[{\"client_value\":\"Manufacturing\",\"identifier\":\"Manufacturing\"},{\"client_value\":\"Repair\",\"identifier\":\"Repair\"},{\"client_value\":\"Prototype\",\"identifier\":\"Prototype\"},{\"client_value\":\"Disassembly\",\"identifier\":\"Disassembly\"},{\"client_value\":\"Remanufacturing\",\"identifier\":\"Remanufacturing\"},{\"client_value\":\"MRO Disassembly\",\"identifier\":\"MroDisassembly\"},{\"client_value\":\"MRO Assembly\",\"identifier\":\"MroAssembly\"},{\"client_value\":\"Disposition\",\"identifier\":\"Disposition\"},{\"client_value\":\"Purchase\",\"identifier\":\"Purchase\"}],\"label\":\"Order Code\"},{\"name\":\"Contract\",\"description\":\"Synonyms: Contract, Site, Production Site. This indicates the Contract or Site where the Shop Order is created\",\"data_type\":\"Text\",\"label\":\"Site\"},{\"name\":\"PartNo\",\"description\":\"Synonyms: Part No, Part Number, Part, Main Part, Parent Part, Manufactured Part. This is the Part No or Part Number which Shop Order is going to produce\",\"data_type\":\"Text\",\"label\":\"Part No\"},{\"name\":\"EngChgLevel\",\"description\":\"Synonyms: Engineering Change Level, Structure Revision, Eng Chg Level. This indicates product structure revision of the shop order main part\",\"data_type\":\"Text\",\"label\":\"Revision No\"},{\"name\":\"StructureAlternative\",\"description\":\"Structure Alternative. Indicates the product structure alternate of the shop order main part\",\"data_type\":\"Text\",\"label\":\"Structure Alternative\"},{\"name\":\"RoutingRevision\",\"description\":\"Routing Revision. Indicates the routing revision of the shop order main part\",\"data_type\":\"Text\",\"label\":\"Routing Revision\"},{\"name\":\"RoutingAlternative\",\"description\":\"Routing Alternative. Indicates the routing alternate of the shop order main part\",\"data_type\":\"Text\",\"label\":\"Operation\"},{\"name\":\"SerialBegin\",\"description\":\"Serial Begin, this only specified for a serialized part, the first number of the serial number range, if the shop order part is not serial tracked it will have *\",\"data_type\":\"Text\",\"label\":\"Serial Begin\"},{\"name\":\"SerialEnd\",\"description\":\"Serial End, this only specified for a serialized part, the last number of the serial number range, if the shop order part is not serial tracked it will have *\",\"data_type\":\"Text\",\"label\":\"Serial End\"},{\"name\":\"RevisedStartDate\",\"description\":\"Synonyms: Revised Start Date, Start Date. Indicates the date that the Shop Order needs to be started\",\"data_type\":\"Timestamp\",\"label\":\"Revised Start Date\"},{\"name\":\"RevisedDueDate\",\"description\":\"Synonyms: Revised Due Date, Finish Date. Indicates the date and time on which the shop order is scheduled to finish.\\n         I.e., the date/time on which the last operation is scheduled to finish plus its transport time.\",\"data_type\":\"Timestamp\",\"label\":\"Revised Due Date\"},{\"name\":\"NeedDate\",\"description\":\"Synonyms: Need Date, Wanted Date. Indicates the date when the parts manufactured in this shop order are required to have been received and available in inventory\",\"data_type\":\"Timestamp\",\"label\":\"Need Date\"},{\"name\":\"EarliestStartDate\",\"description\":\"Earliest Start Date. Indicates the earliest date on which the shop order should be started\",\"data_type\":\"Timestamp\",\"label\":\"Earliest Start Date\"},{\"name\":\"CloseDate\",\"description\":\"Closed Date, this is only available in the shop orders that are in Closed state, indicates the Closed date of the Shop Order\",\"data_type\":\"Timestamp\",\"label\":\"Close Date\"},{\"name\":\"RevisedQtyDue\",\"description\":\"Synonyms: Revised Quantity, Lot Size. Lot size is the total quantity to manufacture, repair, disassemble or remanufacture through the  Shop Order\",\"data_type\":\"Number\",\"label\":\"Revised Qty Due\"},{\"name\":\"QtyOnOrder\",\"description\":\"Synonyms: Pegged Quantity, Quantity On Order. The quantity of the ordered part that is pegged. This implies a fixed connection between a demand and a supply (sometimes called fixed booking).\\n         The pegged supply quantity, (when the parts are received into stock) will be automatically reserved for the demand\",\"data_type\":\"Number\",\"label\":\"Qty On Order\"},{\"name\":\"QtyComplete\",\"description\":\"Received Qty, indicates quantity of the Shop Order main parts completed and received into inventory\",\"data_type\":\"Number\",\"label\":\"Qty Complete\"},{\"name\":\"OperationScrapped\",\"description\":\"Scrapped Qty, indicates total quantity of the Shop Order main product that has been reported as scrapped on the shop order operations\",\"data_type\":\"Number\",\"label\":\"Operation Scrapped\"},{\"name\":\"DemandCode\",\"description\":\"Demand Code, the demand source for the shop order. For instance, the demand can originate from a customer order and the information may be Cust Order Trans, i.e., Customer Order Transit,\\n         another possible values are Invent Order,Shop Order,DOP Order, etc\",\"data_type\":\"IfsApp.ShopOrderBusinessObject.OrderSupplyType\",\"enum\":[{\"client_value\":\"Invent Order\",\"identifier\":\"InventOrder\"},{\"client_value\":\"Shop Order\",\"identifier\":\"ShopOrder\"},{\"client_value\":\"Purch Order Trans\",\"identifier\":\"PurchOrderTrans\"},{\"client_value\":\"Purch Order Dir\",\"identifier\":\"PurchOrderDir\"},{\"client_value\":\"Cust Order Trans\",\"identifier\":\"CustOrderTrans\"},{\"client_value\":\"Cust Order Dir\",\"identifier\":\"CustOrderDir\"},{\"client_value\":\"Work Order\",\"identifier\":\"WorkOrder\"},{\"client_value\":\"Non Inventory\",\"identifier\":\"NonInventory\"},{\"client_value\":\"Pkg\",\"identifier\":\"Pkg\"},{\"client_value\":\"Purch Order\",\"identifier\":\"PurchOrder\"},{\"client_value\":\"Int Demand\",\"identifier\":\"IntDemand\"},{\"client_value\":\"Int Purch Trans\",\"identifier\":\"IntPurchTrans\"},{\"client_value\":\"Int Purch Dir\",\"identifier\":\"IntPurchDir\"},{\"client_value\":\"Int Cust Trans\",\"identifier\":\"IntCustTrans\"},{\"client_value\":\"Int Cust Dir\",\"identifier\":\"IntCustDir\"},{\"client_value\":\"Service Order\",\"identifier\":\"ServiceOrder\"},{\"client_value\":\"Project\",\"identifier\":\"Project\"},{\"client_value\":\"DOP Order\",\"identifier\":\"DOPOrder\"},{\"client_value\":\"Not Decided\",\"identifier\":\"NotDecided\"},{\"client_value\":\"Design Object\",\"identifier\":\"PlantDesign\"},{\"client_value\":\"Sales Quotation\",\"identifier\":\"SalesQuotation\"},{\"client_value\":\"CTP Reservation\",\"identifier\":\"CTPReservation\"},{\"client_v ms: Shed Direction, Schedule Direction, Scheduling Direction. Indicates the scheduling direction of the shop order. possible values are:\\n         Backwards Scheduling: Last task is scheduled first to meet the need date, then earlier tasks are scheduled in reverse order\\n         Forward Scheduling: First task is scheduled as early as possible, followed by subsequent tasks in sequence\\n         Manual Scheduling: Both start and finish dates are entered directly and used unless rescheduled using forward or backward scheduling\",\"data_type\":\"IfsApp.ShopOrderBusinessObject.SchedDirection\",\"enum\":[{\"client_value\":\"Backwards Scheduling\",\"identifier\":\"BackwardsScheduling\"},{\"client_value\":\"Forward Scheduling\",\"identifier\":\"ForwardScheduling\"},{\"client_value\":\"Manual Scheduling\",\"identifier\":\"ManualScheduling\"}],\"label\":\"Sched Direction\"},{\"name\":\"ConfigurationId\",\"description\":\"Synonyms: Configuration Id, Conf Id. This is * when the Shop Order Main part is not Configurable, if Configuration Id has a number instead of *,\\n         it means Shop Order Main part is Configurable\",\"data_type\":\"Text\",\"label\":\"Configuration Id\"},{\"name\":\"Objstate\",\"description\":\"Synonyms: Status ,Shop Order status, Shop Order State, SO State\\n         Possible values are: Cancelled, Closed, Parked, Planned, Released, Reserved, Started\",\"data_type\":\"IfsApp.ShopOrderBusinessObject.ShopOrdState\",\"enum\":[{\"client_value\":\"Cancelled\",\"identifier\":\"Cancelled\"},{\"client_value\":\"Closed\",\"identifier\":\"Closed\"},{\"client_value\":\"Parked\",\"identifier\":\"Parked\"},{\"client_value\":\"Planned\",\"identifier\":\"Planned\"},{\"client_value\":\"Released\",\"identifier\":\"Released\"},{\"client_value\":\"Reserved\",\"identifier\":\"Reserved\"},{\"client_value\":\"Started\",\"identifier\":\"Started\"}],\"label\":\"State\"},{\"name\":\"MaterialStatus\",\"description\":\"Material Status, indicates the status of the materials nee  Required, Required Qty, Required Quantity. Indicates the quantity of the particular material/component/component part\\n         required to create the entire Quantity/Lot Size of the Shop Order\",\"data_type\":\"Number\",\"label\":\"Qty Required\"},{\"name\":\"SupplyCode\",\"description\":\"Synonyms: Supply Code, Supply Type. Indicates how the component part is planned to be supplied to the shop order. Possible values are:\\n         Invent Order: The component part is supplied from standard inventory. Supplies can be planned through MRP.\\n         Project Inventory: The component part is supplied from project inventory. Supplies can be planned through project MRP.\\n         Project: The component part is supplied from project inventory. Supplies should be handled manually as the material demand will not be considered in project MRP.\\n         Project Deliverables: The component part is supplied from a project deliverables item.\\n         DOP Order: The component part is supplied through DOP order(s). Supplies cannot be planned through MRP/ PMRP.\\n         Maintenance Repair and Overhaul: The component part is supplied from the MRO order structure.\\n         Component Repair Order: The component part is supplied from the pegged component repair order.\",\"data_type\":\"IfsApp.ShopMaterialAlloc.OrderSupplyType\",\"enum\":[{\"client_value\":\"Invent Order\",\"identifier\":\"InventOrder\"},{\"client_value\":\"Shop Order\",\"identifier\":\"ShopOrder\"},{\"client_value\":\"Purch Order Trans\",\"identifier\":\"PurchOrderTrans\"},{\"client_value\":\"Purch Order Dir\",\"identifier\":\"PurchOrderDir\"},{\"client_value\":\"Cust Order Trans\",\"identifier\":\"CustOrderTrans\"},{\"client_value\":\"Cust Order Dir\",\"identifier\":\"CustOrderDir\"},{\"client_value\":\"Work Order\",\"identifier\":\"WorkOrder\"},{\"client_value\":\"Non Inventory\",\"identifier\":\"NonInventory\"},{\"client_value\":\"Pkg\",\"identifier\":\"Pkg\"},{\"client_value\":\"Purch Order\",\"identifie onstruct $expand in query_options. If $expand=MaterialArray is used, then it throws error.\"},{\"nav_path\":\"ShopOrderBusinessObject.svc/ShopOrdSet(OrderNo={OrderNo},ReleaseNo={OrderNo},SequenceNo={OrderNo})/OperationArray\",\"navigation_attributes\":[{\"name\":\"ETag\",\"data_type\":\"ETag\"},{\"name\":\"luname\",\"data_type\":\"Text\"},{\"name\":\"keyref\",\"data_type\":\"Text\"},{\"name\":\"Objgrants\",\"data_type\":\"Text\",\"label\":\"Granted access\"},{\"name\":\"OrderNo\",\"description\":\"Synonyms: Order No, Order Number, Ord. One of key in ShopOrderOperation entity\",\"data_type\":\"Text\",\"label\":\"Order No\"},{\"name\":\"ReleaseNo\",\"description\":\"Synonyms: Release No, Release Number, Rel. One of key in ShopOrderOperation entity\",\"data_type\":\"Text\",\"label\":\"Release No\"},{\"name\":\"SequenceNo\",\"description\":\"Synonyms: Sequence No, Sequence Number, Seq. One of key in ShopOrderOperation entity\",\"data_type\":\"Text\",\"label\":\"Sequence No\"},{\"name\":\"OperationNo\",\"description\":\"Synonyms: Operation No, Operation Number. One of key in ShopOrderOperation entity\",\"data_type\":\"Number\",\"label\":\"Operation No\"},{\"name\":\"OperationDescription\",\"description\":\"Synonyms: Operation description, Operation des, Op Des. Describes what operation does\",\"data_type\":\"Text\",\"label\":\"Operation Description\"},{\"name\":\"OpSequenceNo\",\"description\":\"Synonyms: Op Sequence No, Operation Sequence Number. Indicates the order of execution of the operations\",\"data_type\":\"Number\",\"label\":\"Op Sequence No\"},{\"name\":\"MachRunFactor\",\"description\":\"Synonyms: Mach Run Factor, Machine Run Factor. Indicates the time required to use the machines or equipment for current operation together with the Run Time Code(factor unit)\",\"data_type\":\"Number\",\"label\":\"Mach Run Factor\"},{\"name\":\"MachSetupTime\",\"description\":\"Synonyms: Mach Setup Time, Machine Setup Time. Indicates the machine setup time required for the operation\",\"data_type\":\"Number\",\"label\":\"Mach Setup Time\"},{\"name\":\"MoveTime\",\"description\":\"Synonyms: Transport Time, Move Time. Indicates the time it takes to transport material from this operation. The default value is 0 (zero).\\n         The value for transport time must be 0 or greater\",\"data_type\":\"Number\",\"label\":\"Move Time\"},{\"name\":\"QueueTime\",\"description\":\"Synonyms: Queue Time, Waiting Time. Indicates the number of hours that this shop order operation must wait in a queue before being processed\",\"data_type\":\"Number\",\"label\":\"Queue Time\"},{\"name\":\"LaborRunFactor\",\"description\":\"Labor Run Factor. Indicates the labor run factor for the operation. Indicates value together with the factor unit, defines the time required for labor activity\",\"data_type\":\"Number\",\"label\":\"Labor Factor\"},{\"name\":\"CrewSize\",\"description\":\"Crew Size. Indicates the number of people required to run the operation. A value in this field is optional unless the labor run factor is greater than zero.\\n         A value 1 indicates one person is planned to work on the operation.\\n         A value \\u003e 1 indicates several people are planned to work on the operation.\\n         A value \\u003c 1 indicates a person is planned to work partially on the operation and is available to work on other operations simultaneously\",\"data_type\":\"Number\",\"label\":\"Crew Size\"},{\"name\":\"SetupCrewSize\",\"description\":\"Setup Crew Size, Indicates the number of people required to set up the operation. A value in this field is optional unless the labor setup time is greater than zero.\\n         A value 1 indicates one person is planned to work on the operation.\\n         A value \\u003e 1 indicates several people are planned to work on the operation.\\n         A value \\u003c 1 indicates a person is planned to work partially on the operation and is available to work on other operations simultaneously\",\"data_type\":\"Number\",\"label\":\"Setup Crew Size\"},{\"name\":\"OpStartDate\",\"description\":\"Synonyms: Operation Start Date/Time, Start Date/Time. Indicates date and time when the shop order operation will start\",\"data_type\":\"Timestamp\",\"label\":\"Op Start Date\"},{\"name\":\"OpFinishDate\",\"description\":\"Synonyms: Operation Finish Date/Time, Finish Date/Time. Indicates date and time when the shop order operation is scheduled to finish on this working day\",\"data_type\":\"Timestamp\",\"label\":\"Op Finish Date\"},{\"name\":\"RevisedQtyDue\",\"description\":\"Synonyms: Revised Quantity, Operation Qty. Indicates the quantity expected to pass through the operation. This value is originally set equal to the lot size of the shop order,\\n         or if the corresponding routing operation has a defined Operation Qty Factor it is set to that percentage of the lot size\",\"data_type\":\"Number\",\"label\":\"Revised Qty Due\"},{\"name\":\"QtyComplete\",\"description\":\"Synonyms: Completed Qty, Quantity Complete. Indicates the quantity completed on the operation\",\"data_type\":\"Number\",\"label\":\"Qty Complete\"},{\"name\":\"QtyScrapped\",\"description\":\"Synonyms: Scrapped Quantity, Scrapped Qty. Indicates the quantity that has been reported as scrapped on the shop order operation\",\"data_type\":\"Number\",\"label\":\"Qty Scrapped\"},{\"name\":\"SchedDirection\",\"description\":\"Synonyms: Schedule Direction, Sch Direction. Indicates the scheduling direction of the shop order operation.\\n         When a shop order is scheduled the scheduling direction of the operations will be set according to the scheduling direction of the shop order.\\n         However user can change the scheduling direction of an operation to any of the following values:\\n         Backwards Scheduling - The operation and operations preceding the operation are backward scheduled from its finish date,\\n         Forward Scheduling - The operation and operations succeeding the operation are forward scheduled from its start date,\\n         Manual Scheduling - The operation is scheduled by manually defining its start and finish dates\",\"data_type\":\"IfsApp.ShopOrderOperation.SchedDirection\",\"enum\":[{\"client_value\":\"Backwards Scheduling\",\"identifier\":\"BackwardsScheduling\"},{\"client_value\":\"Forward Scheduling\",\"identifier\":\"ForwardScheduling\"},{\"client_value\":\"Manual Scheduling\",\"identifier\":\"ManualScheduling\"}],\"label\":\"Sched Direction\"},{\"name\":\"OperStatusCode\",\"description\":\"Synonyms: Operation Status, Oper Status, Status. Indicates current status of the operation. Possible statuses for operations are:\\n         Planned - Operation not yet released. It is not possible to report on planned operations,\\n         Released - Operation ready to start,\\n         Setup Started - Operation setup started,\\n         Setup Completed - Operation setup completed,\\n         In Process - Work is currently ongoing on the operation,\\n         Partially reported - Run time and/or quantity has been reported on the operation but not finished. Can be reported on,\\n         Interruption - Operation clocking has been stopped with the stop reason Interrupted.However, further reporting of the operation is allowed by methods other than by operation clocking,\\n         Parked - Shop order is parked, Cancelled - Shop order is cancelled, Closed - Operation completed.Closed operations can only be reopened\",\"data_type\":\"IfsApp.ShopOrderOperation.OperStatusCode\",\"enum\":[{\"client_value\":\"Planned\",\"identifier\":\"Planned\"},{\"client_value\":\"Released\",\"identifier\":\"Released\"},{\"client_value\":\"Setup Started\",\"identifier\":\"SetupStarted\"},{\"client_value\":\"Setup Completed\",\"identifier\":\"SetupComplete\"},{\"client_value\":\"In Process\",\"identifier\":\"InProcess\"},{\"client_value\":\"Partially Reported\",\"identifier\":\"PartiallyReported\"},{\"client_value\":\"Interruption\",\"identifier\":\"Interruption\"},{\"client_value\":\ e\":\"Text\",\"label\":\"Setup Labor Class\"},{\"name\":\"ParallelOperation\",\"description\":\"Parallel Operation. Indicates whether the operation can be scheduled at the same time as the preceding non-parallel operation.\\n         Possible values are Parallel and Not Parallel.\",\"data_type\":\"IfsApp.ShopOrderOperation.ParallelOperation\",\"enum\":[{\"client_value\":\"Parallel\",\"identifier\":\"Parallel\"},{\"client_value\":\"Not parallel\",\"identifier\":\"NotParallel\"}],\"label\":\"Parallel Operation\"},{\"name\":\"WorkCenterCode\",\"description\":\"Work Center Code, indicates whether this is an internal or external work center, as defined in Work Center\",\"data_type\":\"IfsApp.ShopOrderOperation.WorkCenterCode\",\"enum\":[{\"client_value\":\"All\",\"identifier\":\"All\"},{\"client_value\":\"Internal work center\",\"identifier\":\"InternalWorkCenter\"},{\"client_value\":\"Outside work center\",\"identifier\":\"OutsideWorkCenter\"},{\"client_value\":\"Resource Requirement Planning\",\"identifier\":\"RrpWorkCenter\"}],\"label\":\"Work Center Code\"}],\"description\":\"This array contains information on the Operation related data that execute to create a Shop Order. CAN NOT USE this nav_path construct $expand in query_options. If $expand=OperationArray is used, then it throws error.\"},{\"nav_path\":\"ShopOrderBusinessObject.svc/ShopOrdSet(OrderNo={OrderNo},ReleaseNo={OrderNo},SequenceNo={OrderNo})/ShopOrderProductArray\",\"navigation_attributes\":[{\"name\":\"ETag\",\"data_type\":\"ETag\"},{\"name\":\"luname\",\"data_type\":\"Text\"},{\"name\":\"keyref\",\"data_type\":\"Text\"},{\"name\":\"Objgrants\",\"data_type\":\"Text\",\"label\":\"Granted access\"},{\"name\":\"OrderNo\",\"description\":\"Synonyms: Order No, Order Number, Ord. One of key in ManufacturedPart entity\",\"data_type\":\"Text\",\"label\":\"Order No\"},{\"name\":\"ReleaseNo\",\"description\":\"Synonyms: Release No, Release Number, Rel. One of key in ManufacturedPart entity\",\"data_type\":\"Text\",\"label\":\"Release No\"},{\"name\":\"SequenceNo\",\"description\":\"Synonyms: Sequence No, Sequence Number, Seq. One of key in ManufacturedPart entity\",\"data_type\":\"Text\",\"label\":\"Sequence No\"},{\"name\":\"PartNo\",\"description\":\"Synonyms: Part No, Part Number. One of key in ManufacturedPart entity\",\"data_type\":\"Text\",\"label\":\"Part No\"},{\"name\":\"LineItemNo\",\"description\":\"Synonyms: Line Item No, Line Item Number. One of key in ManufacturedPart entity,\\n         Line Item Number is -1 when Produced Part Type is Main Product,\\n         Line Item Number has values greater than 0 when Produced Part Type is not Main Product\",\"data_type\":\"Number\",\"label\":\"Line Item No\"},{\"name\":\"Contract\",\"description\":\"Synonyms: Contract, Site\",\"data_type\":\"Text\",\"label\":\"Site\"},{\"name\":\"QtyComplete\",\"description\":\"Synonyms: Received Quantity, Received Qty, Quantity Complete, Qty Complete.\\n         Indicates the quantity of the parts completed from the shop order and received into inventory\",\"data_type\":\"Number\",\"label\":\"Received Qty\"},{\"name\":\"QtyPerAssembly\",\"description\":\"Synonyms: Qty Per Assembly, Quantity Per Assembly, Quantity per Unit\",\"data_type\":\"Number\",\"label\":\"Qty Per Unit\"},{\"name\":\"RevisedQtyDue\",\"description\":\"Synonyms: Revised Qty Due, Revised Quantity Due, Lot Size. Indicates total quantity of the part to be produced on this shop order.\\n         Calculated as Shop Order Lot Size * QtyPerAssembly for this produced part line\",\"data_type\":\"Number\",\"label\":\"Lot Size\"},{\"name\":\"ProducedPartType\",\"description\":\"Synonyms: Produced Part Type, Prod Part Type, Type. Indicates the type of the produced part that produced from the shop order. Possible produced part values are:\\n         Main Product: The main shop order part manufactured, remanufactured or repaired on the shop order. This part is automatically added when the shop order is created. A Disassembly type , Shop Order Materials (component parts, quantities required/reserved/issued, scrap), Shop Order Operations (work centers, machine/labor time, crew size, operation status), and Produced Parts (main product, by-products, co-products, disassembly components). Use for questions about: shop order, shop order quantities, materials, reservations, operations, produced parts, order status, scheduling, demand pegging. Synonyms: Shop Order, SO, Work Order, Manufacturing Order, Production Order\", \"Synonyms\": [\"Shop Order\", \"SO\", \"S O\", \"Work Order\", \"Manufacturing Order\", \"Production Order\"]}, {\"BusinessObject\": \"Purchase Order\", \"Path\": \"PurchaseOrderBusinessObject.svc/PurchaseOrderSet\", \"Description\": \"Purchase Orders are the orders raised for Suppliers which consist of Purchase order lines that carry registered parts, unregistered parts, rental parts, their quantity, prices and delivery information\", \"Synonyms\": [\"Purchase Commitment\", \"Buying Request\", \"Purchase\", \"Procurement Order\", \"PurchaseOrder\", \"PO\"]}, {\"BusinessObject\": \"Contractor Order\", \"Path\": \"ContractorOrderBusinessObject.svc/ContractorOrderSet\", \"Description\": \"A Contractor Order represents a scope of work that is to be performed by an external contractor, the order can in some cases be under a contractor agreement. It defines the work to be performed, planned payments or fixed prices, not to exceed limits, and related administrative information needed to manage subcontracted tasks\", \"Synonyms\": [\"Contractor Order\", \"Subcontract Order\", \"External Work Order\", \"Contractor Work Order\", \"Subcontracting Order\"]}, {\"BusinessObject\": \"Work Order\", \"Path\": \"WorkOrderBusinessObject.svc/WorkOrderSet\", \"Description\": \"Business object for managing work orders, which are the central entities for maintenance, repair, or service jobs.\", \"Synonyms\": [\"Maintenance Order\", \"Service Order\", \"Job Order\", \"Repair Order\", \"Task Order\", \"Wo\"]}, {\"BusinessObject\": \"Delimitation Order\", \"Path\": \"DelimitationOrderBusinessObject.svc/DelimitationOrderSet\", \"Description\": \"Core business object representing information on isolation orders. It contains isolation planned dates, isolated objects, isolation execution information including establishment and reestablishment instructions, safety conditions, connected permits and work tasks and relevant sign off requirements.\", \"Synonyms\": [\"delimitation\", \"isolation order\"]}]", "name": "GetBusinessObject", "role": "tool", "tool_call_id": "call_alZgp3Z26SF4Dukk6Hzmz5Lr"}, {"content": "", "role": "assistant", "tool_calls": [{"function": {"arguments": "{\"path\":\"ShopOrderBusinessObject.svc/ShopOrdSet\",\"intent\":\"QUERY\"}", "name": "GetBusinessObjectInfo"}, "id": "call_VRF86FsbpBMbGGb35jBI0bZa", "type": "function"}]}, {"content": "\\{\"api_endpoint\":\"ShopOrderBusinessObject.svc/ShopOrdSet\",\"summary\":\"This projection uses ShopOrder business object which contains Shop Order data for manufacturing, repair, prototype, disassembly, and remanufacturing. Includes: Shop Order details (order type, site, part, lot size, dates, scheduling direction, status), Shop Order Materials (component parts, quantities required/reserved/issued, scrap), Shop Order Operations (work centers, machine/labor time, crew size, operation status), and Produced Parts (main product, by-products, co-products, disassembly components). Use for questions about: shop order, shop order quantities, materials, reservations, operations, produced parts, order status, scheduling, demand pegging. Synonyms: Shop Order, SO, Work Order, Manufacturing Order, Production Order\",\"description\":\"Shop Order data for manufacturing, repair, prototype, disassembly, and remanufacturing. Includes: Shop Order details (order type, site, part, lot size, dates, scheduling direction, status), Shop Order Materials (component parts, quantities required/reserved/issued, scrap), Shop Order Operations (work centers, machine/labor time, crew size, operation status), and Produced Parts (main product, by-products, co-products, disassembly components). Use for questions about: shop order, shop order quantities, materials, reservations, operations, produced parts, order status, scheduling, demand pegging. Synonyms: Shop Order, SO, Work Order, Manufacturing Order, Production Order\",\"key_predicate\":\"(OrderNo = {OrderNo} AND ReleaseNo = {OrderNo} AND SequenceNo = {OrderNo})\",\"available_attributes\":[{\"name\":\"ETag\",\"data_type\":\"ETag\"},{\"name\":\"luname\",\"description\":\"The luname is: 'ShopOrd'\",\"data_type\":\"Text\"},{\"name\":\"keyref\",\"data_type\":\"Text\"},{\"name\":\"Objgrants\",\"data_type\":\"Text\",\"label\":\"Granted access\"},{\"name\":\"OrderNo\",\"description\":\"Synonyms: Order No, Order Number, Ord. One of key in ShopOrd entity\",\"data_type\":\"Text\",\"label\":\"Order No\"},{\"name\":\"ReleaseNo\",\"description\":\"Synonyms: Release No, Release Number, Rel. One of key in ShopOrd entity\",\"data_type\":\"Text\",\"label\":\"Release No\"},{\"name\":\"SequenceNo\",\"description\":\"Synonyms: Sequence No, Sequence Number, Seq. One of key in ShopOrd entity\",\"data_type\":\"Text\",\"label\":\"Sequence No\"},{\"name\":\"OrderCode\",\"description\":\"Synonyms: Order Code, Order Type. Indicates the type of shop order, possible values:\\n         Manufacturing: An order used to manufacture a product. It may result in by-products and disassembly components in addition to the manufactured product. The materials, produced parts and operations are copied from the selected Manufacturing type structure/routing. It can also be copied from a DOP(Dynamic Order Processing) order or project.\\n         Repair: An order used to repair a part. It may result in by-products, disassembly components and salvage parts in addition to the repaired part. The materials, produced parts and operations are copied from the Repair type structure/routing. The repair part is automatically added as a material line. For multilevel repair orders, the materials are added as a result of the component replacements. If the repair order originates from MRO/CRO, the materials and operations are controlled by these processes.\\n         Prototype: An order used to manufacture a prototype product. It may also result in by-products and disassembly components. The materials, produced parts and operations are copied from the selected Prototype or Manufacturing type structure/routing. A separate prototype revision allows you to keep prototyped items apart from the normal items in stock.\\n         Disassembly: An order used to disassemble a product into its components. It may result in by-products in addition to the disassembled components. The materials, produced parts and operations are copied from the selected Disassembly type structure/routing. The part to disassemble is automatically added as a material line.\\n         Remanufacturing: An order used to remanufacture a product. I.e., restoring it to a like-new condition. It may result in by-products and disassembly components in addition to the remanufactured product. The materials, produced parts and operations are copied from the selected Remanufacturing type structure/routing.\\n         MRO Disassembly: An order used to disassemble a part within the MRO process.\\n         MRO Assembly: An order used to assemble a part within the MRO process.\",\"data_type\":\"IfsApp.ShopOrderBusinessObject.ShopOrdCode\",\"enum\":[{\"client_value\":\"Manufacturing\",\"identifier\":\"Manufacturing\"},{\"client_value\":\"Repair\",\"identifier\":\"Repair\"},{\"client_value\":\"Prototype\",\"identifier\":\"Prototype\"},{\"client_value\":\"Disassembly\",\"identifier\":\"Disassembly\"},{\"client_value\":\"Remanufacturing\",\"identifier\":\"Remanufacturing\"},{\"client_value\":\"MRO Disassembly\",\"identifier\":\"MroDisassembly\"},{\"client_value\":\"MRO Assembly\",\"identifier\":\"MroAssembly\"},{\"client_value\":\"Disposition\",\"identifier\":\"Disposition\"},{\"client_value\":\"Purchase\",\"identifier\":\"Purchase\"}],\"label\":\"Order Code\"},{\"name\":\"Contract\",\"description\":\"Synonyms: Contract, Site, Production Site. This indicates the Contract or Site where the Shop Order is created\",\"data_type\":\"Text\",\"label\":\"Site\"},{\"name\":\"PartNo\",\"description\":\"Synonyms: Part No, Part Number, Part, Main Part, Parent Part, Manufactured Part. This is the Part No or Part Number which Shop Order is going to produce\",\"data_type\":\"Text\",\"label\":\"Part No\"},{\"name\":\"EngChgLevel\",\"description\":\"Synonyms: Engineering Change Level, Structure Revision, Eng Chg Level. This indicates product structure revision of the shop order main part\",\"data_type\":\"Text\",\"label\":\"Revision No\"},{\"name\":\"StructureAlternative\",\"description\":\"Structure Alternative. Indicates the product structure alternate of the shop order main part\",\"data_type\":\"Text\",\"label\":\"Structure Alternative\"},{\"name\":\"RoutingRevision\",\"description\":\"Routing Revision. Indicates the routing revision of the shop order main part\",\"data_type\":\"Text\",\"label\":\"Routing Revision\"},{\"name\":\"RoutingAlternative\",\"description\":\"Routing Alternative. Indicates the routing alternate of the shop order main part\",\"data_type\":\"Text\",\"label\":\"Operation\"},{\"name\":\"SerialBegin\",\"description\":\"Serial Begin, this only specified for a serialized part, the first number of the serial number range, if the shop order part is not serial tracked it will have *\",\"data_type\":\"Text\",\"label\":\"Serial Begin\"},{\"name\":\"SerialEnd\",\"description\":\"Serial End, this only specified for a serialized part, the last number of the serial number range, if the shop order part is not serial tracked it will have *\",\"data_type\":\"Text\",\"label\":\"Serial End\"},{\"name\":\"RevisedStartDate\",\"description\":\"Synonyms: Revised Start Date, Start Date. Indicates the date that the Shop Order needs to be started\",\"data_type\":\"Timestamp\",\"label\":\"Revised Start Date\"},{\"name\":\"RevisedDueDate\",\"description\":\"Synonyms: Revised Due Date, Finish Date. Indicates the date and time on which the shop order is scheduled to finish.\\n         I.e., the date/time on which the last operation is scheduled to finish plus its transport time.\",\"data_type\":\"Timestamp\",\"label\":\"Revised Due Date\"},{\"name\":\"NeedDate\",\"description\":\"Synonyms: Need Date, Wanted Date. Indicates the date when the parts manufactured in this shop order are required to have been received and available in inventory\",\"data_type\":\"Timestamp\",\"label\":\"Need Date\"},{\"name\":\"EarliestStartDate\",\"description\":\"Earliest Start Date. Indicates the earliest date on which the shop order should be started\",\"data_type\":\"Timestamp\",\"label\":\"Earliest Start Date\"},{\"name\":\"CloseDate\",\"description\":\"Closed Date, this is only available in the shop orders that are in Closed state, indicates the Closed date of the Shop Order\",\"data_type\":\"Timestamp\",\"label\":\"Close Date\"},{\"name\":\"RevisedQtyDue\",\"description\":\"Synonyms: Revised Quantity, Lot Size. Lot size is the total quantity to manufacture, repair, disassemble or remanufacture through the  Shop Order\",\"data_type\":\"Number\",\"label\":\"Revised Qty Due\"},{\"name\":\"QtyOnOrder\",\"description\":\"Synonyms: Pegged Quantity, Quantity On Order. The quantity of the ordered part that is pegged. This implies a fixed connection between a demand and a supply (sometimes called fixed booking).\\n         The pegged supply quantity, (when the parts are received into stock) will be automatically reserved for the demand\",\"data_type\":\"Number\",\"label\":\"Qty On Order\"},{\"name\":\"QtyComplete\",\"description\":\"Received Qty, indicates quantity of the Shop Order main parts completed and received into inventory\",\"data_type\":\"Number\",\"label\":\"Qty Complete\"},{\"name\":\"OperationScrapped\",\"description\":\"Scrapped Qty, indicates total quantity of the Shop Order main product that has been reported as scrapped on the shop order operations\",\"data_type\":\"Number\",\"label\":\"Operation Scrapped\"},{\"name\":\"DemandCode\",\"description\":\"Demand Code, the demand source for the shop order. For instance, the demand can originate from a customer order and the information may be Cust Order Trans, i.e., Customer Order Transit,\\n         another possible values are Invent Order,Shop Order,DOP Order, etc\",\"data_type\":\"IfsApp.ShopOrderBusinessObject.OrderSupplyType\",\"enum\":[{\"client_value\":\"Invent Order\",\"identifier\":\"InventOrder\"},{\"client_value\":\"Shop Order\",\"identifier\":\"ShopOrder\"},{\"client_value\":\"Purch Order Trans\",\"identifier\":\"PurchOrderTrans\"},{\"client_value\":\"Purch Order Dir\",\"identifier\":\"PurchOrderDir\"},{\"client_value\":\"Cust Order Trans\",\"identifier\":\"CustOrderTrans\"},{\"client_value\":\"Cust Order Dir\",\"identifier\":\"CustOrderDir\"},{\"client_value\":\"Work Order\",\"identifier\":\"WorkOrder\"},{\"client_value\":\"Non Inventory\",\"identifier\":\"NonInventory\"},{\"client_value\":\"Pkg\",\"identifier\":\"Pkg\"},{\"client_value\":\"Purch Order\",\"identifier\":\"PurchOrder\"},{\"client_value\":\"Int Demand\",\"identifier\":\"IntDemand\"},{\"client_value\":\"Int Purch Trans\",\"identifier\":\"IntPurchTrans\"},{\"client_value\":\"Int Purch Dir\",\"identifier\":\"IntPurchDir\"},{\"client_value\":\"Int Cust Trans\",\"identifier\":\"IntCustTrans\"},{\"client_value\":\"Int Cust Dir\",\"identifier\":\"IntCustDir\"},{\"client_value\":\"Service Order\",\"identifier\":\"ServiceOrder\"},{\"client_value\":\"Project\",\"identifier\":\"Project\"},{\"client_value\":\"DOP Order\",\"identifier\":\"DOPOrder\"},{\"client_value\":\"Not Decided\",\"identifier\":\"NotDecided\"},{\"client_value\":\"Design Object\",\"identifier\":\"PlantDesign\"},{\"client_value\":\"Sales Quotation\",\"identifier\":\"SalesQuotation\"},{\"client_value\":\"CTP Reservation\",\"identifier\":\"CTPReservation\"},{\"client_value\":\"Maintenance Repair and Overhaul\",\"identifier\":\"MaintRepairAndOverhaul\"},{\"client_value\":\"Interim Order\",\"identifier\":\"InterimOrder\"},{\"client_value\":\"Automatic Sourcing\",\"identifier\":\"AutomaticSourcing\"},{\"client_value\":\"Project Inventory\",\"identifier\":\"ProjectInventory\"},{\"client_value\":\"Distribution Order\",\"identifier\":\"DistributionOrder\"},{\"client_value\":\"Production Schedule\",\"identifier\":\"ProductionSchedule\"},{\"client_value\":\"Distribution Allocation\",\"identifier\":\"DistributionAllocation\"},{\"client_value\":\"Component Repair Order\",\"identifier\":\"ComponentRepairOrder\"},{\"client_value\":\"Service Contract\",\"identifier\":\"ServiceContract\"},{\"client_value\":\"Business Opportunity\",\"identifier\":\"BusinessOpportunity\"},{\"client_value\":\"Component Repair Exchange\",\"identifier\":\"ComponentRepairExchange\"},{\"client_value\":\"Replacement Customer Order\",\"identifier\":\"ReplacementCustomerOrder\"},{\"client_value\":\"Replacement Purchase Order\",\"identifier\":\"ReplacementPurchaseOrder\"},{\"client_value\":\"Int Purch Replacement Order\",\"identifier\":\"IntPurchReplacementOrder\"},{\"client_value\":\"PM Action\",\"identifier\":\"Pm\"},{\"client_value\":\"Project Deliverables\",\"identifier\":\"ProjectDeliverables\"},{\"client_value\":\"Estimate\",\"identifier\":\"CostEstimation\"},{\"client_value\":\"Field Service Management\",\"identifier\":\"FieldServiceManagement\"},{\"client_value\":\"Demand Plan\",\"identifier\":\"DemandPlan\"},{\"client_value\":\"Work Task\",\"identifier\":\"WorkTask\"},{\"client_value\":\"Purchase Receipt\",\"identifier\":\"PurchaseReceipt\"},{\"client_value\":\"Purchase Requisition\",\"identifier\":\"PurchaseRequisition\"},{\"client_value\":\"Customer Schedule\",\"identifier\":\"CustomerSchedule\"},{\"client_value\":\"Cust Sched Merged Line\",\"identifier\":\"CustSchedMergedLine\"}],\"label\":\"Demand Code\"},{\"name\":\"SchedDirection\",\"description\":\"Synonyms: Shed Direction, Schedule Direction, Scheduling Direction. Indicates the scheduling direction of the shop order. possible values are:\\n         Backwards Scheduling: Last task is scheduled first to meet the need date, then earlier tasks are scheduled in reverse order\\n         Forward Scheduling: First task is scheduled as early as possible, followed by subsequent tasks in sequence\\n         Manual Scheduling: Both start and finish dates are entered directly and used unless rescheduled using forward or backward scheduling\",\"data_type\":\"IfsApp.ShopOrderBusinessObject.SchedDirection\",\"enum\":[{\"client_value\":\"Backwards Scheduling\",\"identifier\":\"BackwardsScheduling\"},{\"client_value\":\"Forward Scheduling\",\"identifier\":\"ForwardScheduling\"},{\"client_value\":\"Manual Scheduling\",\"identifier\":\"ManualScheduling\"}],\"label\":\"Sched Direction\"},{\"name\":\"ConfigurationId\",\"description\":\"Synonyms: Configuration Id, Conf Id. This is * when the Shop Order Main part is not Configurable, if Configuration Id has a number instead of *,\\n         it means Shop Order Main part is Configurable\",\"data_type\":\"Text\",\"label\":\"Configuration Id\"},{\"name\":\"Objstate\",\"description\":\"Synonyms: Status ,Shop Order status, Shop Order State, SO State\\n         Possible values are: Cancelled, Closed, Parked, Planned, Released, Reserved, Started\",\"data_type\":\"IfsApp.ShopOrderBusinessObject.ShopOrdState\",\"enum\":[{\"client_value\":\"Cancelled\",\"identifier\":\"Cancelled\"},{\"client_value\":\"Closed\",\"identifier\":\"Closed\"},{\"client_value\":\"Parked\",\"identifier\":\"Parked\"},{\"client_value\":\"Planned\",\"identifier\":\"Planned\"},{\"client_value\":\"Released\",\"identifier\":\"Released\"},{\"client_value\":\"Reserved\",\"identifier\":\"Reserved\"},{\"client_value\":\"Started\",\"identifier\":\"Started\"}],\"label\":\"State\"},{\"  management and warehouse operations.\",\"key_predicate\":\"(Contract = {Contract} AND PartNo = {Contract} AND ConfigurationId = {Contract} AND LocationNo = {Contract} AND LotBatchNo = {Contract} AND SerialNo = {Contract} AND EngChgLevel = {Contract} AND WaivDevRejNo = {Contract} AND ActivitySeq = {Contract} AND HandlingUnitId = {Contract})\",\"available_attributes\":[{\"name\":\"ETag\",\"data_type\":\"ETag\"},{\"name\":\"luname\",\"description\":\"The luname is: 'InventoryPartInStock'\",\"data_type\":\"Text\"},{\"name\":\"keyref\",\"data_type\":\"Text\"},{\"name\":\"Objgrants\",\"data_type\":\"Text\",\"label\":\"Granted access\"},{\"name\":\"Contract\",\"description\":\"The site (facility or plant) where the inventory part is stocked.\\n         Synonyms: site, plant, facility\",\"data_type\":\"Text\",\"label\":\"Site\"},{\"name\":\"PartNo\",\"description\":\"The unique identifier of the inventory part held in stock.\\n         Synonyms: part number, item number, material number, SKU\",\"data_type\":\"Text\",\"label\":\"Part No\"},{\"name\":\"ConfigurationId\",\"description\":\"The configuration identity of the part, used for configurable items. A value of '*' means a standard (non-configured) part.\\n         Synonyms: configuration, config ID\",\"data_type\":\"Text\",\"label\":\"Configuration Id\"},{\"name\":\"LocationNo\",\"description\":\"The inventory location number within the warehouse where the part is stored.\\n         Synonyms: location, bin location, stock location, storage location\",\"data_type\":\"Text\",\"label\":\"Location No\"},{\"name\":\"LotBatchNo\",\"description\":\"The lot or batch number assigned to the stocked part for traceability. A value of '*' means no lot/batch tracking.\\n         Synonyms: lot number, batch number, lot ID, batch ID\",\"data_type\":\"Text\",\"label\":\"Lot Batch No\"},{\"name\":\"SerialNo\",\"description\":\"The serial number of the individual part unit. A value of '*' means the part is not serial-tracked at this leve
